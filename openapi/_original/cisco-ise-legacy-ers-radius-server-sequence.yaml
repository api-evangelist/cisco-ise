    <tr><td style='font-family:monospace'>useAttrSetBeforeAcc</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>
    <tr style= 'background:#f8f8f8'><td style='font-family:monospace'>continueAuthorzPolicy</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>
    <tr><td style='font-family:monospace'>radiusServers</td><td>List</td><td>Yes</td><td>List with names of external radius server. The order of the names in the list is the order of servers that will be used during authentication</td><td></td><td>[ "externalRadiusServer1", "externalRadiusServer2" ]</td></tr>
