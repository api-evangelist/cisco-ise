aid: cisco-ise
name: Cisco Identity Services Engine
description: Cisco Identity Services Engine (ISE) is Cisco's network access control and zero-trust policy platform,
  handling 802.1X authentication, guest and BYOD onboarding, profiling, posture and TrustSec security-group policy.
  It exposes the External RESTful Services (ERS) API, an OpenAPI-documented set of newer endpoints served from the
  appliance itself, and pxGrid for security context exchange. Because the contract is served by each customer's
  own appliance, there is no central anonymously fetchable specification.
