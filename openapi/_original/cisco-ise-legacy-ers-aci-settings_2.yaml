      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/Result'
  /ers/config/acisettings/{id}:
    put:
      tags:
      - acisettings
      summary: Update ACI settings
      description: <p>This API allows the client to update ACI settings.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: id
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- apic.acisettings.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: The Token value from the GET X-CSRF-TOKEN fetch request
      - in: body
        name: request
        schema:
          $ref: '#/definitions/settings'
      responses:
        200:
          description: OK
          schema:
