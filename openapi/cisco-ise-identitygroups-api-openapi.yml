info:
  description: "Identity Groups API allows the client to search identity groups.  \n\n<h2>Revision History</h2>\n<table font-family:monospace> \n<tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Revision #</b></td><td><b>Resource Version</b></td><td><b>Cisco ISE Version</b></td><td><b>Description</b></td></tr>\n<tr><td>0</td><td>1.0</td><td>2.2</td><td>Initial Cisco ISE Version</td></tr>\n<tr style='background:#f8f8f8'><td>1</td><td>1.1</td><td>2.4</td><td>Added Create and GetByName operations</td></tr>\n<tr style='border-bottom:solid #CCCCCC 1.0pt'><td>2</td><td>1.2</td><td>3.2</td><td>Added Patch operation</td></tr>\n<tr style='border-bottom:solid #CCCCCC 1.0pt'><td>3</td><td>1.3</td><td>3.2</td><td>Added Delete operation</td></tr>\n</table>\n<br><br>\n\n<h2>Resource Definition</h2>\n<table>\n<tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Example Values</b></td></tr>\n<tr><td style='font-family:monospace'>name</td><td>String</td><td>Yes</td><td>Resource Name</td><td>GuestType_Weekly (default)</td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>id</td><td>String</td><td>No</td><td>Resource UUID, mandatory for update</td><td>9efe2310-8c01-11e6-996c-525400b48521</td></tr>\n<tr><td style='font-family:monospace'>description</td><td>String</td><td>No</td><td>Resource Description</td><td>Identity group mirroring the guest type</td></tr>\n<tr style= 'border-bottom:solid #CCCCCC 1.0pt; background:#f8f8f8'><td style='font-family:monospace'>parent</td><td>String</td><td>Yes</td><td></td><td>NAC Group:NAC:IdentityGroups:User Identity Groups</td></tr>\n</table>\n"
