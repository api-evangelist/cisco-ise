note: 'Derived from the schema graph of Cisco''s own published documents. Cisco ISE has no single object reference page, and
  the two surfaces model the same world twice: the ERS documents use XML-derived ERS resource shapes (with an id, a name and
  a link block), while the Open API documents use JSON wrappers of the form <Resource>Response / <Resource>ResponseWrapper.
  Relationships below are the ones the specs express explicitly through id-reference fields; they are not inferred from naming
  alone where the spec is silent.'
