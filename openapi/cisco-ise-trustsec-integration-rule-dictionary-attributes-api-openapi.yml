          type: string
          example: 1.0.0
          exampleSetFlag: true
      exampleSetFlag: false
    DictionaryAttribute:
      title: DictionaryAttribute
      required:
      - dataType
      - internalName
      - name
      type: object
      properties:
        allowedValues:
          type: array
          description: all of the allowed values for the dictionary attribute
          example: '[{"key":"key1"},{"value":"value1"},{"isDefault":true}]'
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/DictionaryAttributeAllowedValues'
            exampleSetFlag: false
        dataType:
          type: string
          description: the data type for the dictionary attribute
          example: IPV6
          exampleSetFlag: true
          enum:
          - BOOLEAN
          - DATE
          - FLOAT
          - INT
          - IP
          - IPV4
          - IPV6
          - IPV6INTERFACE
          - IPV6PREFIX
          - LONG
          - OCTET_STRING
          - STRING
          - UINT64
          - UNIT32
        description:
          type: string
          description: The description of the Dictionary attribute
          example: a dictionary attribute description
          exampleSetFlag: true
        dictionaryName:
          type: string
          description: the name of the dictionary which the dictionary attribute belongs to
          example: my dictionary
          exampleSetFlag: true
        directionType:
          type: string
          description: the direction for the useage of the dictionary attribute
          readOnly: true
          example: BOTH
          exampleSetFlag: true
          enum:
          - BOTH
          - IN
          - NONE
          - OUT
        id:
          type: string
          description: Identifier for the dictionary attribute
          format: uuid
          readOnly: true
          example: 12345678-f0e7-456b-a2d1-876543320b11
          exampleSetFlag: true
        internalName:
          type: string
          description: the internal name of the dictionary attribute
          example: my dictionary attribute internal name
          exampleSetFlag: true
        name:
          type: string
          description: The dictionary attribute's name
          example: my dictionary attribute
          exampleSetFlag: true
      description: Dictionary Attribute format
      exampleSetFlag: false
    DictionaryAttributeAllowedValues:
      title: DictionaryAttributeAllowedValues
      required:
      - key
      - value
      type: object
      properties:
        isDefault:
          type: boolean
          description: true if this key value is the default between the allowed values of the dictionary attribute
          example: true
          exampleSetFlag: true
        key:
          type: string
          exampleSetFlag: true
        value:
          type: string
          exampleSetFlag: true
      exampleSetFlag: false
