tags:
- name: identitygroups
paths:
  /ers/config/identitygroup/name/{name}:
    get:
      tags:
      - identitygroups
      summary: Get identity group by name
      description: <p>This API allows the client to get an identity group by name.</p>
      parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
      - in: header
        name: HTTP ERS-Media-Type Header
        description: Example:- identity.identitygroup.1.1
        required: false
        schema:
          type: string
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        description: Required Only if Enabled from GUI Example:- fetch
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/identitygroup_name'
            application/xml:
              schema:
                $ref: '#/components/schemas/identitygroup_name'
  /ers/config/identitygroup/{id}:
    get:
      tags:
      - identitygroups
      summary: Get identity group by ID
      description: <p>This API allows the client to get an identity group by ID.</p>
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - in: header
        name: HTTP ERS-Media-Type Header
        description: Example:- identity.identitygroup.1.1
        required: false
        schema:
          type: string
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        description: Required Only if Enabled from GUI Example:- fetch
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/identitygroup'
            application/xml:
              schema:
                $ref: '#/components/schemas/identitygroup'
    delete:
      tags:
      - identitygroups
      summary: Delete identity group
      description: <p>This API allows the client to delete an identity group.</p>
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - in: header
        name: HTTP ERS-Media-Type Header
        description: Example:- identity.identitygroup.1.1
        required: false
        schema:
          type: string
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        description: Required Only if Enabled from GUI Example:- fetch
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/identitygroup'
            application/xml:
              schema:
                $ref: '#/components/schemas/identitygroup'
    patch:
      tags:
      - identitygroups
      summary: Update part of the identity group by ID
      description: <p>This API allows the user to update part of the identity group by ID.</p>
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - in: header
        name: HTTP ERS-Media-Type Header
        description: Example:- identity.identitygroup.1.1
        required: false
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/identitygroup'
            application/xml:
              schema:
                $ref: '#/components/schemas/identitygroup'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/patchRequest'
          application/xml:
            schema:
              $ref: '#/components/schemas/patchRequest'
    put:
      tags:
      - identitygroups
      summary: Update identity group
      description: <p>This API allows the client to update an identity group.</p>
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - in: header
        name: HTTP ERS-Media-Type Header
        description: Example:- identity.identitygroup.1.1
        required: false
        schema:
          type: string
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        description: The Token value from the GET X-CSRF-TOKEN fetch request
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Update'
            application/xml:
              schema:
                $ref: '#/components/schemas/Update'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/identitygroup'
          application/xml:
            schema:
              $ref: '#/components/schemas/identitygroup'
  /ers/config/identitygroup:
    get:
      tags:
      - identitygroups
      summary: Get all identity groups
      description: <p>This API allows the client to get all the identity groups.</p> <p><h1>Filter:</h1> <h3>[name, description]</h3></p> <p>To search guest users by using <b>toDate</b> column,follow the format:</p> <p>DD-MON-YY (Example:13-SEP-18)</p> <ul> <li><p>Day or Year:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13</p></li> <li><p>Month:GET /ers/config/guestuser/?filter=toDate.CONTAINS.SEP</p></li> <li><p>Date:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13-SEP-18</p></li> </ul> <p><h1>Sorting:</h1> <h3>[name, description]</h3></p>
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        description: Example:- identity.identitygroup.1.1
        required: false
        schema:
          type: string
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        description: Required Only if Enabled from GUI Example:- fetch
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/search'
            application/xml:
              schema:
                $ref: '#/components/schemas/search'
    post:
      tags:
      - identitygroups
      summary: Create identity group
      description: <p>This API creates an identity group.</p>
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        description: Example:- identity.identitygroup.1.1
        required: false
        schema:
          type: string
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        description: The Token value from the GET X-CSRF-TOKEN fetch request
        schema:
          type: string
      responses:
        201:
          description: Created
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/identitygroup'
          application/xml:
            schema:
              $ref: '#/components/schemas/identitygroup'
  /ers/config/identitygroup/versioninfo:
    get:
      tags:
      - identitygroups
      summary: Get identity group version information
      description: <p>This API helps to retrieve the version information related to identity group.</p>
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
