tags:
- name: Node Group
paths:
  /deployment/node-group:
    get:
      summary: Retrieve the list of all the node groups
      operationId: getNodeGroups
      description: 'This API retrieves the details of all the node groups in the cluster.

        Each node group retrieved consists of name, description and MAR cache details like query-attempts, query-timeout, replication-attempts, replication-timeout.'
      tags:
      - Node Group
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeGroupsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Node groups not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Create a node group
      operationId: createNodeGroup
      description: '.nodeGroupTable td , .nodeGroupTable th { padding: 5px 10px !important; text-align: left;} This API creates a node group in the cluster. A node group is a group of PSNs, where the PSNs maintain a heartbeat with each other. It is used primarily to terminate or transfer posture-pending sessions when a PSN in a local node group fails. Node group members can communicate over TCP/7800.


        The following parameters are used in the request body of the API:


        PARAMETER DESCRIPTION EXAMPLE


        name* required Name of the node group(valid-range: 1-100 characters) {"name": "site1"}


        description Description of the node group (valid-range: 1-256 characters) {"name": "site2", "description": "sample"}


        query-attempts The number of times Cisco ISE attempts to perform the cache entry query. (valid-range: 0 - 5, default-value: 1) {"name": "site3","marCache": {"query-attempts": 1}}


        query-timeout The time, in seconds, after which a cache entry query times out. (valid-range: 1 - 10, default-value: 2) second(s) {"name": "site4","marCache": {"query-timeout": 2}}

        replication-attempts The number of times Cisco ISE attempts to perform MAR cache entry replication. (valid-range: 0 - 5, default-value: 2) {"name": "site5","marCache": {"replication-attempts": 2}}


        replication-timeout The time, in seconds, after which the cache entry replication times out. (valid-range: 1 - 10, default-value: 5) second(s) {"name": "site6","marCache": {"replication-timeout": 5}}


        NOTE 1: : Node group name and description cannot contain any of the following characters: ! % ^ : ; , . ~ @ # & [ { ( | ) } ] ` > NOTE 2: : Parameter marCache stands for Machine Access Restriction (MAR) cache that provides an additional means of controlling authorization for Active Directory-authentication users. We can enable the marCache for a nodegroup by providing key "marCache" in json request. Additionally we may also provide any combination of parameters - query-attempts, query-timeout, replication-attempts, replication-timeout in marCache object. If no value is specified for a particular parameter its default value will be recorded.If no marCache object is given, marCache will be considered as disabled.'
      tags:
      - Node Group
      requestBody:
        description: Details of new node group to be created.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeGroupConfig'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict. Node group already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /deployment/node-group/{nodeGroupName}:
    get:
      summary: Retrieve the details of a node group
      operationId: getNodeGroup
      description: This API retrieves the details of a node group in the cluster using a node group name.
      tags:
      - Node Group
      parameters:
      - name: nodeGroupName
        in: path
        description: Name of the existing node group.
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_ ]{1,100}$
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeGroupResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Node groups not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Update an existing node group
      operationId: updateNodeGroup
      description: Update an existing node group.
      tags:
      - Node Group
      parameters:
      - name: nodeGroupName
        in: path
        description: Name of the existing node group.
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_ ]{1,100}$
          type: string
      requestBody:
        description: Details of the exiting node group that must be updated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NodeGroupConfig'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden [Updating a node group whose name does not match with the payload is forbidden].
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Node group does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Delete a node group
      operationId: deleteNodeGroup
      description: Delete an existing node group in the cluster. Deleting the node group does not delete the nodes, but failover is no longer carried out among the nodes.
      tags:
      - Node Group
      parameters:
      - name: nodeGroupName
        in: path
        description: Name of the existing node group.
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_ ]{1,100}$
          type: string
      - name: forceDelete
        in: query
        description: Force delete the group even if the node group contains one or more nodes.
        required: true
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden [Node group contains one or more nodes.]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Node group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /deployment/node-group/{nodeGroupName}/add-node:
    post:
      summary: Add a node to a node group
      operationId: addNode
      description: '.nodeGroupTable td , .nodeGroupTable th { padding: 5px 10px !important; text-align: left;} This API adds a node to the node group in the cluster. When a node that belongs to a node group fails, another node in the same node group issues a Change of Authorization (CoA) for all the URL-redirected sessions on the failed node.


        The following parameters are used in the request body of the API:


        PARAMETER DESCRIPTION EXAMPLE


        hostname* required Name of the host name {"hostname": "isenode"}'
      tags:
      - Node Group
      parameters:
      - name: nodeGroupName
        in: path
        description: Name of the existing node group.
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_ ]{1,100}$
          type: string
      requestBody:
        description: Hostname of the node that must be added to the node group.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hostname'
            example:
              Hostname: isenode
      responses:
        '201':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Node/Nodegroup not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict. The node is already part of a node group.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /deployment/node-group/{nodeGroupName}/remove-node:
    post:
      summary: Remove a node from a node group
      operationId: removeNode
      description: '.nodeGroupTable td , .nodeGroupTable th { padding: 5px 10px !important; text-align: left;} Purpose of this API is to remove a node from a node group in the cluster. Removing node from the node group does not delete the node, but failover is no longer carried out if the node is not part any node group.


        The following parameters are used in the request body of the API:


        PARAMETER DESCRIPTION EXAMPLE


        hostname* required Name of the host name {"hostname": "isenode"}'
      tags:
      - Node Group
      parameters:
      - name: nodeGroupName
        in: path
        description: Name of the existing node group.
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_ ]{1,100}$
          type: string
      requestBody:
        description: Hostname of the node that must be deleted from the node group.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Hostname'
            example:
              Hostname: isenode
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          description: Node not found in the node group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /deployment/node-group/{nodeGroupName}/node:
    get:
      summary: Retrieve the list of nodes in a given node group
      operationId: getNodes
      description: This API retrieves the list of nodes associated with a node group in the cluster with a given node group name.
      tags:
      - Node Group
      parameters:
      - name: nodeGroupName
        in: path
        description: Name of the existing node group.
        required: true
        schema:
          pattern: ^[a-zA-Z0-9_ ]{1,100}$
          type: string
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeGroupNodesResponse'
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Node group not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          $ref: '#/components/schemas/Message'
        version:
          type: string
          example: 1.0.0
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Message'
        version:
          type: string
          example: 1.0.0
    NodeGroupConfig:
      type: object
      properties:
        name:
          pattern: ^[a-zA-Z0-9_ ]{1,100}$
          type: string
          example: site1
        description:
          $ref: '#/components/schemas/Description'
        marCache:
          type: object
          properties:
            replication-timeout:
              description: 'The time, in seconds, after which the cache entry replication times out. (1 - 10).

                '
              minimum: 1
              maximum: 10
              default: 5
              type: integer
              example: 5
            replication-attempts:
              description: 'The number of times Cisco ISE attempts to perform MAR cache entry replication. (0 - 5).

                '
              minimum: 0
              maximum: 5
              default: 2
              type: integer
              example: 2
            query-timeout:
              description: 'The time, in seconds, after which the cache entry query times out. (1 - 10).

                '
              minimum: 1
              maximum: 10
              default: 2
              type: integer
              example: 2
            query-attempts:
              description: 'The number of times Cisco ISE attempts to perform the cache entry query. (0 - 5).

                '
              minimum: 0
              maximum: 5
              default: 1
              example: 1
              type: integer
          example: TBD
      required:
      - name
    Description:
      maxLength: 256
      minLength: 1
      pattern: '[a-zA-Z][a-zA-Z0-9\\-_ ]*'
      type: string
    Hostname:
      type: object
      properties:
        hostname:
          pattern: '[a-zA-Z][\w\-]*'
          maxLength: 64
          minLength: 1
          type: string
          example: isenode
    NodeGroupsResponse:
      type: object
      properties:
        response:
          type: array
          items:
            $ref: '#/components/schemas/NodeGroupConfig'
          example: TBD
        version:
          type: string
          example: 1.0.0
    NodeGroupNodesResponse:
      type: object
      properties:
        response:
          type: array
          items:
            $ref: '#/components/schemas/Hostname'
          example:
          - hostname: isenode1
          - hostname: isenode2
        version:
          type: string
          example: 1.0.0
    Message:
      type: object
      properties:
        message:
          type: string
          example: Success
    NodeGroupResponse:
      type: object
      properties:
        response:
          type: object
          $ref: '#/components/schemas/NodeGroupConfig'
          example: TBD
        version:
          type: string
          example: 1.0.0
