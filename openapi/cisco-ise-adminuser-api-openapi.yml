  /ers/config/adminuser:
    get:
      tags:
      - adminuser
      summary: Get all admin users
      description: '<p>This API allows the client to get all admin users.</p>

        <p><h1>Filter:</h1>Filters can be used to filter admin users based on a set of attributes. This API currently provides the following filters:</p>

        <p><h3>[firstName, lastName, adminGroups, name, description, inactiveAccountNeverDisabled, includeSystemAlarmsInEmail, email, enabled]</h3></p>

        <p>To search admin users by using <b>toDate</b> column, follow the format: DD-MON-YY (Example: 13-SEP-18)</p>

        <ul>

        <li><p>Day or Year: GET /ers/config/guestuser/?filter=toDate.CONTAINS.13</p></li>

        <li><p>Month: GET /ers/config/guestuser/?filter=toDate.CONTAINS.SEP</p></li>

        <li><p>Date: GET /ers/config/guestuser/?filter=toDate.CONTAINS.13-SEP-18</p></li>

        </ul>

        <p><h1>Sorting:</h1><h3>[name, description]</h3></p>

        '
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        description: Example:- identity.adminuser.1.3
        required: false
        schema:
          type: string
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        description: Required Only if Enabled from GUI Example:- fetch
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
