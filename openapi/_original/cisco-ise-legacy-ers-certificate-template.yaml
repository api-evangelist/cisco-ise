        example: 3
      resources:
        type: array
        example:
        - id: 3e38b378-ccea-5a56-e053-59e447ab5775
          name: CA_SERVICE_Certificate_Template
          description: This template will be used when other network service using ISE as a CA
          link:
            rel: self
            href: https://<ise-ip>:9060/ers/config/certificatetemplate/3e38b378-ccea-5a56-e053-59e447ab5775
            type: application/json
        - id: 3e38b378-ccf4-5a56-e053-59e447ab5775
          name: pxGrid_Certificate_Template
          description: This template will be used when we generate a pxGrid certificate from the Certificate Provisioning
