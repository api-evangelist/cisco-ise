      type: object
      properties:
        MFCInfoEndpointType:
          type: array
          exampleSetFlag: true
          items:
            type: string
            exampleSetFlag: false
        MFCInfoHardwareManufacturer:
          type: array
          exampleSetFlag: true
          items:
            type: string
            exampleSetFlag: false
        MFCInfoHardwareModel:
          type: array
          exampleSetFlag: true
          items:
            type: string
            exampleSetFlag: false
        MFCInfoOperatingSystem:
          type: array
          exampleSetFlag: true
          items:
            type: string
            exampleSetFlag: false
      exampleSetFlag: false
    PolicyAndStatus:
