components:
  schemas:
    Contract:
      title: Contract
      type: object
      properties:
        dn:
          type: string
          example: uni/tn-tn1/brc-contract1
          exampleSetFlag: true
        name:
          type: string
          example: contract1
          exampleSetFlag: true
      exampleSetFlag: false
    AciConnectionStatusResponse:
      title: AciConnectionStatusResponse
      type: object
      properties:
        response:
          type: array
          description: Connection name to be used to filter out the metadata
          example: '["ACI1","ACI2"]'
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/AciConnectionStatus'
            exampleSetFlag: false
        version:
          type: string
          exampleSetFlag: true
      description: List of AciConnectionStatus
      exampleSetFlag: false
    AciConnectionSummaryResponse:
      title: AciConnectionSummaryResponse
      type: object
      properties:
        response:
          type: array
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/AciConnectionSummary'
            exampleSetFlag: false
        version:
          type: string
          exampleSetFlag: true
      exampleSetFlag: false
    L3Out:
      title: L3Out
      type: object
      properties:
        l3out:
          type: string
          example: l3out1
          exampleSetFlag: true
        tn:
          type: string
          example: tenant1
          exampleSetFlag: true
        vn:
          type: string
          example: vn1
          exampleSetFlag: true
      exampleSetFlag: false
    SgtRange:
      title: SgtRange
      required:
      - high
      - low
      type: object
      properties:
        high:
          type: integer
          format: int32
          exampleSetFlag: true
        low:
          type: integer
          format: int32
          exampleSetFlag: true
      description: SGT range
      exampleSetFlag: false
    ActionRequest:
      title: ActionRequest
      type: object
      properties:
        ConnectionIDs:
          type: array
          exampleSetFlag: true
          items:
            type: string
            exampleSetFlag: false
        action:
          type: string
          exampleSetFlag: true
          enum:
          - Connect
          - Delete
          - Suspend
      description: connect, suspend or delete multiple ACI connections
      exampleSetFlag: false
    Error:
      title: Error
      required:
      - code
      - message
      type: object
      properties:
        code:
          type: integer
          format: int32
          example: 400
          exampleSetFlag: true
        message:
          type: string
          example: Some error occurred
          exampleSetFlag: true
      exampleSetFlag: false
    NameConversion:
      title: NameConversion
      type: object
      properties:
        affixType:
          type: string
          exampleSetFlag: true
          enum:
          - PREFIX
          - SUFFIX
        affixValue:
          type: string
          description: Prefix or suffix value
          exampleSetFlag: true
        attributeConversions:
          type: array
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/AttributeConversion'
            exampleSetFlag: false
        attributeTypes:
          type: array
          exampleSetFlag: true
          items:
            type: string
            exampleSetFlag: false
            enum:
            - AP
            - CONNECTION_NAME
            - EPG_TYPE
            - TN
            - VN
        method:
          type: string
          description: 'Name conversion method:   * `ATTRIBUTE` - Use attributeTypes and attributeConversions to convert name   * `AFFIX` - Use affixType and affixValue to convert name '
          exampleSetFlag: true
          enum:
          - AFFIX
          - ATTRIBUTE
      description: Name conversion configuration
      exampleSetFlag: false
    DomainListResponseEntity:
      title: DomainListResponseEntity
      type: object
      properties:
        response:
          type: array
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/DomainList'
            exampleSetFlag: false
      exampleSetFlag: false
    AciConnectionByIdStatusResponse:
      title: AciConnectionByIdStatusResponse
      type: object
      properties:
        response:
          $ref: '#/components/schemas/AciConnectionStatus'
          exampleSetFlag: true
        version:
          type: string
          exampleSetFlag: true
      exampleSetFlag: false
    AciConnection:
      title: AciConnection
      required:
      - hostname
      - name
      - username
      type: object
      properties:
        connMode:
          type: string
          description: Out-of-Band/In-Band
          exampleSetFlag: true
        domain:
          type: string
          description: Auth Domain
          example: Default
          exampleSetFlag: true
        errorReason:
          type: string
          example: error reason
          exampleSetFlag: true
        hostname:
          type: string
          description: ACI hostname or IP address
          example: 10.0.0.1
          exampleSetFlag: true
        id:
          type: string
          readOnly: true
          exampleSetFlag: true
        learnedIPs:
          type: array
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/AciConnectionAllOfLearnedIPs'
            exampleSetFlag: false
        name:
          type: string
          description: ACI name
          example: ACI1
          exampleSetFlag: true
        nameConversion:
          $ref: '#/components/schemas/NameConversion'
          exampleSetFlag: true
        password:
          type: string
          description: Password
          example: password1
          exampleSetFlag: true
        selectedEpgs:
          type: array
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/Epg'
            exampleSetFlag: false
        sgtRanges:
          type: array
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/SgtRange'
            exampleSetFlag: false
        state:
          type: string
          description: Corresponding actions will change the state of the connection
          readOnly: true
          exampleSetFlag: true
          enum:
          - CONNECT
          - CONNECTING
          - DELETE_ERROR
          - DELETING
          - ERROR
          - SUSPEND
          - UNDEPLOYED
        usedSgtRanges:
          type: array
          description: SGT ranges used by the connection
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/SgtRange'
            exampleSetFlag: false
        username:
          type: string
          description: Username
          example: user1
          exampleSetFlag: true
        validateCertificate:
          type: boolean
          description: ValidationCertificate
          example: false
          exampleSetFlag: true
      exampleSetFlag: false
    AciConnectionAllOfLearnedIPs:
      title: AciConnectionAllOfLearnedIPs
      type: object
      properties:
        ipaddress:
          type: string
          exampleSetFlag: true
        name:
          type: string
          exampleSetFlag: true
        status:
          type: boolean
          example: false
          exampleSetFlag: true
      exampleSetFlag: false
    ContractInterface:
      title: ContractInterface
      type: object
      properties:
        dn:
          type: string
          example: uni/tn-tn1/cif-contractIf1
          exampleSetFlag: true
        name:
          type: string
          example: contractIf1
          exampleSetFlag: true
      exampleSetFlag: false
    EgressFilterDestination:
      title: EgressFilterDestination
      type: object
      properties:
        l3outs:
          type: array
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/L3Out'
            exampleSetFlag: false
        name:
          type: string
          example: ACI1
          exampleSetFlag: true
        type:
          type: string
          exampleSetFlag: true
          enum:
          - ACI
          - SXP_SPEAKER
      description: Destinations mapped to l3outs used in the outbound rule destination configurations
      exampleSetFlag: false
    AciTenantContractListResponseEntity:
      title: AciTenantContractListResponseEntity
      type: object
      properties:
        response:
          type: array
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/AciTenantContract'
            exampleSetFlag: false
        version:
          type: string
          exampleSetFlag: true
      exampleSetFlag: false
    ReadinessResponse:
      title: ReadinessResponse
      type: object
      properties:
        OldAciConnectionCheck:
          type: boolean
          example: true
          exampleSetFlag: true
        PxGridCheck:
          type: boolean
          example: true
          exampleSetFlag: true
        SXPDefaultDeviceCheck:
          type: boolean
          example: true
          exampleSetFlag: true
        SXPServiceCheck:
          type: boolean
          example: true
          exampleSetFlag: true
        SXPviaPxGridCheck:
          type: boolean
          example: true
          exampleSetFlag: true
        notReadyReason:
          type: string
          example: Failed to enable SXP services
          exampleSetFlag: true
        ready:
          type: boolean
          example: true
          exampleSetFlag: true
        urlRedirect:
          type: string
          example: /admin/#workcenters/workcenter_trustsec/workcenter_trustsec_settings/apic
          exampleSetFlag: true
      exampleSetFlag: false
    EgressFilterDestinationList:
      title: EgressFilterDestinationList
      type: object
      properties:
        destinations:
          type: array
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/EgressFilterDestination'
            exampleSetFlag: false
      exampleSetFlag: false
    TestConnectionResponse:
      title: TestConnectionResponse
      type: object
      properties:
        learnedIPs:
          type: array
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/AciConnectionAllOfLearnedIPs'
            exampleSetFlag: false
