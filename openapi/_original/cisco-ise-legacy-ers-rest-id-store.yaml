swagger: '2.0'
info:
  description: "REST ID Store API allows clients to add, get, update and delete REST ID stores.\n\n<h2>Revision History</h2>\n\
    <table font-family:monospace>\n<tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Revision\
    \ #</b></td><td><b>Resource Version</b></td><td><b>Cisco ISE Version</b></td><td><b>Description</b></td></tr>\n<tr><td>0</td><td>1.0</td><td>3.0</td><td>Initial\
    \ Cisco ISE Version</td></tr>\n<tr style ='border-bottom:solid #CCCCCC 1.0pt;background:#f8f8f8'><td>1</td><td>1.1</td><td>3.2</td><td>Added\
    \ Patch and PatchByName operations</td></tr>\n<tr style ='border-bottom:solid #CCCCCC 1.0pt;background:#f8f8f8'><td>2</td><td>1.2</td><td>3.5</td><td>Added\
    \ support for REST ID store user sttributes, REST ID store device sttributes, and REST ID store predefined regexes.</td></tr>\n\
    <tr style ='border-bottom:solid #CCCCCC 1.0pt;background:#f8f8f8'><td>3</td><td>1.3</td><td>3.6</td><td>Support new attributes\
    \ under RESTID Store AdvancedSettings: enablePasswordlessAuth and sshKeysAttributeName. </td></tr>\n<tr style ='border-bottom:solid\
    \ #CCCCCC 1.0pt;background:#f8f8f8'><td>4</td><td>1.4</td><td>3.6</td><td>Added support for RESTID Store Groups.</td></tr>\n\
    </table>\n<br><br>\n\n<h2>Resource Definition</h2>\n<table>\n<tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid\
    \ #CCCCCC .75pt;background:#DEEDF7'><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Example\
    \ Values</b></td></tr>\n<tr><td style='font-family:monospace'>name</td><td>String</td><td>Yes</td><td>Resource Name</td><td>RestIdStore1</td></tr>\n\
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>id</td><td>String</td><td>No</td><td>Resource\
    \ UUID, mandatory for update</td><td>b1155994-b736-46af-9add-04bed3058e3a</td></tr>\n<tr><td style='font-family:monospace'>description</td><td>String</td><td>No</td><td>Resource\
    \ Description</td><td>Object that represents the restID stores.</td></tr>\n<tr><td style='font-family:monospace'>enableRestIdStore</td><td>Boolean</td><td>Yes</td><td>Enable\
    \ or Disable RestIDStore</td><td>false</td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>ersRestIDStoreAttributes</td><td>ErsRestIDStoreAttributes\
    \ List</td><td>Yes</td><td>Holds the attributes of the restID object</td><td></td></tr>\n<tr valign=top style='background:#f8f8f8'><td\
    \ style='font-family:monospace'>- usernameSuffix</td><td>String</td><td>Yes</td><td>Suffix of the username domain</td><td>@place.com</td></tr>\n\
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>- rootUrl</td><td>String</td><td>Yes</td><td>url\
    \ of the root of the RestIDStore</td><td>rootUrl</td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>-\
    \ predefined</td><td>Enum</td><td>Yes</td><td>The cloud provider connected to of the RestIDStore. Options are:<br>- Azure,\
    \ <br>- Okta, <br>- None</td><td>Azure</td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>-\
    \ headers</td><td>ERSRestIDStoreHeader List</td><td>Yes</td><td>Headers for the RestIDStore</td><td></td></tr>\n<tr valign=top\
    \ style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - key</td><td>String</td><td>Yes</td><td>Key of the\
    \ header</td><td>tenantID</td></tr>\n<tr valign=top style='background:#f8f8f8;border-bottom:solid #CCCCCC 1.0pt'><td style='font-family:monospace'>&nbsp\
    \ - value</td><td>String</td><td>Yes</td><td>Value of the header</td><td>tenantID_value</td></tr>\n<tr valign=top style='background:#f8f8f8'><td\
    \ style='font-family:monospace'>ersRestIDStoreGroups</td><td>\tERS RESTID Store Groups</td><td>Yes</td><td>Holds list\
    \ of REST ID Store Groups</td><td></td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>-\
    \ name</td><td>String</td><td>Yes</td><td>Name of group</td><td></td></tr>\n<tr valign=top style='background:#f8f8f8'><td\
    \ style='font-family:monospace'>ersRestIDStoreUserAttributes</td><td>ERS RESTID Store User Attributes</td><td>Yes</td><td>Holds\
    \ list of REST ID Store User Attributes</td><td></td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>-\
    \ name</td><td>String</td><td>Yes</td><td>Name and Type of attribute</td><td></td></tr>\n<tr valign=top style='background:#f8f8f8'><td\
    \ style='font-family:monospace'>ersRestIDStoreDeviceAttributes</td><td>ERS RESTID Store Device Attributes</td><td>No</td><td>Holds\
    \ list of REST ID Store Device Attributes</td><td></td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>-\
    \ name</td><td>String</td><td>Yes</td><td>Name and Type of attribute</td><td></td></tr>\n<tr valign=top style='background:#f8f8f8'><td\
    \ style='font-family:monospace'>ersRestIDStoreAdvanceSettings</td><td>ERS RESTID Store Advance Settings</td><td>No</td><td>Holds\
    \ list of REST ID Store Advance settings</td><td></td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>-\
    \ deviceQuerySetting</td><td>enum</td><td>No</td><td>deviceQuerySetting values must be one of NONE,DISPLAY_NAME,ID,DEVICE_ID</td><td>NONE</td></tr>\n\
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>- identifyDeviceCertificate</td><td>enum</td><td>No</td><td>identifyDeviceCertificate\
    \ values must be one of NONE,SNF,SAN</td><td>NONE</td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>-\
    \ subjectNameFormat</td><td>String</td><td>No</td><td>subjectNameFormat values must be empty</td><td></td></tr>\n<tr valign=top\
    \ style='background:#f8f8f8'><td style='font-family:monospace'>- sanAttributeValue</td><td>String</td><td>No</td><td>sanAttributeValue\
    \ values must be empty</td><td></td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>-\
    \ regexType</td><td>Enum</td><td>No</td><td>regexType values must be one of NONE,PREDEFINED,CUSTOM</td><td>NONE</td></tr>\n\
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>- enablePasswordlessAuth</td><td>Boolean</td><td>No</td><td>Attribute\
    \ for passwordless authentication.</td><td></td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>-\
    \ regex</td><td>String</td><td>No</td><td>regex values must be pattern</td><td></td></tr>\n<tr valign=top style='background:#f8f8f8'><td\
    \ style='font-family:monospace'>- sshKeysAttributeName </td><td>String</td><td>No</td><td>Attribute for SSH keys</td><td>sshPublicKeys</td></tr>\n\
    </table>\n"
