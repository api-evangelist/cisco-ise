swagger: '2.0'
info:
  description: 'Endpoint Certificate API allows the client to create endpoint certificates signed by the Cisco ISE Internal
    CA. This API can takes in certificate request details, create a RSA key pair, create a certificate and return the resulting
    key pair and certificate as a ZIP file. ZIP files are returned as an octet stream.



