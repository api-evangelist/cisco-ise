design_notes:
- Read-only tools only. Every write on this product changes network access policy for real endpoints; a candidate tool set
  should not propose enforcement writes without a human-in-the-loop contract — see agentic-access if generated.
- Authentication would be HTTP Basic against a customer-owned appliance, so any real server is necessarily self-hosted per
  deployment rather than a hosted Cisco endpoint.
