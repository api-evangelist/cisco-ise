      summary: Get all ACI Information
      description: <p>This API allows the client to get ACI Settings.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- apic.acisettings.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
