        type: string
        description: Example:- trustsec.sgacl.1.1
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: The Token value from the GET X-CSRF-TOKEN fetch request
      - in: header
        name: Bulk Support
