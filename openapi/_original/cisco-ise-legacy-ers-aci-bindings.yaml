swagger: '2.0'
info:
  description: 'The ACI Bindings API allows clients to retrieve bindings that were sent to Cisco ISE by ACI or received on
    ACI from Cisco ISE. The binding information will be identical to the information on the ACI bindings page in the Cisco
    ISE UI. Filtering will be based on one attribute only, such as ip, sgt, vn, psn, learnedFrom, or learnedBy with CONTAINS
    mode of search.


