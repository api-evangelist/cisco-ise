tags:
- name: supportbundledownload
paths:
  /ers/config/supportbundledownload:
    put:
      tags:
      - supportbundledownload
      summary: Upload support bundle
      description: <p>This API allows the client to upload a support bundle.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- supportbundle.supportbundledownload.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: Required Only if Enabled from GUI Example:- fetch
      - in: body
        name: request
        schema:
          $ref: '#/definitions/supportbundle'
      responses:
        200:
          description: OK
  /ers/config/supportbundledownload/versioninfo:
    get:
      tags:
      - supportbundledownload
      summary: Get support bundle download version information
      description: <p>This API helps to retrieve the version information related to the support bundle download.</p>
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VersionInfo'
definitions:
  supportbundle:
    type: object
    properties:
      ErsSupportBundleDownload:
        $ref: '#/definitions/ErsSupportBundleDownload'
  ErsSupportBundleDownload:
    type: object
    properties:
      fileName:
        type: string
        example: filename
  VersionInfo:
    type: object
    properties:
      VersionInfo:
        $ref: '#/definitions/version'
  version:
    type: object
    properties:
      currentServerVersion:
        type: string
        example: '1.0'
      supportedVersions:
        type: string
        example: '1.0'
      link:
        $ref: '#/definitions/link1'
  link1:
    type: object
    properties:
      rel:
        type: string
        example: self
      href:
        type: string
        example: https://<ise-ip>:9060/ers/config/supportbundledownload/versioninfo
      type:
        type: string
        example: application/json
