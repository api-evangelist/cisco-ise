  /ers/config/ancendpoint/{id}:
    get:
      tags:
      - ancendpoint
      summary: Get ANC endpoint by ID
      description: <p>This API allows the client to get an ANC endpoint by ID.</p>
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - in: header
        name: HTTP ERS-Media-Type Header
        description: Example:- anc.ancendpoint.1.0
        required: false
        schema:
          type: string
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        description: 'Required Only if Enabled from GUI

          Example:- fetch'
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ancendpointid'
            application/xml:
              schema:
                $ref: '#/components/schemas/ancendpointid'
  /ers/config/ancendpoint/clear:
    put:
      tags:
      - ancendpoint
      summary: Clear required configuration
      description: <p>This API allows the client to clear the required configuration.</p>
      parameters:
