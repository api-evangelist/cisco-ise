paths:
  /api/v1/alarms/details-report/definitions:
    get:
      tags:
      - Alarm details
      summary: Retrieve Report Definitions with Sections
      description: Returns static report definition data containing report names and their associated sections with IDs and titles.
      operationId: getReportDefinitions
      responses:
        '200':
          description: Successful response containing the report definitions with sections.
          content:
            application/json:
              schema:
                type: array
                exampleSetFlag: true
                items:
                  $ref: '#/components/schemas/ReportDefinitionWithSections'
                  exampleSetFlag: false
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
  /api/v1/alarms/{reportName}/details-report:
    get:
      tags:
      - Alarm details
      summary: Retrieve Report Data
      description: Fetches data for a specific report section. The response format varies based on the section's template (grid, chart, etc.).
      operationId: getReportStoreData
      parameters:
      - name: reportName
        in: path
        description: The reportName is used to retrieve data from the designated report.
        required: true
        style: simple
        schema:
          type: string
          exampleSetFlag: true
      - name: section
        in: header
        description: The ID of the report section for which to retrieve data. Must correspond to a valid section ID from the report definition.
        required: true
        schema:
          type: string
          exampleSetFlag: true
      - name: server
        in: header
        description: Server identifier to filter results for a specific server.
        required: true
        schema:
          type: string
          exampleSetFlag: true
      - name: timeRange
        in: header
        description: Specifies the time range for the report data. Accepts predefined values such as 'today', 'last7days' and  'last30days'. Use 'custom' to specify a custom range with the 'from' and 'to' parameters. If omitted, the default time range is determined by the report's definition, often defaulting to 'today'.
        required: false
        schema:
          type: string
          exampleSetFlag: true
          enum:
          - custom
          - last30days
          - last7days
          - today
      - name: from
        in: header
        description: Start timestamp for custom time range filter. Supports epoch time in milliseconds or time format (ISO 8601 UTC format, e.g., "2025-09-15T10:00:00.000Z").
        required: false
        schema:
          type: string
          exampleSetFlag: true
      - name: to
        in: header
        description: End timestamp for custom time range filter. Supports epoch time in milliseconds or time format (ISO 8601 UTC format, e.g., "2025-09-15T10:00:00.000Z").
        required: false
        schema:
          type: string
          exampleSetFlag: true
      responses:
        '200':
          description: Successful response containing the report data. The structure of the items in the array depends on the report section's template.
          content:
            application/json:
              schema:
                type: array
                exampleSetFlag: true
                items:
                  type: object
                  exampleSetFlag: false
        '400':
          description: Bad Request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
                exampleSetFlag: false
