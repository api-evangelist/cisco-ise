  version: 1.0.0
  title: Allowed Protocols

tags:
- name: allowedprotocols


paths:
  /ers/config/allowedprotocols/name/{name}:
    get:
      tags: 
      - allowedprotocols
      summary: Get allowed protocol by name
      description:
        <p>This API allows the client to get an allowed protocol by name.</p>
      consumes:
      - application/json
      - application/xml
      produces:
