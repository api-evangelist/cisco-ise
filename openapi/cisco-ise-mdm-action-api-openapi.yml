tags:
- name: mdm-action
paths:
  /<mdm-server>/{api_path}/action/actionType=<action type>:
    post:
      tags:
      - mdm-action
      summary: Send the action commands to the MDM server
      description: This API allows Cisco ISE to send action command to MDM to perform certain actions, like wipe out config,
        etc. Supports guid & guidhn as device identifiers while sending action requests.
      parameters:
      - name: api_path
        in: path
        description: api_path obtained from GET operation of mdm-server-info
        required: true
        schema:
          type: string
      - name: actionType
        in: query
        description: full_wipe, corporate_wipe or pin_lock
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: '{username}:{password}'
        required: true
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/mdm-action-response'
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/mdm-action-request'
  /<mdm-server-ip>/{api_path}/action/actionType=<action type>:
    post:
      tags:
      - mdm-action
      summary: Send the action commands to the MDM server
      description: This API allows Cisco ISE to send action command to MDM to perform certain actions, like wipe out config,
        etc. Currently in version 1, ways to wipeout configs are the only required actions.
      parameters:
      - name: api_path
        in: path
        description: api_path obtained from GET operation of mdm-server-info
        required: true
        schema:
          type: string
      - name: actionType
        in: query
        description: full_wipe, corporate_wipe or pin_lock
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: '{username}:{password}'
        required: true
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/mdm-action'
components:
  schemas:
    mdm-action-request:
      type: object
      properties:
        identifier:
          type: object
          properties:
            guid:
              type: string
              example: '000000000000'
    mdm-action-response:
      type: object
      properties:
        name:
          type: string
          example: action
        api_version:
          type: integer
          example: 3
        deviceList:
          type: object
          properties:
            device:
              type: object
              properties:
                guid:
                  type: string
                  example: '000000000000'
                result:
                  type: object
                  properties:
                    action_status:
                      type: boolean
                      example: true
                    failure_reason:
                      type: string
                      example: something not compliant
    mdm-action:
      type: object
      properties:
        name:
          type: string
          example: action
        api_version:
          type: integer
          example: 2
        deviceList:
          type: object
          properties:
            device:
              type: object
              properties:
                macaddress:
                  type: string
                  example: '000000000000'
                result:
                  type: object
                  properties:
                    action_status:
                      type: boolean
                      example: true
                    failure_reason:
                      type: string
                      example: something not compliant
