      tags:
      - sgmappinggroup
      summary: Deploy IP to SGT mapping group by ID
      description: <p>This API allows the client to deploy an IP to SGT mapping group by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: id
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- trustsec.sgmappinggroup.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: Required Only if Enabled from GUI Example:- fetch
      - in: header
        name: Additional Information
        type: string
        description: Only one Deploy process can run at any given time
      responses:
        204:
          description: No Content
