- name: adresourcereservation
paths:
  /ers/config/adresourcereservation/{id}:
    get:
      tags:
      - adresourcereservation
      summary: Fetch AD resource reservation details by ID.
      description: <p>This API fetches the AD resource reservation details by ID. The ID can be retrieved with the Get All
        operation.p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: id
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header (not mandatory)
        type: string
        description: Example:- identitystores.adresourcereservation.1.1
        required: false
      - in: header
        name: HTTP 'X-CSRF-TOKEN' Header (Required Only if Enabled from GUI)
        type: string
        description: The Token value from the GET X-CSRF-TOKEN fetch request Example:- fetch
        required: false
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/ERSADResourceReservation'
  /ers/config/adresourcereservation/{id}/:
    put:
      tags:
      - adresourcereservation
      summary: Update AD resource reservation by ID.
      description: <p>This API fetches the AD resource reservation details by ID. The ID can be retrieved with the Get All
        operation.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: id
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header (Not Mandatory)
        type: string
        description: Example:- dentitystores.adresourcereservation.1.0
        required: false
      - in: body
        name: request
        schema:
          $ref: '#/definitions/ERSADResourceReservation'
      responses:
        204:
          description: OK
  /ers/config/adresourcereservation/:
    get:
      tags:
      - adresourcereservation
      summary: List all Active Directory Resource Reservation in Cisco ISE.
      description: <p>This API lists all Active Directory Resource Reservation in Cisco ISE.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header (not mandatory)
        type: string
        description: Example:- identitystores.activedirectory.1.1
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header (Required Only if Enabled from GUI)
        type: string
        description: The Token value from the GET X-CSRF-TOKEN fetch request
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions'
  /ers/config/adresourcereservation/name/{name}:
    get:
      tags:
      - adresourcereservation
      summary: Get Active Directory resource reservation by name
      description: <p>This API allows the client to get Active Directory resource reservation by node name. This API also
        allows the client to fetch join point details by Name. The node Name can be retrieved with the Get All operation.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: name
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header(not mandatory)
        type: string
        description: Example:- identitystores.adresourcereservation.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header (Required Only if Enabled from GUI)
        type: string
        description: The Token value from the GET X-CSRF-TOKEN fetch request
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/ERSADResourceReservation'
  /ers/config/adresourcereservation/versioninfo:
    get:
      tags:
      - adresourcereservation
      summary: Get Active Directory Resource Reservation information
      description: <p>This API helps to retrieve the revision version information related to the active directory Resource
        Reservation  API.</p>
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VersionInfo'
