definitions:
  rest:
    type: object
    properties:
      ERSRestIDStore:
        $ref: '#/definitions/ERSRestIDStore'
  ERSRestIDStoreSettings:
    type: object
    properties:
      name:
        type: string
      id:
        type: string
      description:
        type: string
      enableRestIdStore:
        type: boolean
  ERSRestIDStore:
    type: object
    properties:
      id:
        type: string
        example: b1155994-b736-46af-9add-04bed3058e3a
      name:
        type: string
        example: RestIdStore1
      description:
        type: string
        example: Object that represents the restID store
      enableRestIdStore:
        type: boolean
        example: false
      ersRestIDStoreAttributes:
        type: object
        properties:
          usernameSuffix:
            type: string
            example: '@place.com'
          rootUrl:
            type: string
            example: rootUrl
          predefined:
            type: string
            example: Azure
          headers:
            type: array
            example:
            - key: tenantID
              value: tenantID_value
            - key: clientID
              value: clientID_value
            - key: clientSecret
              value: clientSecret_value
            items:
              properties:
                name:
                  type: string
  ersRestIDStoreUserAttributes:
    type: object
    properties:
      name:
        type: string
        example: AttributeName1
  ersRestIDStoreDeviceAttributes:
    type: object
    properties:
      name:
        type: string
        example: ''
  ersRestIDStoreAdvanceSettings:
    type: object
    properties:
      deviceQuerySetting:
        type: string
        example: DEVICE_NAME
      identifyDeviceCertificate:
        type: string
        example: SAN
      subjectNameFormat:
        type: string
        example: ''
      sanAttribute:
        type: string
        example: EMAIL
      sanAttributeValue:
        type: string
        example: www.cisco.com/device
      sshKeysAttributeName:
        type: string
        example: sshPublicKeys
      regexType:
        type: string
        example: CUSTOM
      regex:
        type: string
        example: /^[\\w-\\.]+@([\\w-]+\\.)+[\\w-]{2,4}$/
        items:
          properties:
            name:
              type: string
  patchRequest:
    type: object
    properties:
      ERSRestIDStore:
        $ref: '#/definitions/patchRequestBody'
  patchRequestBody:
    type: object
    properties:
      any-resource-attribute:
        type: string
        example: some-updated-value
      another-resource-attribute:
        type: string
        example: some-updated-value
  Update:
    type: object
    properties:
      UpdatedFieldsList:
        $ref: '#/definitions/UpdatedFieldsList'
  UpdatedFieldsList:
    type: object
    properties:
      updatedField:
        $ref: '#/definitions/UpdatedField'
      field:
        type: string
        example: some other field
      oldValue:
        type: string
        example: val_old
      newValue:
        type: string
        example: val_new
  UpdatedField:
    type: object
    properties:
      field:
        type: string
        example: field1
      oldValue:
        type: string
        example: val_old
      newValue:
        type: string
        example: val_new
  search:
    type: object
    properties:
      SearchResult:
        $ref: '#/definitions/SearchResult'
  SearchResult:
    type: object
    properties:
      total:
        type: integer
        example: 1
      resources:
        type: array
        example:
        - id: 79aac430-7cc8-11eb-ad58-005056926583
          name: ISE_EST_Local_Host
          description: example nd
          link:
            rel: self
            href: https://<ise-ip>:9060/ers/config/ers/config/networkdevice/79aac430-7cc8-11eb-ad58-005056926583
            type: application/json
        items:
          properties:
            name:
              type: string
  VersionInfo:
    type: object
    properties:
      VersionInfo:
        $ref: '#/definitions/version'
  version:
    type: object
    properties:
      currentServerVersion:
        type: string
        example: '1.0'
      supportedVersions:
        type: string
        example: '1.0'
      link:
        $ref: '#/definitions/link1'
  link1:
    type: object
    properties:
      rel:
        type: string
        example: self
      href:
        type: string
        example: https://<ise-ip>:9060/ers/config/restidstore/versioninfo
      type:
        type: string
        example: application/json
  ERSRestIDStoreAllGroupsRequest:
    type: object
    properties:
      ERSRestIDStoreAllGroups:
        $ref: '#/definitions/ERSRestIDStoreAllGroups'
  ERSRestIDStoreAllGroups:
    type: object
