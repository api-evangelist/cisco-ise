swagger: '2.0'
info:
  description: |
    Sponsored Guest Portal API provides the ability to create, read, update, delete and search sponsored guest portals.
    
    <h2>Revision History</h2>
    <table font-family:monospace>
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Revision #</b></td><td><b>Resource Version</b></td><td><b>Cisco ISE Version</b></td><td><b>Description</b></td></tr>
    <tr><td>0</td><td>1.0</td><td>2.2</td><td>Initial Cisco ISE Version</td></tr>
    </table>
    <br><br>
    
    <h2>Resource Definition</h2>
    <table>
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Default Values</b></td><td><b>Example Values</b></td></tr>
    <tr><td style='font-family:monospace'>name</td><td>String</td><td>Yes</td><td>Resource Name</td><td></td><td>Sponsored Guest Portal (default))</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>id</td><td>String</td><td>No</td><td>Resource UUID, mandatory for update</td><td></td><td>d135de9f-cd87-4ce7-b1a4-1d9c7cf35f33</td></tr>
    <tr><td style='font-family:monospace'>description</td><td>String</td><td>No</td><td>Resource Description</td><td></td><td>Sponsors create guest accounts, and guests access the network using their assigned username and password</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>portalTestUrl</td><td>String</td><td>No</td><td>URL to bring up a test page for this portal</td><td></td><td>https://{ise-ip}:8443/portal/PortalSetup.action?portal=d135de9f-cd87-4ce7-b1a4-1d9c7cf35f33</td></tr>
    <tr><td style='font-family:monospace'>portalType</td><td>Enum</td><td>Yes</td><td>Allowed values:<br>- BYOD, <br>- HOTSPOTGUEST, <br>- MYDEVICE, <br>- SELFREGGUEST, <br>- SPONSOR, <br>- SPONSOREDGUEST</td><td>SPONSOREDGUEST</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>settings</td><td>List</td><td>No</td><td>Defines all of the settings groups available for a portal</td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>- portalSettings</td><td>List</td><td>No</td><td>The port, interface, certificate, and other basic settings of a portal</td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - httpsPort</td><td>Integer</td><td>Yes</td><td>The port number that the allowed interfaces will listen on. Range from 8000 to 8999</td><td></td><td>8443</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - allowedInterfaces</td><td>Enum</td><td>Yes</td><td>Interfaces that the portal will be reachable on. Allowed values:<br>- eth0, <br>- eth1, <br>- eth2, <br>- eth3, <br>- eth4, <br>- eth5, <br>- bond0, <br>- bond1, <br>- bond2</td><td></td><td>[ "eth0", "bond0" ]</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - certificateGroupTag</td><td>String</td><td>Yes</td><td>Logical name of the x.509 server certificate that will be used for the portal</td><td></td><td>Default Portal Certificate Group</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - authenticationMethod</td><td>String</td><td>Yes</td><td>Unique Id of the identity source sequence</td><td></td><td>92faba60-8c01-11e6-996c-525400b48521</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - assignedGuestTypeForEmployee</td><td>String</td><td>Yes</td><td>Unique Id of a guest type. Employees using this portal as a guest inherit login options from the guest type</td><td></td><td>Contractor (default)</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - displayLang</td><td>Enum</td><td>No</td><td>Allowed values:<br>- USEBROWSERLOCALE, <br>- ALWAYSUSE</td><td></td><td>USEBROWSERLOCALE</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - fallbackLanguage</td><td>String</td><td>No</td><td>Used when displayLang = USEBROWSERLOCALE</td><td></td><td>English</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - alwaysUsedLanguage</td><td>String</td><td>No</td><td>Used when displayLang = ALWAYSUSE</td><td></td><td>English</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>- loginPageSettings</td><td>List</td><td>No</td><td>Portal Login Page settings groups follow</td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - maxFailedAttemptsBeforeRateLimit</td><td>Integer</td><td>No</td><td>Maximum failed login attempts before rate limiting</td><td>5</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - timeBetweenLoginsDuringRateLimit</td><td>Integer</td><td>No</td><td>Time between login attempts when rate limiting</td><td>2</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - includeAup</td><td>Boolean</td><td>No</td><td>Include an Acceptable Use Policy (AUP) that should be displayed during login</td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - aupDisplay</td><td>Enum</td><td>No</td><td>How the AUP should be displayed, either on page or as a link. Only valid if includeAup = true. Allowed values:<br>- ONPAGE, <br>- ASLINK</td><td>ASLINK</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - requireAupAcceptance</td><td>Boolean</td><td>No</td><td>Require the portal user to accept the AUP. Only valid if includeAup = true</td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - requireAccessCode</td><td>Boolean</td><td>No</td><td>Require the portal user to enter an access code</td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - accessCode</td><td>String</td><td>No</td><td>Access code that must be entered by the portal user (only valid if requireAccessCode = true)</td><td></td><td></td></tr> 
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - allowGuestToCreateAccounts</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - allowGuestToChangePassword</td><td>Boolean</td><td>No</td><td>Require the portal user to enter an access code</td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>- aupSettings</td><td>List</td><td>No</td><td>Configuration of the Acceptable Use Policy (AUP) for a portal</td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - displayFrequency</td><td>Enum</td><td>No</td><td>How the AUP should be displayed, either on page or as a link. Only valid if includeAup = true. Allowed Values:<br>- FIRSTLOGIN, <br>- EVERYLOGIN, <br>- RECURRING</td><td>FIRSTLOGIN</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - includeAup</td><td>Boolean</td><td>No</td><td>Require the portal user to read and accept an AUP</td><td>true</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - requireAupScrolling</td><td>Boolean</td><td>No</td><td>Require the portal user to scroll to the end of the AUP. Only valid if requireAupAcceptance = true</td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - useDiffAupForEmployees</td><td>Boolean</td><td>No</td><td>Only valid if requireAupAcceptance = trueG</td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - skipAupForEmployees</td><td>Boolean</td><td>No</td><td>Only valid if requireAupAcceptance = true</td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - displayFrequencyIntervalDays</td><td>Integer</td><td>No</td><td>Number of days between AUP confirmations (when displayFrequency = recurring)</td><td>7</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>- GuestChangePasswordSettings</td><td>List</td><td>No</td><td></td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - allowChangePasswdAtFirstLogin</td><td>Boolean</td><td>No</td><td>Allow guest to change their own passwords</td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>- guestDeviceRegistrationSettings</td><td>List</td><td>No</td><td></td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - autoRegisterGuestDevices</td><td>Boolean</td><td>No</td><td>Automatically register guest devices</td><td>true</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - allowGuestsToRegisterDevices</td><td>Boolean</td><td>No</td><td>Allow guests to register devices</td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>- byodSettings</td><td>List</td><td>No</td><td>Configuration of BYOD Device Welcome, Registration and Success steps</td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - byodWelcomeSettings</td><td>List</td><td>No</td><td>Configuration of BYOD endpoint welcome step configuration</td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - enableBYOD</td><td>Boolean</td><td>No</td><td></td><td>true</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - enableGuestAccess</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - requireMDM</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - includeAup</td><td>Boolean</td><td>No</td><td></td><td>true</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - aupDisplay</td><td>Enum</td><td>No</td><td>How the AUP should be displayed, either on page or as a link. Only valid if includeAup = true. Allowed values:<br>- ONPAGE, <br>- ASLINK</td><td>ONPAGE</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - requireAupAcceptance</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - requireScrolling</td><td>Boolean</td><td>No</td><td>Require BYOD devices to scroll down to the bottom of the AUP, Only valid if includeAup = true</td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - byodRegistrationSettings</td><td>List</td><td>No</td><td>Configuration of BYOD endpoint Registration step configuration</td><td></td><td></td></tr>
