components:
  schemas:
    IdResponseEntity:
      title: IdResponseEntity
      required:
      - id
      type: object
      properties:
        id:
          type: string
          format: uuid
          example: 07da6fd8-5abc-4dc4-bcec-df309dbf4d17
          exampleSetFlag: true
      description: response object containing object ID
      exampleSetFlag: false
    TimeAndDateCondition:
      title: TimeAndDateCondition
      required:
      - conditionType
      - name
      type: object
      properties:
        conditionType:
          type: string
          description: <ul><li>Inidicates whether the record is the condition itself(data) or a logical(or,and) aggregation</li> <li>Data type enum(reference,single) indicates than "conditonId" OR "ConditionAttrs" fields should contain condition data but not both</li> <li>Logical aggreation(and,or) enum indicates that additional conditions are present under the children field</li></ul>
          example: ConditionAttributes
          exampleSetFlag: true
          enum:
          - ConditionAndBlock
          - ConditionAttributes
          - ConditionOrBlock
          - ConditionReference
          - LibraryConditionAndBlock
          - LibraryConditionAttributes
          - LibraryConditionOrBlock
          - TimeAndDateCondition
        datesRange:
          $ref: '#/components/schemas/DatesRange'
          exampleSetFlag: true
        datesRangeException:
          $ref: '#/components/schemas/DatesRange'
          exampleSetFlag: true
        description:
          type: string
          description: Condition description
          example: Optional description
          exampleSetFlag: true
        hoursRange:
          $ref: '#/components/schemas/HoursRange'
          exampleSetFlag: true
        hoursRangeException:
          $ref: '#/components/schemas/HoursRange'
          exampleSetFlag: true
        id:
          type: string
          format: uuid
          exampleSetFlag: true
        isNegate:
          type: boolean
          description: Indicates whereas this condition is in negate mode
          example: false
          exampleSetFlag: true
        link:
          $ref: '#/components/schemas/Link'
          exampleSetFlag: true
        name:
          type: string
          description: Condition name
          example: TimeAndDate Condition
          exampleSetFlag: true
        weekDays:
          type: array
          description: <p>Defines for which days this condition will be matched<br> Days format - Arrays of WeekDay enums <br> Default - List of All week days</p>
          example: '["Sunday","Monday","Tuesday"]'
          exampleSetFlag: true
          items:
            type: string
            exampleSetFlag: false
            enum:
            - Friday
            - Monday
            - Saturday
            - Sunday
            - Thursday
            - Tuesday
            - Wednesday
        weekDaysException:
          type: array
          description: <p>Defines for which days this condition will NOT be matched<br> Days format - Arrays of WeekDay enums <br> Default - Not enabled</p>
          example: '["Tuesday"]'
          exampleSetFlag: true
          items:
            type: string
            exampleSetFlag: false
            enum:
            - Friday
            - Monday
            - Saturday
            - Sunday
            - Thursday
            - Tuesday
            - Wednesday
      description: Condition based on time and date.
      exampleSetFlag: false
    Link:
      title: Link
      required:
      - href
      type: object
      properties:
        href:
          type: string
          example: https://{{ISE_IP}}/api/v1/policy/{{protocol}}/policy-set/{{resource-id}}
          exampleSetFlag: true
        rel:
          type: string
          example: self
          exampleSetFlag: true
          enum:
          - next
          - previous
          - self
          - status
        type:
          type: string
          example: application/json
          exampleSetFlag: true
      exampleSetFlag: false
    TimeAndDateConditionResponseEntity:
      title: TimeAndDateConditionResponseEntity
      required:
      - response
      - version
      type: object
      properties:
        response:
          $ref: '#/components/schemas/TimeAndDateCondition'
          exampleSetFlag: true
        version:
          type: string
          example: 1.0.0
          exampleSetFlag: true
      exampleSetFlag: false
    TimeAndDateConditionListResponseEntity:
      title: TimeAndDateConditionListResponseEntity
      required:
      - response
      - version
      type: object
      properties:
        response:
          type: array
          example: '[{"name":"Time condition 1","conditionType":"TimeAndDateCondition","id":"ad947f38-7063-4da2-8723-652e0ca2ea41","isNegate":false,"description":"Optional description","hoursRange":{"startTime":"8:10","endTime":"15:10"},"link":{"rel":"self","href":"https://{{ISE_IP}}/api/v1/policy/{{protocol}}/time-condition/ad947f38-7063-4da2-8723-652e0ca2ea41","type":"application/json"}},{"name":"Time condition 2","id":"ad947f38-7063-4da2-8723-652e0ca2ea42","conditionType":"TimeAndDateCondition","isNegate":false,"description":"Optional description","DatesRange":{"startDate":"2025-05-06","endDate":"2025-05-10"},"link":{"rel":"self","href":"https://{{ISE_IP}}/api/v1/policy/{{protocol}}/time-condition/ad947f38-7063-4da2-8723-652e0ca2ea42","type":"application/json"}}]'
          exampleSetFlag: true
          items:
            $ref: '#/components/schemas/TimeAndDateCondition'
            exampleSetFlag: false
        version:
          type: string
          example: 1.0.0
          exampleSetFlag: true
      exampleSetFlag: false
    HoursRange:
      title: HoursRange
      required:
      - endTime
      - startTime
      type: object
      properties:
        endTime:
          type: string
          example: '15:00'
          exampleSetFlag: true
        startTime:
          type: string
          example: 08:00
          exampleSetFlag: true
      description: <p>Defines for which hours a TimeAndDate condition will be matched<br> Time foramt - hh:mm  ( h = hour , mm = minutes ) <br> Default - All Day </p>
      exampleSetFlag: false
    Error:
      title: Error
      type: object
      properties:
        code:
          type: string
          example: '400'
          exampleSetFlag: true
        message:
          type: string
          example: Bad Request
          exampleSetFlag: true
      exampleSetFlag: false
    DatesRange:
      title: DatesRange
      required:
      - endDate
      - startDate
      type: object
      properties:
        endDate:
          type: string
          example: '2022-05-10'
          exampleSetFlag: true
        startDate:
          type: string
          example: '2022-05-06'
          exampleSetFlag: true
      description: <p>Defines for which date/s TimeAndDate condition will be matched<br> Options are - Date range, for specific date, the same date should be used for start/end date <br> Default - no specific dates<br> In order to reset the dates to have no specific dates Date format - yyyy-mm-dd (MM = month, dd = day, yyyy = year)</p>
      exampleSetFlag: false
  securitySchemes:
    BasicAuth:
      type: http
      description: Basic authorization
      scheme: basic
