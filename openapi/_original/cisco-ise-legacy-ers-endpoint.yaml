swagger: '2.0'
info:
  description: |
    Endpoint API allows the client to add, delete, update, search, register and de-register endpoints. Please note that each API description shows whether the API is supported in bulk operation. The Bulk section is showing only 'create' bulk operation however, all other operation which are bulk supported can be used in same way.

    
    <h2>Revision History</h2>
    <table font-family:monospace> 
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Revision #</b></td><td><b>Resource Version</b></td><td><b>Cisco ISE Version</b></td><td><b>Description</b></td><td colspan ="2"><b>Revision Modification</b></td></tr>
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td></td><td></td><td></td><td></b></td><td><b>Attribute</b></td><td><b>Description</b></td></tr>
    <tr><td>0</td><td>1.0</td><td>1.3</td><td>Initial Cisco ISE Version</td><td></td><td></td></tr>
    <tr valign=top style='border-top:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#f8f8f8'><td>1</td><td>1.1</td><td>2.1</td><td>Cisco ISE 2.1 model changes</td><td>customAttributes</td><td>Added custom attibutes for the user to include custom attributes when adding endpoints to Cisco ISE</td><tr><td rowspan ="2">2</td><td rowspan ="2">1.2</td><td rowspan ="2">2.2</td><td rowspan ="2">Cisco ISE 2.2 model changes</td><td>apiAdded</td><td>Added custom operation to get list of rejected endpoints: '/getrejectedendpoints'</td><tr style = 'border-bottom:solid #CCCCCC 1.0pt'><td>apiAdded</td><td>Added custom operation to release rejected endpoint: '{id}/releaserejectedendpoint'</td></tr></tr>
    <tr style='border-bottom:solid #CCCCCC'><td>3</td><td>1.3</td><td>3.2</td><td>Added Patch operation</td><td></td><td></td></tr>
    <tr style='border-bottom:solid #CCCCCC'><td>4</td><td>1.3</td><td>3.3</td><td>Added new attributes</td><td>staticGroupAssignmentDefined, staticProfileAssignmentDefined, mdmAttributes, mfcAttributes</td><td>Added new attributes for the user to get MFC attribute data of the endpoint using the endpoint ID.</td></tr>
    </table>
    <br><br>
    
    <h2>Resource Definition</h2>
    <table>
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Example Values</b></td></tr>
    <tr><td style='font-family:monospace'>name</td><td>String</td><td>Yes</td><td>Resource Name</td><td>11:22:33:44:55:66</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>id</td><td>String</td><td>No</td><td>Resource UUID, mandatory for update</td><td>172f8270-8f4f-11eb-b4a8-9eb04987ed29</td></tr>
    <tr><td style='font-family:monospace'>description</td><td>String</td><td>No</td><td>Resource Description</td><td>MyEndpoint</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>customAttributes</td><td>Map</td><td>No</td><td>Key value map</td><td>{"key1" : "value1"}</td></tr>
    <tr><td style='font-family:monospace'>groupId</td><td>String</td><td>Yes</td><td></td><td>aa13bb40-8bff-11e6-996c-525400b48521</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>identityStore</td><td>String</td><td>No</td><td></td><td>identityStore</td></tr>
    <tr><td style='font-family:monospace'>identityStoreId</td><td>String</td><td>No</td><td></td><td>identityStoreId</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>mac</td><td>String</td><td>Yes</td><td></td><td>11:22:33:44:55:66</td></tr>
    <tr><td style='font-family:monospace'>portalUser</td><td>String</td><td>No</td><td></td><td>portalUser</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>profileId</td><td>String</td><td>No</td><td></td><td>profileId</td></tr>
    <tr><td style='font-family:monospace'>staticGroupAssignment</td><td>Boolean</td><td>Yes</td><td></td><td>false</td></tr>
    <tr><td style='font-family:monospace'>staticGroupAssignmentDefined</td><td>Boolean</td><td>No</td><td></td><td>true</td></tr>
