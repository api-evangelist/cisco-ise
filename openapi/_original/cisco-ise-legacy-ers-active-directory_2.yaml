  - type: source
    url: https://developer.cisco.com/docs/identity-services-engine/
tags:
- name: activedirectory
paths:
  /ers/config/activedirectory/{id}/getDomainUsers:
    put:
      tags:
      - activedirectory
      summary: Get all domain users
      description: <p>This API retrieves all domain users.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: id
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- identitystores.activedirectory.1.1
        required: false
      - in: header
        name: Additional Attributes
        type: string
        description: domain,filter,pageNumber,pageSize
      - in: header
        name: Additional Information
        type: string
        description: <p>List the users of the given domain</p> <table><tr><td>domain</td><td>(Required)</td><td>The domain
          whose users we want to fetch</td></tr><tr><td>filter</td><td>(Optional)</td><td>Filter the returned users using
          '*' wild card</td></tr><tr><td>pageNumber</td><td>(Optional)</td><td>Page Number</td></tr><tr><td>pageSize</td><td>(Optional)</td><td>Items
          per page</td></tr></table>
      - in: body
        name: request
        schema:
          $ref: '#/definitions/additional'
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/domain-response'
  /ers/config/activedirectory/{id}/passiveIdSettings:
    put:
      tags:
      - activedirectory
      summary: Update passive ID settings
      description: <p>This API updates passive ID settings.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: id
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- identitystores.activedirectory.1.1
        required: false
      - in: header
        name: Additional Attributes
        type: string
        description: enableAuthorizationFlow, enableSessionStitching
      - in: header
        name: Additional Information
        type: string
        description: <p>Updates passive ID settings</p> <table><tr><td>enableAuthorizationFlow</td><td>(Optional)</td><td>Either
          boolean or string of true/false</td></tr><tr><td>enableSessionStitching</td><td>(Optional)</td><td>Either boolean
          or string of true/false</td></tr></table>
      - in: body
        name: request
        schema:
          $ref: '#/definitions/additional'
      responses:
        204:
          description: OK
  /ers/config/activedirectory/name/{name}:
    get:
      tags:
      - activedirectory
      summary: Get Active Directory by name
      description: <p>This API allows the client to get Active Directory by name. This API also allows the client to fetch
        join point details by Name. The Name can be retrieved with the Get All operation.The Groups field contains an array
        of groups that are retrieved from AD-allowed domains for authentication. The Groups field contains an empty array
        if no such groups exist.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: name
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- identitystores.activedirectory.1.1
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: Required Only if Enabled from GUI Example:- fetch
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/getbyname'
  /ers/config/activedirectory/{id}/getUserGroups:
    put:
      tags:
      - activedirectory
      summary: List groups of which given user is member
      description: <p>This API allows the client to get groups of which a given user is a member.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: id
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- identitystores.activedirectory.1.1
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: The Token value from the GET X-CSRF-TOKEN fetch request
      - in: header
        name: Additional Attributes
        type: string
        description: username
      - in: header
        name: Additional Information
        type: string
        description: <p>List the groups a given user is member of.</p> <table><tr><td> Username </td><td> (Required) </td><td>The
          user to get its groups</td></tr></table>
      - in: body
        name: request
        schema:
          $ref: '#/definitions/additional'
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/ERSGroups'
  /ers/config/activedirectory/{id}/addGroups:
    put:
      tags:
      - activedirectory
      summary: Reload domain groups configuration from Active Directory into Cisco ISE
      description: <p>This API loads domain groups configuration from Active Directory into Cisco ISE. Name is a required
        field - this is the name of the join point for domain access. Domain is a required field - this is the AD domain from
        where the updated groups are retrieved from.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: id
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- identitystores.activedirectory.1.1
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: The Token value from the GET X-CSRF-TOKEN fetch request
      - in: header
        name: Additional Information
        type: string
        description: <p>Reload domain groups configuration from Active Directory into Cisco ISE.</p> <table><tr><td> name
          </td><td> (Required) </td><td>Name for the join point for domain access</td></tr><tr><td> domain </td><td> (Required)
          </td><td>AD domain to retrieve the updated groups from</td></tr></table>
      - in: body
        name: request
        schema:
          $ref: '#/definitions/activedirectory'
      responses:
        200:
          description: OK
  /ers/config/activedirectory/{id}/leave:
    put:
      tags:
      - activedirectory
      summary: Make Cisco ISE node leave Active Directory domain
      description: <p>This API makes a Cisco ISE node to leave an Active Directory domain.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: id
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- identitystores.activedirectory.1.1
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: The Token value from the GET X-CSRF-TOKEN fetch request
      - in: header
        name: Additional Attributes
        type: string
        description: username,password,node
      - in: header
        name: Additional Information
        type: string
        description: <p>Make a Cisco ISE node leave an Active Directory domain.</p> <table><tr><td> username </td><td> (Required)
          </td><td>The domain user to use</td></tr><tr><td> password </td><td> (Required) </td><td>The domain user's password</td></tr><tr><td>
