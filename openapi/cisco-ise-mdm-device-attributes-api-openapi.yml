components:
  schemas:
    mdm-device-attributes-response:
      type: object
      properties:
        name:
          type: string
          example: attributes
        api_version:
          type: integer
          example: 3
        paging_info:
          type: integer
          example: 0
        server_busy_wait_seconds:
          type: integer
          example: 0
        deviceList:
          type: object
          properties:
            device:
              type: object
              properties:
                guid:
                  type: string
                  example: 1759c0fd-c8da-49e8-b14f-19d85acfacea
                attributes:
                  type: object
                  properties:
                    register_status:
                      type: boolean
                      example: true
                    compliance:
                      type: object
                      properties:
                        status:
                          type: boolean
                          example: false
                        failure_reason:
                          type: string
                          example: something not compliant
                        remediation:
                          type: string
                          example: instruction on how to rememdiate
                    disk_encryption_on:
                      type: boolean
                      example: true
                    pin_lock_on:
                      type: boolean
                      example: true
                    jail_broken:
                      type: boolean
                      example: false
                    manufacturer:
                      type: string
                      example: Apple
                    model:
                      type: string
                      example: iPad 8th Gen 10.2-inch (Wi-Fi Only)
                    udid:
                      type: string
                      example: 00008020-0015784C218A402E
                    serial_number:
