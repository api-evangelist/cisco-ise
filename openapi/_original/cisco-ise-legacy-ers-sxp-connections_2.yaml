info:
  description: "SXP Connections API allows clients to add, get, update and delete the Security Group Tag (SGT) Exchange Protocol\
    \ (SXP) connections.\n\n<h2>Revision History</h2>\n<table font-family:monospace> \n<tr valign=top style='border:solid\
    \ #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Revision #</b></td><td><b>Resource Version</b></td><td><b>Cisco\
    \ ISE Version</b></td><td><b>Description</b></td><td colspan =\"2\"><b>Revision Modification</b></td></tr>\n<tr valign=top\
    \ style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td></td><td></td><td></td><td></b></td><td><b>Attribute</b></td><td><b>Description</b></td></tr>\n\
    <tr><td>0</td><td>1.0</td><td>2.0</td><td>Initial Cisco ISE Version</td><td></td><td></td></tr>\n<tr valign=top style='border-bottom:solid\
    \ #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#f8f8f8'><td>1</td><td>1.1</td><td >3.0</td><td rowspan\
    \ =\"4\">Cisco ISE 3.0 model changes</td><td>sxpVpn</td><td>Attribute can include some VPNs separated by comma</td></tr>\
    \            \n</table>\n<br><br>\n\n<h2>Resource Definition</h2>\n<table>\n<tr valign=top style='border:solid #CCCCCC\
    \ 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Example\
    \ Values</b></td></tr>\n<tr><td style='font-family:monospace'>name</td><td>String</td><td>Yes</td><td>Resource Name</td><td></td></tr>\n\
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>id</td><td>String</td><td>No</td><td>Resource\
    \ UUID value</td><td>f9269682-dcaf-11e3-ad0a-5bdcd2d9fd69</td></tr>\n<tr><td style='font-family:monospace'>description</td><td>String</td><td>No</td><td>Resource\
    \ Description</td><td>Brief description about network peer</td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>sxpPeer</td><td>String</td><td>Yes</td><td></td><td>Sxp\
    \ Peer Name</td></tr>\n<tr><td style='font-family:monospace'>sxpVpn</td><td>String</td><td>Yes</td><td></td><td>Sxp VPN\
    \ Name</td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>sxpNode</td><td>String</td><td>Yes</td><td></td><td>Sxp\
    \ Node Name</td></tr>\n<tr><td style='font-family:monospace'>ipAddress</td><td>String</td><td>Yes</td><td></td><td>Sxp\
    \ Peer IP address</td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>sxpMode</td><td>String</td><td>Yes</td><td></td><td>Sxp\
    \ Mode</td></tr>\n<tr><td style='font-family:monospace'>sxpVersion</td><td>String</td><td>Yes</td><td></td><td>Sxp Version</td></tr>\n\
    <tr valign=top style='background:#f8f8f8;border-bottom:solid #CCCCCC 1.0pt'><td style='font-family:monospace'>enabled</td><td>Boolean</td><td>Yes</td><td></td><td>true</td></tr>\n\
    </table>\n"
