  /ers/config/ancendpoint:
    get:
      tags:
      - ancendpoint
      summary: Get all ANC endpoints
      description: <p>This API allows the client to get all the ANC endpoints.</p> <p><h1>Filter:</h1><h3>[MAC address]</h3></p>
        <p>You can use MAC address as a filter for the endpoints. For example:</p> <p font-family:monospace>https://<ISE node>/ers/config/ancendpoint/?filter=name.CONTAINS.00:00:01:00:00:0B</p>
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        description: Example:- identity.adminuser.1.2
        required: false
        schema:
          type: string
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        description: 'Required Only if Enabled from GUI

