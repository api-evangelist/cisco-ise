  /ers/config/restidstore:
    get:
      tags:
      - restidstore
      summary: Get all REST ID stores
      description: <p>This API allows the client to get all the REST ID stores.</p> <p><h1>Filter:</h1> <h3>[name]</h3></p>
        <p>To search guest users by using <b>toDate</b> column,follow the format:</p> <p>DD-MON-YY (Example:13-SEP-18)</p>
