    type: object
    properties:
      id:
        type: string
        example: da095377-dce8-486e-933a-6ea788bbf51a
      name:
        type: string
        example: Certificate_Template_Name
      description:
        type: string
        example: ERS Example certificate template
      keySize:
        type: integer
        example: 2048
      validityPeriod:
        type: integer
        example: 730
