      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - in: body
        name: request
        schema:
          $ref: '#/definitions/bulkrequest'
      responses:
        202:
          description: Accepted
  /ers/config/sxpvpns/bulk/{bulkid}:
    get:
      tags:
      - sxpvpns
      summary: Monitor bulk request
      description: <p>This API allows the client to monitor the bulk request.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
