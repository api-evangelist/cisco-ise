swagger: '2.0'
info:
  description: "The Active Directory API allows the user to carry out add, delete, and search operations on the active directory\
    \ domains through Cisco ISE's join points.\nFor example, if you want to connect to the domain cisco.com and retrieve the\
    \ domain groups, you can carry out the following steps which are also available as APIs:\n\nStep 1 Create a domain join\
    \ point in Cisco ISE. In the \"domain\" parameter use cisco.com.<br>\nStep 2 Get all defined join points and copy your\
    \ join point's ID from the response.<br>\nStep 3 Join all Cisco ISE nodes to the domain. Use the ID received in the Step\
    \ 2 in the URL.\n\nFrom this point onwards, you can perform several actions. In each action you should specify the joint\
    \ point ID in the URL, as retrieved in step 2 in the previous configuration task. For example, you can:\n\n• Retrieve\
    \ the user groups using the join point ID.<br>\n• Retrieve the groups of a specific domain using the join point ID. The\
    \ domain parameter can be cisco.com or any of its trusted domains. You can use the get all trusted domains operation to\
    \ retrieve the list.\n\n<style>\n.rev-table {\n    font-family: monospace;\n    border-collapse: collapse;\n    width:\
    \ 100%;\n    border: 1px solid #CCCCCC;\n}\n.rev-table td {\n    border: 1px solid #CCCCCC;\n    padding: 5px;\n    vertical-align:\
    \ top;\n}\n.header { background-color: #DEEDF7; font-weight: bold; }\n.alt-row { background-color: #f8f8f8; }\n</style>\n\
    <h2>Revision History</h2>\n<table class=\"rev-table\">\n<!-- Header Rows -->\n<tr class=\"header\">\n    <td>Revision\
    \ #</td>\n    <td>Resource Version</td>\n    <td>Cisco ISE Version</td>\n    <td>Description</td>\n    <td colspan=\"\
    2\" align=\"center\">Revision Modification</td>\n</tr>\n<tr class=\"header\">\n    <td></td><td></td><td></td><td></td>\n\
    \    <td>Attribute</td>\n    <td>Description</td>\n</tr>\n\n<!-- Revision 0 -->\n<tr>\n    <td>0</td><td>1.0</td><td>2.2</td>\n\
    \    <td>Initial Cisco ISE Version</td>\n    <td>-</td><td>-</td>\n</tr>\n\n<!-- Revision 1 -->\n<tr class=\"alt-row\"\
    >\n    <td rowspan=\"3\">1</td><td rowspan=\"3\">1.1</td><td rowspan=\"3\">2.4</td>\n    <td rowspan=\"3\">Support new\
    \ attributes</td>\n    <td>advancedSettings</td>\n    <td>Added ERSActiveDirectoryAdvancedSettings Attribute 'advancedSettings'</td>\n\
    </tr>\n<tr class=\"alt-row\"><td>adAttributes</td><td>Added ERSActiveDirectoryAttributes Attribute 'adAttributes'</td></tr>\n\
    <tr class=\"alt-row\"><td>enableDomainWhiteList</td><td>Added Boolean Attribute 'enableDomainWhiteList'</td></tr>\n\n\
    <!-- Revision 2 -->\n<tr>\n    <td rowspan=\"3\">2</td><td rowspan=\"3\">1.2</td><td rowspan=\"3\">3.1</td>\n    <td rowspan=\"\
    3\">Support new attributes under ActiveDirectory AdvancedSettings</td>\n    <td>enableFailedAuthProtection</td>\n    <td>Added\
    \ Boolean Attribute 'enableFailedAuthProtection'</td>\n</tr>\n<tr><td>failedAuthThreshold</td><td>Added Integer Attribute\
    \ 'failedAuthThreshold'</td></tr>\n<tr><td>authProtectionType</td><td>Added Enum Attribute 'authProtectionType'</td></tr>\n\
    \n<!-- Revision 3 -->\n<tr class=\"alt-row\">\n    <td>3</td><td>1.3</td><td>3.2</td>\n    <td>Support new API calls</td>\n\
    \    <td>getDomainUsers</td>\n    <td>Added new API to get domain users (with filter option)</td>\n</tr>\n\n<!-- Revision\
    \ 4 -->\n<tr>\n    <td>4</td><td>1.4</td><td>3.2</td>\n    <td>Support new API calls</td>\n    <td>passiveIdSettings</td>\n\
    \    <td>Added new API to update passive ID related settings</td>\n</tr>\n\n<!-- Revision 5 -->\n<tr class=\"alt-row\"\
    >\n    <td rowspan=\"3\">5</td><td rowspan=\"3\">1.5</td><td rowspan=\"3\">3.2</td>\n    <td rowspan=\"3\">Added description\
    \ for existing APIs</td>\n    <td>/activedirectory/{id}</td>\n    <td>Added groups field description</td>\n</tr>\n<tr\
    \ class=\"alt-row\"><td>/activedirectory/name/{name}</td><td>Added groups field description</td></tr>\n<tr class=\"alt-row\"\
    ><td>/activedirectory/{id}/addGroups</td><td>Added adgroups field description. Request content and response status code\
    \ fixed in SDK</td></tr>\n\n<!-- Revision 6 -->\n<tr>\n    <td>6</td><td>1.6</td><td>3.5</td>\n    <td>Support new attributes\
    \ for existing APIs</td>\n    <td>{id}/passiveIdSettings</td>\n    <td>Added Boolean Attribute 'enableSessionStitching'.</td>\n\
    </tr>\n\n<!-- Revision 7 (NEW INFO ADDED HERE) -->\n<tr class=\"alt-row\">\n    <td rowspan=\"2\">7</td>\n    <td rowspan=\"\
    2\">1.7</td>\n    <td rowspan=\"2\">3.6</td>\n    <td rowspan=\"2\">Support new attributes under ActiveDirectory AdvancedSettings</td>\n\
    \    <td>enablePasswordlessAuth</td>\n    <td>Added Boolean Attribute 'enablePasswordlessAuth'</td>\n</tr>\n<tr class=\"\
    alt-row\">\n    <td>sshKeysAttributeName</td>\n    <td>Added String Attribute 'sshKeysAttributeName'</td>\n    </tr>\n\
    \    </table>\n<br><br>\n<h2>Resource Definition</h2>\n<table>\n<tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid\
    \ #CCCCCC .75pt;background:#DEEDF7'><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Default\
    \ Values</b></td><td><b>Example Values</b></td></tr>\n<tr><td style='font-family:monospace'>name</td><td>String</td><td>Yes</td><td>Resource\
    \ Name. Maximum 32 characters allowed. Allowed characters are alphanumeric and .-_/\\\\ characters</td><td></td><td>Company_users</td></tr>\n\
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>id</td><td>String</td><td>No</td><td>Resource\
    \ UUID value</td><td></td><td>af1cd190-7d71-11eb-b02e-ead13cf60dcb</td></tr>\n<tr><td style='font-family:monospace'>description</td><td>String</td><td>No</td><td>No\
    \ character restriction</td><td></td><td>Group of Active company users</td></tr>\n<tr valign=top style='background:#f8f8f8'><td\
    \ style='font-family:monospace'>domain</td><td>String</td><td>Yes</td><td>The AD domain. Alphanumeric, hyphen (-) and\
    \ dot (.) characters are allowed</td><td></td><td>cisco.com</td></tr>\n<tr><td style='font-family:monospace'>adScopesNames</td><td>String</td><td>No</td><td>String\
    \ that contains the names of the scopes that the active directory belongs to. Names are separated by comma. Alphanumeric,\
    \ underscore (_) characters are allowed</td><td>Default_Scope</td><td></td></tr>\n<tr valign=top style='background:#f8f8f8'><td\
    \ style='font-family:monospace'>enableDomainWhiteList</td><td>Boolean</td><td>No</td><td></td><td>true</td><td></td></tr>\n\
    <tr><td style='font-family:monospace'>adGroups</td><td>List</td><td>No</td><td>Holds list of AD Groups</td><td></td><td></td></tr>\n\
    <tr><td style='font-family:monospace'>- groups</td><td>List</td><td>No</td><td>List of Groups</td><td></td><td></td></tr>\n\
    <tr><td style='font-family:monospace'>&nbsp - name</td><td>String</td><td>Yes</td><td>Required for each group in the group\
    \ list with no duplication between groups. All characters are allowed except %</td><td></td><td>cisco.com/operators</td></tr>\n\
    <tr><td style='font-family:monospace'>&nbsp - sid</td><td>String</td><td>Yes</td><td>Cisco ISE uses security identifiers\
    \ (SIDs) for optimization of group membership evaluation. SIDs are useful for efficiency (speed) when the groups are evaluated.\
    \ All characters are allowed except %</td><td></td><td>S-1-5-32-548</td></tr>\n<tr><td style='font-family:monospace'>&nbsp\
    \ - type</td><td>String</td><td>No</td><td>No character restriction</td><td></td><td>GLOBAL</td></tr>\n<tr valign=top\
    \ style='background:#f8f8f8'><td style='font-family:monospace'>adAttributes</td><td>List</td><td>No</td><td>Holds list\
    \ of AD Attributes</td><td></td><td></td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>-\
    \ attributes</td><td>List</td><td>No</td><td>List of Attributes</td><td></td><td></td></tr>\n<tr valign=top style='background:#f8f8f8'><td\
    \ style='font-family:monospace'>&nbsp - name</td><td>String</td><td>Yes</td><td>Required for each attribute in the attribute\
    \ list with no duplication between attributes. All characters are allowed except <%\"</td><td></td><td>name1</td></tr>\n\
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - type</td><td>Enum</td><td>Yes</td><td>Required\
    \ for each group in the group list. Allowed values: <br>- STRING, <br>- IP, <br>- BOOLEAN, <br>- INT, <br>- OCTET_STRING</td><td>STRING</td><td></td></tr>\n\
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - internalName</td><td>String</td><td>Yes</td><td>Required\
    \ for each attribute in the attribute list. All characters are allowed except <%\"</td><td></td><td>internalName1</td></tr>\n\
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - defaultValue</td><td>String</td><td>Yes</td><td>Required\
    \ for each attribute in the attribute list. Can contain an empty string. All characters are allowed except <%\"</td><td></td><td>defaultString</td></tr>\n\
    <tr><td style='font-family:monospace'>advancedSettings</td><td>List</td><td>No</td><td></td><td></td><td></td></tr>\n\
    <tr><td style='font-family:monospace'>- rewriteRules</td><td> List</td><td>No</td><td> Identity rewrite is an advanced\
    \ feature that directs Cisco ISE to manipulate the identity before it is passed to the external Active Directory system.\
    \ You can create rules to change the identity to a desired format that includes or excludes a domain prefix and/or suffix\
    \ or other additional markup of your choice</td><td></td><td></td></tr>\n<tr><td style='font-family:monospace'>&nbsp -\
    \ rowId</td><td>Integer</td><td>Yes</td><td>Required for each rule in the list in serial order</td><td></td><td>0</td></tr>\n\
    <tr><td style='font-family:monospace'>&nbsp - rewriteMatch</td><td>String</td><td>Yes</td><td>Required for each rule in\
    \ the list with no duplication between rules. All characters are allowed except %\"</td><td></td><td>exampleMatch0</td></tr>\n\
    <tr><td style='font-family:monospace'>&nbsp - rewriteResult</td><td>String</td><td>Yes</td><td>Required for each rule\
    \ in the list. All characters are allowed except %\"</td><td></td><td>exampleResult0</td></tr>\n<tr><td style='font-family:monospace'>-\
    \ enableRewrites</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>\n<tr><td style='font-family:monospace'>-\
    \ enablePassChange</td><td>Boolean</td><td>No</td><td></td><td>true</td><td></td></tr>\n<tr><td style='font-family:monospace'>-\
    \ enableMachineAuth</td><td>Boolean</td><td>No</td><td></td><td>true</td><td></td></tr>\n<tr><td style='font-family:monospace'>-\
    \ enableMachineAccess</td><td>Boolean</td><td>No</td><td></td><td>true</td><td></td></tr>\n<tr><td style='font-family:monospace'>-\
    \ enableDialinPermissionCheck</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>\n<tr><td style='font-family:monospace'>-\
    \ plaintextAuth</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>\n<tr><td style='font-family:monospace'>-\
    \ agingTime</td><td>Integer</td><td>No</td><td>Range 1-8760 hours</td><td>5</td><td></td></tr>\n<tr><td style='font-family:monospace'>-\
    \ enableCallbackForDialinClient</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>\n<tr><td style='font-family:monospace'>-\
    \ identityNotInAdBehaviour</td><td>Enum</td><td>No</td><td>Allowed values: <br>- REJECT, <br>- SEARCH_JOINED_FOREST, <br>-\
    \ SEARCH_ALL</td><td>SEARCH_JOINED_FOREST</td><td></td></tr>\n<tr><td style='font-family:monospace'>- unreachableDomainsBehaviour</td><td>Enum</td><td>No</td><td>Allowed\
    \ values: <br>- PROCEED, <br>- DROP</td><td>PROCEED</td><td></td></tr>\n<tr><td style='font-family:monospace'>- schema</td><td>Enum</td><td>No</td><td>Allowed\
    \ values: <br>- ACTIVE_DIRECTORY, <br>- CUSTOM<br>Choose ACTIVE_DIRECTORY schema when the AD attributes defined in AD\
    \ can be copied to relevant attributes in Cisco ISE. If customization is needed, choose CUSTOM schema. All User info attributes\
    \ are always set to default value if schema is ACTIVE_DIRECTORY. Values can be changed only for CUSTOM schema</td><td>ACTIVE_DIRECTORY</td><td></td></tr>\n\
    <tr><td style='font-family:monospace'>- firstName</td><td>String</td><td>No</td><td>User info attribute. All characters\
    \ are allowed except %</td><td>givenName</td><td></td></tr>\n<tr><td style='font-family:monospace'>- department</td><td>String</td><td>No</td><td>User\
    \ info attribute. All characters are allowed except %</td><td>department</td><td></td></tr>\n<tr><td style='font-family:monospace'>-\
    \ lastName</td><td>String</td><td>No</td><td>User info attribute. All characters are allowed except %</td><td>sn</td><td></td></tr>\n\
    <tr><td style='font-family:monospace'>- organizationalUnit</td><td>String</td><td>No</td><td>User info attribute. All\
    \ characters are allowed except %</td><td>company</td><td></td></tr>\n<tr><td style='font-family:monospace'>- jobTitle</td><td>String</td><td>No</td><td>User\
    \ info attribute. All characters are allowed except %</td><td>title</td><td></td></tr>\n<tr><td style='font-family:monospace'>-\
    \ locality</td><td>String</td><td>No</td><td>User info attribute. All characters are allowed except %</td><td>l</td><td></td></tr>\n\
    <tr><td style='font-family:monospace'>- email</td><td>String</td><td>No</td><td>User info attribute. All characters are\
    \ allowed except %</td><td>mail</td><td></td></tr>\n<tr><td style='font-family:monospace'>- stateOrProvince</td><td>String</td><td>No</td><td>User\
    \ info attribute. All characters are allowed except %</td><td>st</td><td></td></tr>\n<tr><td style='font-family:monospace'>-\
    \ telephone</td><td>String</td><td>No</td><td>User info attribute. All characters are allowed except %</td><td>telephoneNumber</td><td></td></tr>\n\
    <tr><td style='font-family:monospace'>- country</td><td>String</td><td>No</td><td>User info attribute. All characters\
    \ are allowed except %</td><td>co</td><td></td></tr>\n<tr><td style='font-family:monospace'>- streetAddress</td><td>String</td><td>No</td><td>User\
    \ info attribute. All characters are allowed except %</td><td>streetAddress</td><td></td></tr>\n<tr><td style='font-family:monospace'>-\
    \ enableFailedAuthProtection</td><td>Boolean</td><td>No</td><td>Enable prevent AD account lockout due to too many bad\
    \ password attempts</td><td>false</td><td></td></tr>\n<tr><td style='font-family:monospace'>- failedAuthThreshold</td><td>Integer</td><td>No</td><td>Number\
    \ of bad password attempts</td><td>5</td><td></td></tr>\n<tr style= 'border-bottom:solid #CCCCCC 1.0pt'><td style='font-family:monospace'>-\
    \ authProtectionType</td><td>Enum</td><td>No</td><td>Enable prevent AD account lockout. Allowed values:<br>- WIRELESS,\
    \ <br>- WIRED, <br>- BOTH</td><td>WIRELESS</td><td></td></tr>\n<tr style= 'border-bottom:solid #CCCCCC 1.0pt'><td style='font-family:monospace'>-\
    \ enablePasswordlessAuth</td><td>Boolean</td><td>No</td><td>Enable passwordless authentication</td><td>false</td><td></td></tr>\n\
    </table>\n"
  version: 1.0.0
  title: Active Directory
  x-provenance:
    method: harvested
    authored_by: Cisco
    harvested_by: API Evangelist
    harvested_on: '2026-08-19'
