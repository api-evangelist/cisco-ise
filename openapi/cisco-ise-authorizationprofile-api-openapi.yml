                macSecPolicy: MUST_SECURE
                profileName: Cisco
                avcProfile: avcProfile
                voiceDomainPermission: false
                description: description
                acl: aclfilter
                asaVpn: Cisco:cisco-call-type
                ipv6ACLFilter: ipv6ACLFilter
