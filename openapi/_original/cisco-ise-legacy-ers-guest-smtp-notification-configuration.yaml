swagger: '2.0'
info:
  description: |
    Guest SMTP notification configuration API is a global setting for enabling email notifications within guest application. These APIs allow to create, update and retrieve the notification settings. The create API may not be required to be used as of Cisco ISE Release 2.2 because the single SMTP notification configuration is the only one used and it always gets created during the Cisco ISE application initialization period.
    
    <h2>Revision History</h2>
    <table font-family:monospace> 
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Revision #</b></td><td><b>Resource Version</b></td><td><b>Cisco ISE Version</b></td><td><b>Description</b></td></tr>
    <tr><td>0</td><td>1.0</td><td>2.2</td><td>Initial Cisco ISE Version</td></tr>
    <tr style= 'border-bottom:solid #CCCCCC 1.0pt;background:#f8f8f8'><td>1</td><td>1.1</td><td>3.2</td><td>Added Patch operation</td></tr>
    </table>
    <br><br>
    <h2>Resource Definition</h2>
    <table>
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Default Values</b></td><td><b>Example Values</b></td></tr>
    <tr><td style='font-family:monospace'>name</td><td>String</td><td>Yes</td><td>Resource Name</td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>id</td><td>String</td><td>No</td><td>Resource UUID, mandatory for update</td><td></td><td>9ecb5340-8c01-11e6-996c-525400b48521</td></tr>
    <tr><td style='font-family:monospace'>description</td><td>String</td><td>No</td><td>Resource Description</td><td></td><td></td></tr>
    <tr style= 'background:#f8f8f8'><td style='font-family:monospace'>defaultFromAddress</td><td>String</td><td>No</td><td>The default from email address to be used to send emails from</td><td>donotreply@example.com</td><td></td></tr>
    <tr><td style='font-family:monospace'>notificationEnabled</td><td>Boolean</td><td>No</td><td>Indicates if the email notification service is to be enabled</td><td>true</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>smtpServer</td><td>String</td><td>No</td><td>The SMTP server ip address or fqdn such as outbound.mycompany.com</td><td></td><td></td></tr>
    <tr><td style='font-family:monospace'>useDefaultFromAddress</td><td>Boolean</td><td>No</td><td>If the default from address should be used rather than using a sponsor user email address</td><td>false</td><td></td></tr>
    <tr style= 'background:#f8f8f8'><td style='font-family:monospace'>smtpPort</td><td>String</td><td>No</td><td>Port at which SMTP Secure Server is listening</td><td>25</td><td></td></tr>
    <tr><td style='font-family:monospace'>connectionTimeout</td><td>String</td><td>No</td><td>Interval in seconds for all the SMTP client connections</td><td>60</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>useTLSorSSLEncryption</td><td>Boolean</td><td>No</td><td>If configured to true, SMTP server authentication will happen using TLS/SSL</td><td>false</td><td></td></tr>
    <tr><td style='font-family:monospace'>usePasswordAuthentication</td><td>Boolean</td><td>No</td><td>If configured to true, SMTP server authentication will happen using username/password</td><td>false</td><td></td></tr>
    <tr style= 'background:#f8f8f8'><td style='font-family:monospace'>userName</td><td>String</td><td>No</td><td>Username of Secure SMTP server</td><td></td><td></td></tr>
    <tr style= 'border-bottom:solid #CCCCCC 1.0pt'><td style='font-family:monospace'>password</td><td>String</td><td>No</td><td>Password of Secure SMTP server</td><td></td><td></td></tr>
    </table>
  
  version: 1.0.0
  title: Guest SMTP Notification Configuration

tags:
- name: guestsmtpnotificationconfiguration


paths:
  /ers/config/guestsmtpnotificationsettings/{id}:
    get:
      tags: 
      - guestsmtpnotificationconfiguration
      summary: Get guest SMTP notification configuration by ID
      description:
        <p>This API allows the client to get a guest SMTP notification configuration by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.guestsmtpnotificationsettings.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
              Example:- fetch
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/guestsmtp'
    
    patch:
      tags: 
      - guestsmtpnotificationconfiguration
      summary: Update part of the guest SMTP notification configuration by ID
      description:
        <p>This API allows the user to update part of the guest SMTP notification configuration by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.guestsmtpnotificationsettings.1.0
          required: false
        - in: body
          name: request
          schema:
            $ref: '#/definitions/patchRequest'
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/guestsmtp'  
            
    put:
      tags:
      - guestsmtpnotificationconfiguration
      summary: Update SMTP notification configuration
      description:  <p>This API allows the client to update a SMTP configuration setting.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.guestsmtpnotificationsettings.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: body
          name: request
          schema:
            $ref: '#/definitions/guestsmtp'
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/Update'  
          
  /ers/config/guestsmtpnotificationsettings:
    get:
      tags: 
      - guestsmtpnotificationconfiguration
      summary: Get all guest SMTP notification configurations
      description:
        <p>This API allows the client to get all the guest SMTP notification configurations.</p>
        <p><h1>Filter:</h1> <h3>[name]</h3></p>
        <p>To search guest users by using <b>toDate</b> column,follow the format:</p> 
        <p>DD-MON-YY (Example:13-SEP-18)</p>
        <ul>
        <li><p>Day or Year:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13</p></li>
        <li><p>Month:GET /ers/config/guestuser/?filter=toDate.CONTAINS.SEP</p></li>
        <li><p>Date:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13-SEP-18</p></li>
        </ul>
        <p><h1>Sorting:</h1> <h3>[name, description]</h3></p>    
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.guestsmtpnotificationsettings.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
             Example:- fetch
         
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/search'  

    post:
      tags:
      - guestsmtpnotificationconfiguration
      summary: Create guest SMTP notification configuration
      description:
        <p>This API creates a guest SMTP notification configuration.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.guestsmtpnotificationsettings.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: body
          name: request
          schema:
            $ref: '#/definitions/guestsmtp'
      responses:
        201:
          description: Created
             
  /ers/config/guestsmtpnotificationsettings/versioninfo:
    get:
      tags:
      - guestsmtpnotificationconfiguration
      summary: Get guest smtp notification configuration version information
      description:
        <p>This API helps to retrieve the version information related to the guest smtp notification configuration.</p>
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VersionInfo'
            
definitions:
  guestsmtp:
    type: object
    properties:
      ERSGuestSmtpNotificationSettings:
        $ref: '#/definitions/ERSGuestSmtpNotificationSettings'
        
  ERSGuestSmtpNotificationSettings:
    type: object
    properties:
      id:
        type: string
        example: 9ecb5340-8c01-11e6-996c-525400b48521
      smtpServer:
        type: string
        example: ""
      notificationEnabled:
        type: boolean
        example: true
      useDefaultFromAddress:
        type: boolean
        example: false
      defaultFromAddress:
        type: string
        example: donotreply@example.com
      smtpPort:
        type: string
        example: 25
      connectionTimeout:
        type: string
        example: 60
      useTLSorSSLEncryption:
        type: boolean
        example: false
      usePasswordAuthentication:
        type: boolean
        example: false
      userName:
        type: string
        example: ""
      password:
        type: string
        example: ""
      link:
        type: object
        properties:
          rel:
            type: string
            example: self
          href:
            type: string
            example: https://<ise-ip>:9060/ers/config/ers/config/guestsmtpnotificationsettings/9ecb5340-8c01-11e6-996c-525400b48521
          type:
            type: string
            example: application/json      
  
  patchRequest:
    type: object
    properties:
      ERSGuestSmtpNotificationSettings:
        $ref: '#/definitions/patchRequestBody'	
        
  patchRequestBody:
    type: object
    properties:
      any-resource-attribute:
        type: string
        example: some-updated-value
      another-resource-attribute:
        type: string
        example: some-updated-value   
  Update:
    type: object
    properties:
      UpdatedFieldsList:
        $ref: '#/definitions/UpdatedFieldsList'
        
  UpdatedFieldsList:
    type: object
    properties:
      updatedField:
         $ref: '#/definitions/UpdatedField'
      field:
        type: string
        example: some other field
      oldValue:
        type: string
        example: val_old
      newValue:
        type: string
        example: val_new
        
  UpdatedField:
    type: object
    properties:
      field:
        type: string
        example: field1
      oldValue:
        type: string
        example: val_old
      newValue:
        type: string
        example: val_new   

  search:
    type: object
    properties:
      SearchResult:
        $ref: '#/definitions/SearchResult'
        
  SearchResult:   
    type: object
    properties:
      total:
        type: integer
        example: 1
      resources:
        type: array
        example: [{"id" : "9ecb5340-8c01-11e6-996c-525400b48521", "link" : {"rel" : "self" ,  "href" : "https://<ise-ip>:9060/ers/config/ers/config/guestsmtpnotificationsettings/9ecb5340-8c01-11e6-996c-525400b48521", "type" : "application/json"}}]
        items:
          properties:
            name:
              type: string
              
  VersionInfo:
    type: object
    properties:
      VersionInfo:
        $ref: '#/definitions/version'
        
  version:
    type: object
    properties:
      currentServerVersion:
        type: string
        example: "1.0"
      supportedVersions:
        type: string
        example: "1.0"  
      link:
        $ref: '#/definitions/link1'
        
  link1:
    type: object
    properties:
      rel:
        type: string
        example: self
      href:
        type: string
        example: https://<ise-ip>:9060/ers/config/guestsmtpnotificationsettings/versioninfo
      type:
        type: string
        example: application/json
