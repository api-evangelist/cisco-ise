tags:
- name: supportbundletriggerconfiguration
paths:
  /ers/config/supportbundle:
    post:
      tags:
      - supportbundletriggerconfiguration
      summary: Create support bundle trigger configuration
      description: <p>This API allows the client to create a support bundle trigger configuration.</p>
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        description: Example:- supportbundle.supportbundle.1.0
        required: false
        schema:
          type: string
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        description: Required Only if Enabled from GUI Example:- fetch
        schema:
          type: string
      responses:
        201:
          description: Created
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/supportbundletriggerconfiguration'
          application/xml:
            schema:
              $ref: '#/components/schemas/supportbundletriggerconfiguration'
  /ers/config/supportbundle/versioninfo:
    get:
      tags:
      - supportbundletriggerconfiguration
      summary: Get support bundle trigger configuration version information
      description: <p>This API helps to retrieve the version information related to the support bundle trigger configuration.</p>
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
components:
  schemas:
    supportbundletriggerconfiguration:
      type: object
      properties:
        SupportBundle:
          $ref: '#/components/schemas/SupportBundle'
    VersionInfo:
      type: object
      properties:
        VersionInfo:
          $ref: '#/components/schemas/version'
    SupportBundle:
      type: object
      properties:
        name:
          type: string
          example: supportBundle
        description:
          type: string
          example: Support Bundle Generation
        hostName:
          type: string
          example: sampleHost
        supportBundleIncludeOptions:
          type: object
          properties:
            includeConfigDB:
              type: boolean
              example: true
            includeDebugLogs:
              type: boolean
              example: true
            includeLocalLogs:
              type: boolean
              example: true
            includeCoreFiles:
              type: boolean
              example: true
            mntLogs:
              type: boolean
              example: true
            includeSystemLogs:
              type: boolean
              example: true
            policyXml:
              type: boolean
              example: true
            fromDate:
              type: string
              example: 04/21/2019
            toDate:
              type: string
              example: 04/22/2019
    version:
      type: object
      properties:
        currentServerVersion:
          type: string
          example: '1.0'
        supportedVersions:
          type: string
          example: '1.0'
        link:
          $ref: '#/components/schemas/link1'
    link1:
      type: object
      properties:
        rel:
          type: string
          example: self
        href:
          type: string
          example: https://<ise-ip>:9060/ers/config/supportbundle/versioninfo
        type:
          type: string
          example: application/json
