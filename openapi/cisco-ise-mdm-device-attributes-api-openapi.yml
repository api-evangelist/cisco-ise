      summary: Send the device attributes to the MDM server
      description: This “POST” version of query API is functional equivalent API from “GET” version. “POST” version allows
        passing multiple values of a particular query criterion. For example, if query criterion is macaddress, then it can
        pass a list of mac addresses for the query.<br><br> <table> <tr><td><b>Version</b></td><td><b>URL</b></td><tr> <tr><td>1</td><td>/devices/{paging}/{Query
        Criteria Category}/{value}/{Attribute filter}</td></tr> <tr><td>2</td><td>/devices/?paging={paging}&querycriteria={Query
        Criteria category}&value={Query Criteria value}&filter={Attribute filter}</td></tr> </table>
      parameters:
      - name: api_path
        in: path
        description: api_path obtained from GET operation of mdm-server-info
        required: true
        schema:
          type: string
      - name: paging
        in: query
        description: 0 means first call.
        required: true
        schema:
