swagger: '2.0'
info:
  description: |
    Network Device Group API allows the client to search network device groups.
    
    <h2>Revision History</h2>
    <table font-family:monospace>
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Revision #</b></td><td><b>Resource Version</b></td><td><b>Cisco ISE Version</b></td><td><b>Description</b></td></tr>
    <tr><td>0</td><td>1.0</td><td>1.3</td><td>Initial Cisco ISE Version</td></tr>
    <tr style='background:#f8f8f8'><td>1</td><td>1.1</td><td>2.4</td><td>Added GetByName operation</td></tr>

    <tr style='border-bottom:solid #CCCCCC 1.0pt'><td>2</td><td>1.2</td><td>3.2</td><td>Added Patch operation</td></tr>

    </table>
    <br><br>
    
    <h2>Resource Definition</h2>
    <table>
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Example Values</b></td></tr>
    <tr><td style='font-family:monospace'>name</td><td>String</td><td>Yes</td><td>Resource Name</td><td>Device Type#All Device Types</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>id</td><td>String</td><td>No</td><td>Resource UUID, mandatory for update</td><td>70c79c30-8bff-11e6-996c-525400b48521</td></tr>
    <tr><td style='font-family:monospace'>description</td><td>String</td><td>No</td><td>Resource Description</td><td>All Device Types</td></tr>
    <tr valign=top style='background:#f8f8f8; border-bottom:solid #CCCCCC 1.0pt'><td style='font-family:monospace'>othername</td><td>String</td><td>No</td><td></td><td>Device Type</td></tr>
    </table>
    
  version: 1.0.0
  title: Network Device Group

tags:
- name: networkdevicegroup

paths:
  /ers/config/networkdevicegroup/name/{name}:
    get:
      tags: 
      - networkdevicegroup
      summary: Get network device group by name
      description:
        <p>This API allows the client to get a network device group by name.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: name
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- network.networkdevicegroup.1.1
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
              Example:- fetch
        - in: header
          name: Additional Information
          type: string
          description: 
               <table>
               <tr><td>NDG GetByName</td><td></td><td></td></tr>
               <tr><td>NDG Name</td><td>(Required):</td><td>(:) colon is used as a seperator instead of (#) in the NDG name. For example, if the name is a#b#c it should appear in the request URL as a:b:c</td></tr>
               </table>      
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/networkgroup_name'
          
  /ers/config/networkdevicegroup/{id}:
    get:
      tags: 
      - networkdevicegroup
      summary: Get network device group by ID
      description:
        <p>This API allows the client to get a network device group by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- network.networkdevicegroup.1.1
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
              Example:- fetch
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/networkgroup'
    

    patch:
      tags: 
      - networkdevicegroup
      summary: Update part of the network device group configuration by ID
      description:
        <p>This API allows the user to update part of the network device group configuration by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- network.networkdevicegroup.1.1
          required: false
        - in: body
          name: request
          schema:
            $ref: '#/definitions/patchRequest'
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/networkgroup'  


    put:
      tags:
      - networkdevicegroup
      summary: Update network device group
      description:  <p>This API allows the client to update a network device group.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- network.networkdevicegroup.1.1
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: body
          name: request
          schema:
            $ref: '#/definitions/networkgroup'
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/Update'  
            
    delete:
      tags:
      - networkdevicegroup
      summary: Delete network device group
      description:
        <p>This API deletes a network device group.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- network.networkdevicegroup.1.1
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
      responses: 
        204:
          description: No Content  
          
  /ers/config/networkdevicegroup:
    get:
      tags: 
      - networkdevicegroup
      summary: Get all network device groups
      description:
        <p>This API allows the client to get all the network device groups.</p>
        <p><h1>Filter:</h1> <h3>[name, description, type]</h3></p>
        <p>To search guest users by using <b>toDate</b> column,follow the format:</p> 
        <p>DD-MON-YY (Example:13-SEP-18)</p>
        <ul>
        <li><p>Day or Year:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13</p></li>
        <li><p>Month:GET /ers/config/guestuser/?filter=toDate.CONTAINS.SEP</p></li>
        <li><p>Date:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13-SEP-18</p></li>
        </ul>
        <p><h1>Sorting:</h1> <h3>[name, description]</h3></p>             
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- network.networkdevicegroup.1.1
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
             Example:- fetch
         
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/search'  

    post:
      tags:
      - networkdevicegroup
      summary: Create network device group
      description:
        <p>This API creates a network device group.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- network.networkdevicegroup.1.1
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: body
          name: request
          schema:
            $ref: '#/definitions/networkgroup'
      responses:
        201:
          description: Created
             
  /ers/config/networkdevicegroup/versioninfo:
    get:
      tags:
      - networkdevicegroup
      summary: Get network device group version information
      description:
        <p>This API helps to retrieve the version information related to the network device group.</p>
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VersionInfo'

definitions:
