components:
  schemas:
    Link:
      type: object
      properties:
        rel:
          type: string
          example: self
          enum:
          - next
          - previous
          - self
          - status
        href:
          type: string
          example: https://{server}:{port}/ers/config
        type:
          type: string
          example: application/json
      example: null
    certificateprofileResponseEntity:
      properties:
        allowedAsUserName:
          title: allowedAsUserName
          type: boolean
          description: To be set true or false
          example: null
        externalIdentityStoreName:
          title: externalIdentityStoreName
          type: string
          description: referred IDStore name for the Certificate Profile or [not applicable] in case no identity store is
            chosen
          example: null
        certificateAttributeName:
          title: certificateAttributeName
          type: object
          description: 'Attribute name of the Certificate Profile - used only when CERTIFICATE is chosen in usernameFrom.
            Allowed values: SUBJECT_COMMON_NAME, SUBJECT_ALTERNATIVE_NAME, SUBJECT_SERIAL_NUMBER, SUBJECT, SUBJECT_ALTERNATIVE_NAME_OTHER_NAME,
            SUBJECT_ALTERNATIVE_NAME_EMAIL, SUBJECT_ALTERNATIVE_NAME_DNS. Additional internal value ALL_SUBJECT_AND_ALTERNATIVE_NAMES
            is used automatically when usernameFrom=UPN'
          example: null
        matchMode:
          title: matchMode
          type: object
          description: 'Match mode of the Certificate Profile. Allowed values: NEVER, RESOLVE_IDENTITY_AMBIGUITY, BINARY_COMPARISON'
          example: null
        usernameFrom:
          title: usernameFrom
          type: object
          description: 'The attribute in the certificate where the user name should be taken from. Allowed values: CERTIFICATE
            (for a specific attribute as defined in certificateAttributeName), UPN (for using any Subject or Alternative Name
            Attributes in the Certificate - an option only in AD)'
          example: null
        name:
          title: name
          type: string
          description: name
          example: null
        id:
          title: id
          type: string
          description: Id
          example: null
        description:
          title: description
          type: string
          description: Description
          example: null
        link:
          $ref: '#/components/schemas/Link'
      example: null
    ca.certificateprofile:
      required:
      - CertificateProfile
      type: object
      properties:
        CertificateProfile:
          $ref: '#/components/schemas/CertificateProfile'
      example: null
    updatedField:
