tags:
- name: smsprovider
paths:
  /ers/config/smsprovider:
    get:
      tags:
      - smsprovider
      summary: Get all SMS providers
      description: <p>This API allows the client to get all the SMS providers.</p> <p><h1>Filter:</h1> <h3>[name]</h3></p>
        <p>To search guest users by using <b>toDate</b> column,follow the format:</p> <p>DD-MON-YY (Example:13-SEP-18)</p>
        <ul> <li><p>Day or Year:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13</p></li> <li><p>Month:GET /ers/config/guestuser/?filter=toDate.CONTAINS.SEP</p></li>
        <li><p>Date:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13-SEP-18</p></li> </ul> <p><h1>Sorting:</h1> <h3>[name,
        description]</h3></p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- identity.smsprovider.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: Required Only if Enabled from GUI Example:- fetch
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/search'
  /ers/config/smsprovider/versioninfo:
    get:
      tags:
      - smsprovider
      summary: Get SMS provider version information
      description: <p>This API helps to retrieve the version information related to the SMS provider.</p>
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VersionInfo'
definitions:
  search:
    type: object
    properties:
      SearchResult:
        $ref: '#/definitions/SearchResult'
  SearchResult:
    type: object
    properties:
      total:
        type: integer
        example: 1
      resources:
        type: array
        example:
        - id: '  b1155994-b736-46af-9add-04bed3058e3a'
          name: name
          link:
            rel: self
            href: https://<ise-ip>:9060/ers/config/smsprovider/b1155994-b736-46af-9add-04bed3058e3a
            type: application/json
        items:
          properties:
            name:
              type: string
  VersionInfo:
    type: object
    properties:
      VersionInfo:
        $ref: '#/definitions/version'
  version:
    type: object
    properties:
      currentServerVersion:
        type: string
        example: '1.0'
      supportedVersions:
        type: string
        example: '1.0'
      link:
        $ref: '#/definitions/link1'
  link1:
    type: object
    properties:
      rel:
        type: string
        example: self
      href:
        type: string
        example: https://<ise-ip>:9060/ers/config/smsprovider/versioninfo
      type:
        type: string
        example: application/json
