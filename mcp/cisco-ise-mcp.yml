note: Cisco publishes NO first-party MCP server for Cisco Identity Services Engine. There is no hosted endpoint, no Cisco-published
  npm or PyPI package, and no mention of MCP in the ISE developer documentation or the CiscoISE GitHub organisation. The tool
  list below is a CANDIDATE derived from Cisco's own OpenAPI operations — it is a proposal, not something anyone ships. No
  MCPServer pointer is emitted in apis.yml, because emitting one would credit Cisco with an agent surface it does not operate.
third_party_servers:
- name: ISE_MCP
  author: John Capobianco (automateyournetwork)
  url: https://github.com/automateyournetwork/ISE_MCP
  transport: stdio
  implementation: Python fastmcp; generates tools dynamically from a configured list of ISE REST resources
  first_party: false
- name: cisco-ise-mcp
  author: dlhace
  url: https://glama.ai/mcp/servers/dlhace/cisco-ise-mcp
  first_party: false
third_party_note: Recorded for accuracy, not credited to Cisco. Both are community projects wrapping the same public ISE APIs
  this repo harvests. Neither is operated, endorsed or distributed by Cisco.
related_cisco_mcp:
  note: Cisco does run MCP elsewhere in its portfolio — the DevNet foundation-search MCP and the Webex messaging MCP — but
    neither serves Cisco ISE, and neither belongs to this provider profile.
