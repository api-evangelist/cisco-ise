  version: 1.0.0
  title: selfregportal

tags:
- name: selfregportal

paths:
  /ers/config/selfregportal/{portal-id}:
    get:
      tags: 
      - selfregportal
      summary: Get self registered portal by ID
      description:
        <p>This API allows the client to get a self registered portal by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: portal-id
          in: path
          type: string
          required: true
          description: |
            The portal ID is a dynamically generated value.<br>For example :- ‘b7e7d773-7bb3-442b-a50b-42837c12248a’
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- portal.selfregportal.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
              Example:- fetch
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/selfreg'
    patch:
      tags: 
      - selfregportal
      summary: Update part of the Self Registered Portal by ID
      description:
        <p>Update any attribute subset of the Self Registered Portal. Only the attributes sent are affected.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- portal.selfregportal.1.0
          required: false
        - in: body
          name: request
          schema:
            $ref: '#/definitions/patchRequest'
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/selfreg'  
            
    put:
      tags:
      - selfregportal
      summary: Update self registered portal by ID
      description:  <p>This API allows the client to update a self registered portal by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: portal-id
          in: path
          type: string
          required: true
          description: |
            The portal ID is a dynamically generated value.<br>For example :- ‘b7e7d773-7bb3-442b-a50b-42837c12248a’
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:-   portal.selfregportal.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: header
          name: Bulk Support
          type: string
          description: 
              Operation 'UpdateById' can be used within Bulk Request
          required: false
        - in: body
          name: request
          schema:
            $ref: '#/definitions/selfreg'
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/Update'  

    delete:
      tags:
      - selfregportal
      summary: Delete self registered portal by ID
      description:
        <p>This API deletes a self registered portal by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: portal-id
          in: path
          type: string
          required: true
          description: |
            The portal ID is a dynamically generated value.<br>For example :- ‘b7e7d773-7bb3-442b-a50b-42837c12248a’
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- portal.selfregportal.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: header
          name: Bulk Support
          type: string
          description: 
              Operation 'DeleteById' can be used within Bulk Request
          required: false        
      responses: 
        204:
          description: No content    
          
  /ers/config/selfregportal:
    get:
      tags: 
      - selfregportal
      summary: Get all self registered portals
      description:
        <p>This API allows the client to get all the self registered portals.</p>
        <p><h1>Filter:</h1> <h3>[name]</h3></p>
        <p>To search guest users by using <b>toDate</b> column,follow the format:</p> 
        <p>DD-MON-YY (Example:13-SEP-18)</p>
        <ul>
        <li><p>Day or Year:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13</p></li>
        <li><p>Month:GET /ers/config/guestuser/?filter=toDate.CONTAINS.SEP</p></li>
        <li><p>Date:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13-SEP-18</p></li>
        </ul>
        <p><h1>Sorting:</h1> <h3>[name, description]</h3></p>     
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- portal.selfregportal.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
             Example:- fetch
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/search'  
            
    post:
      tags:
      - selfregportal
      summary: Create self registered portal
      description:
        <p>This API creates a self registered portal.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- portal.selfregportal.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: header
          name: Bulk Support
          type: string
          description: 
              Operation 'Create' can be used within Bulk Request
          required: false                    
        - in: body
          name: request
          schema:
            $ref: '#/definitions/selfreg'
      responses:
        201:
          description: Created

  /ers/config/selfregportal/versioninfo:
    get:
      tags:
      - selfregportal
      summary: Get self registered portal version information
      description:
        <p>This API helps to retrieve the version information related to the self registered portal.</p>
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VersionInfo'
            
definitions:
  selfreg:
    type: object
    properties:
      SelfRegPortal:
        $ref: '#/definitions/SelfRegPortal'
        
  SelfRegPortal:
    type: object
    properties:
      id:
        type: string
        example: 4e8ade36-4048-472a-b345-632cc155acfc
      name:
        type: string
        example: Self-Registered Guest Portal (default)
      description:
        type: string
        example: Guests may create their own accounts and be assigned a username and password, or use their social login to access the network
      portalType:
        type: string
        example: SELFREGGUEST
      portalTestUrl:
        type: string
        example: https://<ise-ip>:8443/portal/PortalSetup.action?portal=4e8ade36-4048-472a-b345-632cc155acfc
      settings:
        type: object
        properties:
          portalSettings:
            type: object
            properties: 
              httpsPort:
                type: integer
                example: 8443
              allowedInterfaces:
                type: string
                example: [ "eth0", "bond0" ]
              certificateGroupTag:
                type: string
                example: Default Portal Certificate Group
              authenticationMethod:
                type: string
                example: 92e50f80-8c01-11e6-996c-525400b48521
              assignedGuestTypeForEmployee:
                type: string
                example: Contractor (default)
              displayLang:
                type: string
                example: USEBROWSERLOCALE
              fallbackLanguage:
                type: string
                example: English
              alwaysUsedLanguage:
                type: string
                example: English
          loginPageSettings:
            type: object
            properties:
              requireAccessCode:
                type: boolean
                example: false
              maxFailedAttemptsBeforeRateLimit:
                type: integer
                example: 5
              timeBetweenLoginsDuringRateLimit:
                type: integer
                example: 2
              includeAup:
                type: boolean
                example: false
              allowGuestToCreateAccounts:
                type: boolean
                example: true
              allowForgotPassword:
                type: boolean
                example: true
              allowGuestToChangePassword:
                type: boolean
                example: false
              allowAlternateGuestPortal:
                type: boolean
                example: false
              allowGuestToUseSocialAccounts:
                type: boolean
                example: false
              allowShowGuestForm:
                type: boolean
                example: false
              socialConfigs:
                type: array
                example: [
                    {
                        "socialMediaType": "",
                        "socialMediaValue": ""
                    }
                ]
                items:
                  properties:
                    name:
                      type: string
          selfRegPageSettings:
            properties:
              assignGuestsToGuestType:
                type: string
                example: Daily (default)
              accountValidityDuration:
                type: integer
                example: 1
              accountValidityTimeUnits:
                type: string
                example: DAYS
              requireRegistrationCode:
                type: boolean
                example: false
              fieldUserName:
                type: object
                properties:
                  include:
                    type: boolean
                    example: true
                  require:
                    type: boolean
                    example: false
              fieldFirstName:
                type: object
                properties:
                  include:
                    type: boolean
                    example: true
                  require:
                    type: boolean
                    example: false  
              fieldLastName:
                type: object
                properties:
                  include:
                    type: boolean
                    example: true
                  require:
                    type: boolean
                    example: false
              fieldEmailAddr:
                type: object
                properties:
                  include:
                    type: boolean
                    example: true
                  require:
                    type: boolean
                    example: false                      
              fieldPhoneNo:
                type: object
                properties:
                  include:
                    type: boolean
                    example: true
                  require:
                    type: boolean
                    example: false
              fieldCompany:
                type: object
                properties:
                  include:
                    type: boolean
                    example: true
                  require:
                    type: boolean
                    example: false  
              fieldLocation:
                type: object
                properties:
                  include:
                    type: boolean
                    example: true
                  require:
                    type: boolean
                    example: false
              selectableLocations:
                type: array
                example: ["San Jose"]
                items:
                  properties:
                    name:
                      type: string
              fieldSmsProvider:
                type: object
                properties:
                  include:
                    type: boolean
                    example: true
                  require:
                    type: boolean
                    example: false  
              selectableSmsProviders:
                type: array
                example: ["Global Default"]
                items:
                  properties:
                    name:
                      type: string              
              fieldPersonBeingVisited:
                type: object
                properties:
                  include:
                    type: boolean
                    example: true
                  require:
                    type: boolean
                    example: false                      
              fieldReasonForVisit:
                type: object
                properties:
                  include:
                    type: boolean
                    example: true
                  require:
                    type: boolean
                    example: false      
              includeAup:
                type: boolean
                example: false
              aupDisplay:
                type: string
                example: ONPAGE
              requireAupAcceptance:
                type: boolean
                example: false
              enableGuestEmailWhitelist:
                type: boolean
                example: false
              guestEmailWhitelistDomains:
                type: string
                example: []
              enableGuestEmailBlacklist:
                type: boolean
                example: false
              guestEmailBlacklistDomains:
                type: string
                example: []
              requireGuestApproval:
                type: boolean
                example: true
              autoLoginSelfWait:
                type: boolean
                example: false
              autoLoginTimePeriod:
                type: integer
                example: 5
              allowGraceAccess:
                type: boolean
                example: false
              graceAccessExpireInterval:
                type: integer
                example: 10
              graceAccessSendAccountExpiration:
                type: boolean
                example: false
              sendApprovalRequestTo:
                type: string
                example: SELECTEDEMAILADDRESSES
              postRegistrationRedirect:
                type: string
                example: SELFREGISTRATIONSUCCESS
              credentialNotificationUsingEmail:
                type: boolean
                example: false
              credentialNotificationUsingSms: 
                type: boolean
                example: false
              approveDenyLinksTimeUnits:
                type: string
                example: DAYS
              authenticateSponsorsUsingPortalList:
                type: string
                example: false
              sponsorPortalList:
                type: string
                example: []
          selfRegSuccessSettings:
            type: object
            properties:
              includeUserName:
                type: boolean
                example: true
              includePassword:
                type: boolean
                example: true
              includeFirstName:
                type: boolean
                example: true
              includeLastName:
                type: boolean
                example: true                
              includeEmailAddr:
                type: boolean
                example: true
              includePhoneNo:
                type: boolean
                example: true                
              includeCompany:
                type: boolean
                example: true
              includeLocation:
                type: boolean
                example: true                
              includeSmsProvider:
                type: boolean
                example: true
              includePersonBeingVisited:
                type: boolean
                example: true
              includeReasonForVisit:
                type: boolean
                example: true
              allowGuestSendSelfUsingPrint:
                type: boolean
                example: false                
              allowGuestSendSelfUsingEmail:
                type: boolean
                example: false
              allowGuestSendSelfUsingSms:
                type: boolean
                example: false                
              includeAup:
                type: boolean
                example: false
              aupOnPage:
                type: boolean
                example: false                 
              requireAupAcceptance:
                type: boolean
                example: false                
              requireAupScrolling:
                type: boolean
                example: false
              allowGuestLoginFromSelfregSuccessPage:
                type: boolean
                example: false                   
          aupSettings:
            type: object
            properties:
              includeAup:
                type: boolean
                example: true
              useDiffAupForEmployees:
                type: boolean
                example: false
              skipAupForEmployees:
                type: boolean
                example: false
              requireScrolling:
                type: boolean
                example: false
              displayFrequency:
                type: string
                example: FIRSTLOGIN
          guestChangePasswordSettings:
            type: object
            properties:
              allowChangePasswdAtFirstLogin:
                type: boolean
                example: true
          guestDeviceRegistrationSettings:
            type: object
            properties:
              autoRegisterGuestDevices:
                type: boolean
                example: true
              allowGuestsToRegisterDevices:
                type: boolean
                example: false
          byodSettings:
            type: object
            properties:
              byodWelcomeSettings:
                type: object
                properties:
                  enableBYOD:
                    type: boolean
                    example: false
                  enableGuestAccess:
                    type: boolean
                    example: false
                  requireMDM:
                    type: boolean
                    example: false
                  includeAup:
                    type: boolean
                    example: false
                  aupDisplay:
                    type: string
                    example: ONPAGE
                  requireAupAcceptance:
                    type: boolean
                    example: false
                  requireScrolling:
                    type: boolean
                    example: false
              byodRegistrationSettings:
                type: object
                properties:
                  showDeviceID:
                    type: boolean
                    example: false
                  endPointIdentityGroupId:
                    type: string
                    example: aa13bb40-8bff-11e6-996c-525400b48521
              byodRegistrationSuccessSettings:
                properties:
                  successRedirect:
                    type: string
                    example: AUTHSUCCESSPAGE
                  redirectUrl:
                    type: string
                    example: www.cisco.com
          postAccessBannerSettings:
            type: object
            properties:
              includePostAccessBanner:
                type: boolean
                example: true
          authSuccessSettings:
            type: object
            properties:
              successRedirect:
                type: string
                example: AUTHSUCCESSPAGE
              redirectUrl:
                type: string
                example: www.cisco.com
          supportInfoSettings:
            type: object
            properties: 
              includeSupportInfoPage:
                type: boolean
                example: false
              includeMacAddr:
                type: boolean
                example: true
              includeIpAddress:
                type: boolean
                example: true
              includeBrowserUserAgent:
                type: boolean
                example: true
              includePolicyServer:
                type: boolean
                example: true
              includeFailureCode:
                type: boolean
                example: true
              emptyFieldDisplay:
                type: string
                example: HIDE
      customizations:
        type: object
        properties:
          portalTheme:
            type: object
            properties:
              id:
                type: string
                example: 9eb421c0-8c01-11e6-996c-525400b48521
              name:
                type: string
                example: Default Blue theme
              themeData:
                type: string
                example: Base 64 encoded string of Theme CSS file
          portalTweakSettings:
            type: object
            properties:
              bannerColor:
                type: string
                example: Banner Color from GUI
              bannerTextColor:
                type: string
                example: Banner Text color code from GUI
              pageBackgroundColor:
                type: string
                example: Color code from GUI
              pageLabelAndTextColor:
                type: string
                example: Label and Text color from GUI
          language:
            type: object
            properties:
              viewLanguage:
                type: string
                example: English
          globalCustomizations:
            type: object
            properties:
              mobileLogoImage:
                type: object
                properties:
                  data:
                    type: string
                    example: base 64 encoded value of image
              desktopLogoImage:
                type: object
                properties:
                  data:
                    type: string
                    example: base 64 encoded value of image                
              bannerImage:
                type: object
                properties:
                  data:
                    type: string
                    example: base 64 encoded value of image
              bannerTitle:
                type: string
                example: Guest Portal
              contactText:
                type: string
                example: Contact Support
              footerElement:
                type: string
                example: Footer Element
          pageCustomizations:
            type: object
            properties:
              data:
                type: array
                example: [
                  {
                    "key" : "ui_contact_ip_address_label", 
                    "value" : "SVAgYWRkcmVzczo="
                  }
                  ]
                items:
                  properties:
                    name:
                      type: string                
      link:
        type: object
        properties:
          rel:
            type: string
            example: self
          href:
            type: string
            example: https://<ise-ip>:9060/ers/config/selfregportal/4e8ade36-4048-472a-b345-632cc155acfc
          type:
            type: string
            example: application/json  
 
  patchRequest:
    type: object
    properties:
      SelfRegPortal:
        $ref: '#/definitions/patchRequestBody'	
        
  patchRequestBody:
    type: object
    properties:
      any-resource-attribute:
        type: string
        example: some-updated-value
      another-resource-attribute:
        type: string
        example: some-updated-value  
  Update:
    type: object
    properties:
      UpdatedFieldsList:
        $ref: '#/definitions/UpdatedFieldsList'
        
  UpdatedFieldsList:
    type: object
    properties:
      updatedField:
         $ref: '#/definitions/UpdatedField'
      field:
        type: string
        example: some other field
      oldValue:
        type: string
        example: val_old
      newValue:
        type: string
        example: val_new
        
  UpdatedField:
    type: object
    properties:
      field:
        type: string
        example: field1
      oldValue:
        type: string
        example: val_old
      newValue:
        type: string
        example: val_new   

  search:
    type: object
    properties:
      SearchResult:
        $ref: '#/definitions/SearchResult'
        
  SearchResult:   
    type: object
    properties:
      total:
        type: integer
        example: 2
      resources:
        type: array
        example: [ 
            {
                "id": "cbd0e81d-8a3e-48bc-807e-a86cc359e36c",
                "name": "ISE Portal (default)",
                "description": "Ise Portal for saml based feature purpose",
                "link": {
                    "rel": "self",
                    "href": "https://<ise-ip>:9060/ers/config/selfregportal/cbd0e81d-8a3e-48bc-807e-a86cc359e36c",
                    "type": "application/json"
                }
            },
            {
                "id": "4e8ade36-4048-472a-b345-632cc155acfc",
                "name": "Self-Registered Guest Portal (default)",
                "description": "Guests may create their own accounts and be assigned a username and password, or use their social login to access the network",
                "link": {
                    "rel": "self",
                    "href": "https://<ise-ip>:9060/ers/config/selfregportal/4e8ade36-4048-472a-b345-632cc155acfc",
                    "type": "application/json"
                }
            }
        ]
        items:
          properties:
            name:
              type: string
              
  VersionInfo:
    type: object
    properties:
      VersionInfo:
        $ref: '#/definitions/version'
        
  version:
    type: object
    properties:
      currentServerVersion:
        type: string
        example: "1.0"
      supportedVersions:
        type: string
        example: "1.0"  
      link:
        $ref: '#/definitions/link1'
        
  link1:
    type: object
    properties:
      rel:
        type: string
        example: self
      href:
        type: string
        example: https://<ise-ip>:9060/ers/config/selfregportal/versioninfo
      type:
        type: string
        example: application/json
