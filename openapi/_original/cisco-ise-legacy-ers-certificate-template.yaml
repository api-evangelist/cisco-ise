        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- ca.certificatetemplate.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: 'Required Only if Enabled from GUI

          Example:- fetch'
