swagger: '2.0'
info:
  description: |
    BYOD Portal API provides the ability to Create, Read, Update, Delete and Search BYOD portals. 

    <h2>Revision History</h2>
    <table font-family:monospace>
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Revision #</b></td><td><b>Resource Version</b></td><td><b>Cisco ISE Version</b></td><td><b>Description</b></td></tr>
    <tr style='border-bottom:solid #CCCCCC 1.0pt'><td>0</td><td>1.0</td><td>2.2</td><td>Initial Cisco ISE Version</td></tr>
    </table>
    <br><br>
    
    <h2>Resource Definition</h2>
    <table>
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Default Values</b></td><td><b>Example Values</b></td></tr>
    <tr><td style='font-family:monospace'>name</td><td>String</td><td>Yes</td><td>Resource Name</td><td></td><td>BYOD Portal (default)</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>id</td><td>String</td><td>No</td><td>Resource UUID, mandatory for update</td><td></td><td>9a9b910c-54d3-44a4-a3c3-dd007c171599</td></tr>
    <tr><td style='font-family:monospace'>description</td><td>String</td><td>No</td><td>Resource Description</td><td></td><td>Default portal and user experience used when employees register a personal device on the network</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>portalTestUrl</td><td>String</td><td>No</td><td>URL to bring up a test page for this portal</td><td></td><td>https://{ise-ip}:8443/portal/PortalSetup.action?portal=9a9b910c-54d3-44a4-a3c3-dd007c171599</td></tr>
    <tr><td style='font-family:monospace'>portalType</td><td>Enum</td><td>Yes</td><td>Allowed values:<br>- BYOD, <br>- HOTSPOTGUEST, <br>- MYDEVICE, <br>- SELFREGGUEST, <br>- SPONSOR, <br>- SPONSOREDGUEST</td><td>BYOD</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>settings</td><td>List</td><td>No</td><td>Defines all of the settings groups available for a BYOD</td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>- portalSettings</td><td>List</td><td>No</td><td>The port, interface, certificate, and other basic settings of a portal</td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - httpsPort</td><td>Integer</td><td>Yes</td><td>The port number that the allowed interfaces will listen on. Range from 8000 to 8999</td><td></td><td>8443</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - allowedInterfaces</td><td>Enum</td><td>Yes</td><td>Interfaces that the portal will be reachable on. Allowed values:<br>- eth0, <br>- eth1, <br>- eth2, <br>- eth3, <br>- eth4, <br>- eth5, <br>- bond0, <br>- bond1, <br>- bond2</td><td></td><td>[ "eth0", "bond0" ]</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - certificateGroupTag</td><td>String</td><td>Yes</td><td>Logical name of the x.509 server certificate that will be used for the portal</td><td></td><td>Default Portal Certificate Group</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - endpointIdentityGroup</td><td>String</td><td>Yes</td><td>Unique Id of the endpoint identity group where user's devices will be added. Used only in Hotspot Portal</td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - displayLang</td><td>Enum</td><td>No</td><td>Allowed values:<br>- USEBROWSERLOCALE, <br>- ALWAYSUSE</td><td></td><td>USEBROWSERLOCALE</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - fallbackLanguage</td><td>String</td><td>No</td><td>Used when displayLang = USEBROWSERLOCALE</td><td></td><td>English</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - alwaysUsedLanguage</td><td>String</td><td>No</td><td>Used when displayLang = ALWAYSUSE</td><td></td><td>English</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>- byodSettings</td><td>List</td><td>No</td><td>Configuration of BYOD Device Welcome, Registration and Success steps</td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - byodWelcomeSettings</td><td>List</td><td>No</td><td>Configuration of BYOD endpoint welcome step configuration</td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - enableBYOD</td><td>Boolean</td><td>No</td><td></td><td>true</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - enableGuestAccess</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - requireMDM</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - includeAup</td><td>Boolean</td><td>No</td><td></td><td>true</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - aupDisplay</td><td>Enum</td><td>No</td><td>How the AUP should be displayed, either on page or as a link. Only valid if includeAup = true. Allowed values:<br>- ONPAGE, <br>- ASLINK</td><td>ONPAGE</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - requireAupAcceptance</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - requireScrolling</td><td>Boolean</td><td>No</td><td>Require BYOD devices to scroll down to the bottom of the AUP, Only valid if includeAup = true</td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - byodRegistrationSettings</td><td>List</td><td>No</td><td>Configuration of BYOD endpoint Registration step configuration</td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - showDeviceID</td><td>Boolean</td><td>No</td><td>Display Device ID field during registration</td><td>true</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - endPointIdentityGroupId</td><td>String</td><td>No</td><td>Identity group id for which endpoint belongs</td><td></td><td>aa13bb40-8bff-11e6-996c-525400b48521</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - byodRegistrationSuccessSettings</td><td>List</td><td>No</td><td>Configuration of BYOD endpoint Registration Success step configuration</td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - successRedirect</td><td>Enum</td><td>No</td><td>After an Authentication Success where should device be redirected. Allowed values:<br>- AUTHSUCCESSPAGE, <br>- ORIGINATINGURL, <br>- URL</td><td>AUTHSUCCESSPAGE</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp &nbsp - redirectUrl</td><td>String</td><td>No</td><td>Target URL for redirection, used when successRedirect = URL</td><td></td><td>Redirect URL</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>- supportInfoSettings</td><td>List</td><td>No</td><td>Configuration of BYOD endpoint welcome step configuration</td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - includeSupportInfoPage</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - includeMacAddr</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - includeIpAddress</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - includeBrowserUserAgent</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - includePolicyServer</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - includeFailureCode</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - emptyFieldDisplay</td><td>Enum</td><td>No</td><td>Specifies how empty fields are handled on the Support Information Page. Allowed values:<br>- HIDE, <br>- DISPLAYWITHNOVALUE, <br>- DISPLAYWITHDEFAULTVALUE</td><td></td><td>HIDE</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - defaultEmptyFieldValue</td><td>String</td><td>No</td><td>The default value displayed for an empty field Only valid when emptyFieldDisplay = DISPLAYWITHDEFAULTVALUE</td><td></td><td></td></tr>
    <tr valign=top><td style='font-family:monospace'>customizations</td><td>List</td><td>No</td><td>Defines all of the Portal Customizations available for a BYOD</td><td></td><td></td></tr>
    <tr valign=top><td style='font-family:monospace'>- portalTheme</td><td>List</td><td>No</td><td>Defines the configuration for portal theme</td><td></td><td></td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp - id</td><td>String</td><td>No</td><td>The unique internal identifier of the portal theme</td><td></td><td>9eb421c0-8c01-11e6-996c-525400b48521</td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp - name</td><td>String</td><td>Yes</td><td>The system- or user-assigned name of the portal theme</td><td></td><td>Default Blue theme</td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp - themeData</td><td>String</td><td>No</td><td>A CSS file, represented as a Base64-encoded byte array</td><td></td><td>Base 64 encoded string of Theme CSS file</td></tr>
    <tr valign=top><td tyle='font-family:monospace'>- portalTweakSettings</td><td>List</td><td>No</td><td>The Tweak Settings are a customization of the Portal Theme that has been selected for the portal. When the Portal Theme selection is changed, the Tweak Settings are overwritten to match the values in the theme. The Tweak Settings can subsequently be changed by the user</td><td></td><td></td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp - bannerColor</td><td>String</td><td>No</td><td>Hex value of color</td><td></td><td>#0000FF</td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp - bannerTextColor</td><td>String</td><td>No</td><td></td><td></td><td>Banner Text color code from GUI</td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp - pageBackgroundColor</td><td>String</td><td>No</td><td></td><td></td><td>Color code from GUI</td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp - pageLabelAndTextColor</td><td>String</td><td>No</td><td></td><td></td><td>Label and Text color from GUI</td></tr>
    <tr valign=top><td style='font-family:monospace'>- language</td><td>List</td><td>No</td><td>This property is supported only for Read operation and it allows to show the customizations in English. Other languages are not supported</td><td></td><td></td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp - viewLanguage</td><td>String</td><td>No</td><td></td><td></td><td>English</td></tr>
    <tr valign=top><td style='font-family:monospace'>- globalCustomizations</td><td>List</td><td>No</td><td>Represent the portal Global customizations</td><td></td><td></td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp - bannerTitle</td><td>String</td><td>No</td><td></td><td></td><td>BYOD Portal</td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp - contactText</td><td>String</td><td>No</td><td></td><td></td><td>Contact Support</td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp - footerElement</td><td>String</td><td>No</td><td></td><td></td><td>Footer Element</td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp - mobileLogoImage</td><td>Image</td><td>No</td><td></td><td></td><td></td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp &nbsp - data</td><td>String</td><td>No</td><td>Represented as base 64 encoded string of the image byte array</td><td></td><td>base 64 encoded value of image</td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp - desktopLogoImage</td><td>Image</td><td>No</td><td></td><td></td><td></td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp &nbsp - data</td><td>String</td><td>No</td><td>Represented as base 64 encoded string of the image byte array</td><td></td><td>base 64 encoded value of image</td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp - bannerImage</td><td>Image</td><td>No</td><td></td><td></td><td></td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp &nbsp - data</td><td>String</td><td>No</td><td>Represented as base 64 encoded string of the image byte array</td><td></td><td>base 64 encoded value of image</td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp - backgroundImage</td><td>Image</td><td>No</td><td></td><td></td><td></td></tr>
    <tr valign=top><td style='font-family:monospace'>&nbsp &nbsp - data</td><td>String</td><td>No</td><td>Represented as base 64 encoded string of the image byte array</td><td></td><td>base 64 encoded value of image</td></tr>
    <tr><td style='font-family:monospace'>- pageCustomizations</td><td>List</td><td>No</td><td>Represent the entire page customization as a giant dictionary</td><td></td><td></td></tr>
    <tr><td style='font-family:monospace'>&nbsp - data</td><td>List</td><td>No</td><td>The Dictionary will be exposed here as key value pair</td><td></td><td></td></tr>
    <tr><td style='font-family:monospace'>&nbsp &nbsp - key</td><td>String</td><td>Yes</td><td></td><td></td><td>ui_contact_ip_address_label</td></tr>
    <tr valign=top style='border-bottom:solid #CCCCCC 1.0pt'><td style='font-family:monospace'>&nbsp &nbsp - value</td><td>String</td><td>Yes</td><td></td><td></td><td>SVAgYWRkcmVzczo=</td></tr>
    </table>
    
  version: 1.0.0
  title: BYOD Portal

tags:
- name: byodportal    

paths:
  /ers/config/byodportal/{portal-id}:
    get:
      tags: 
      - byodportal
      summary: Get BYOD portal by ID
      description:
        <p>This API allows the client to get a BYOD portal by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: portal-id
          in: path
          type: string
          required: true
          description: |
              The portal ID is a dynamically generated value. For example : ‘b7e7d773-7bb3-442b-a50b-42837c12248a'.
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- portal.byodportal.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
              Example:- fetch
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/portal'
           
    put:
      tags:
      - byodportal
      summary: Update BYOD portal by ID
      description:  <p>This API allows the client to update a BYOD portal by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: portal-id
          in: path
          type: string
          required: true
          description: |
              The portal ID is a dynamically generated value. For example : ‘b7e7d773-7bb3-442b-a50b-42837c12248a'.
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:-   portal.byodportal.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: header
          name: Bulk Support
          type: string
          description: 
              Operation 'UpdateById' can be used within Bulk Request
          required: false
        - in: body
          name: request
          schema:
            $ref: '#/definitions/portal'
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/Update'  

    delete:
      tags:
      - byodportal
      summary: Delete BYOD portal by ID
      description:
        <p>This API deletes a BYOD portal by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: portal-id
          in: path
          type: string
          required: true
          description: |
              The portal ID is a dynamically generated value. For example : ‘b7e7d773-7bb3-442b-a50b-42837c12248a'.
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- portal.byodportal.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: header
          name: Bulk Support
          type: string
          description: 
              Operation 'DeleteById' can be used within Bulk Request
          required: false        
      responses: 
        204:
          description: No content    
          
  /ers/config/byodportal:

    post:
      tags:
      - byodportal
      summary: Create BYOD portal
      description:
        <p>This API creates a BYOD portal.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- portal.byodportal.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: header
          name: Bulk Support
          type: string
          description: 
              Operation 'Create' can be used within Bulk Request
          required: false                    
        - in: body
          name: request
          schema:
            $ref: '#/definitions/portal'
      responses:
        201:
          description: Created
          
    get:
      tags: 
      - byodportal
      summary: Get all BYOD portals
      description:
        <p>This API allows the client to get all the BYOD portals.</p>
        <p><h1>Filter:</h1> <h3>[name, description]</h3></p>
        <p>To search guest users by using <b>toDate</b> column,follow the format:</p> 
        <p>DD-MON-YY (Example:13-SEP-18)</p>
        <ul>
        <li><p>Day or Year:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13</p></li>
        <li><p>Month:GET /ers/config/guestuser/?filter=toDate.CONTAINS.SEP</p></li>
        <li><p>Date:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13-SEP-18</p></li>
        </ul>
        <p><h1>Sorting:</h1> <h3>[name, description]</h3></p>             
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- portal.byodportal.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
             Example:- fetch
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/search'  

  /ers/config/byodportal/versioninfo:
    get:
      tags:
      - byodportal
      summary: Get BYOD portal version information
      description:
        <p>This API helps to retrieve the version information related to the BYOD portal.</p>
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VersionInfo'
            
definitions:
  portal:
    type: object
    properties:
      BYODPortal:
        $ref: '#/definitions/BYODPortal'
        
  BYODPortal:
    type: object
    properties:
      id:
        type: string
        example: 9a9b910c-54d3-44a4-a3c3-dd007c171599
      name:
        type: string
        example: BYOD Portal (default)
      description:
        type: string
        example: Default portal and user experience used when employees register a personal device on the network
      portalType:
        type: string
        example: BYOD
      portalTestUrl:
        type: string
        example: https://<ise-ip>:8443/portal/PortalSetup.action?portal=9a9b910c-54d3-44a4-a3c3-dd007c171599
      settings:
        type: object
        properties:
          portalSettings:
            type: object
            properties: 
              httpsPort:
                type: integer
                example: 8443
              allowedInterfaces:
                type: string
                example: [ "eth0", "bond0" ]
              certificateGroupTag:
                type: string
                example: Default Portal Certificate Group
              displayLang:
                type: string
                example: USEBROWSERLOCALE
              fallbackLanguage:
                type: string
                example: English
              alwaysUsedLanguage:
                type: string
                example: English
          byodSettings:
            type: object
            properties:
              byodWelcomeSettings:
                type: object
                properties:
                  enableBYOD:
                    type: boolean
                    example: true
                  enableGuestAccess:
                    type: boolean
                    example: false
                  requireMDM:
                    type: boolean
                    example: false
                  includeAup:
                    type: boolean
                    example: true
                  aupDisplay:
                    type: string
                    example: ONPAGE
                  requireAupAcceptance:
                    type: boolean
                    example: false
                  requireScrolling:
                    type: boolean
                    example: false
              byodRegistrationSettings:
                type: object
                properties:
                  showDeviceID:
                    type: boolean
                    example: true
                  endPointIdentityGroupId:
                    type: string
                    example: aa13bb40-8bff-11e6-996c-525400b48521
              byodRegistrationSuccessSettings:
                properties:
                  successRedirect:
                    type: string
                    example: AUTHSUCCESSPAGE
                  redirectUrl:
                    type: string
                    example: Redirect URL
          supportInfoSettings:
            type: object
            properties: 
              includeSupportInfoPage:
                type: boolean
                example: false
              includeMacAddr:
                type: boolean
                example: true
              includeIpAddress:
                type: boolean
                example: true
              includeBrowserUserAgent:
                type: boolean
                example: true
              includePolicyServer:
                type: boolean
                example: true
              includeFailureCode:
