  version:
    type: object
    properties:
      currentServerVersion:
        type: string
        example: '1.0'
      supportedVersions:
        type: string
        example: '1.0'
      link:
        $ref: '#/definitions/link1'
  link1:
    type: object
    properties:
      rel:
        type: string
        example: self
      href:
        type: string
        example: https://<ise-ip>:9060/ers/config/guestlocation/versioninfo
      type:
        type: string
        example: application/json
