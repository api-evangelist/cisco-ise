swagger: '2.0'
info:
  description: |
    Native supplicant profile API provides the ability to update, delete and search native supplicant profiles.
    
    <h2>Revision History</h2>
    <table font-family:monospace> 
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Revision #</b></td><td><b>Resource Version</b></td><td><b>Cisco ISE Version</b></td><td><b>Description</b></td></tr>
    <tr><td>0</td><td>1.0</td><td>2.2</td><td>Initial Cisco ISE Version</td></tr>

    <tr style='border-bottom:solid #CCCCCC 1.0pt;background:#f8f8f8'><td>1</td><td>1.1</td><td>3.2</td><td>Added Patch operation</td></tr>

    </table>
    <br><br>
    
    <h2>Resource Definition</h2>
    <table>
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Example Values</b></td></tr>
    <tr><td style='font-family:monospace'>name</td><td>String</td><td>Yes</td><td>Resource Name</td><td>Cisco-ISE-NSP</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>id</td><td>String</td><td>No</td><td>Resource UUID, mandatory for update</td><td>b8ce01e6-b150-4d4e-9698-40e48d5e0197</td></tr>
    <tr><td style='font-family:monospace'>description</td><td>String</td><td>No</td><td>Resource Description</td><td>Pre-configured Native Supplicant Profile. The SSID Will Need To Be Customized For Your Environment</td></tr>
    <tr style= 'background:#f8f8f8'><td style='font-family:monospace'>wirelessProfiles</td><td>List</td><td>Yes</td><td>List of Wireless profiles</td><td></td></tr>
    <tr style= 'background:#f8f8f8'><td style='font-family:monospace'>- ssid</td><td>String</td><td>Yes</td><td>SSID for the wireless profile</td><td>ISE</td></tr>
    <tr style= 'background:#f8f8f8'><td style='font-family:monospace'>- allowedProtocol</td><td>Enum</td><td>Yes</td><td>Allowed protocol for the wireless profile. Allowed values: <br>- PEAP, <br>- TLS, <br>- EAP-FAST</td><td>TLS</td></tr>
    <tr style= 'background:#f8f8f8'><td style='font-family:monospace'>- certificateTemplateId</td><td>String</td><td>No</td><td>Certificate template ID</td><td>0ca8f1b6-500d-560b-e053-75189a0ab0d1</td></tr>
    <tr style= 'background:#f8f8f8'><td style='font-family:monospace'>- actionType</td><td>Enum</td><td>Yes</td><td>Action type for WifiProfile. Allowed values: <br>- ADD, <br>- UPDATE, <br>- DELETE <br>(required for updating existing WirelessProfile)</td><td>UPDATE</td></tr>
    <tr style= 'background:#f8f8f8; border-bottom:solid #CCCCCC 1.0pt'><td style='font-family:monospace'>- previousSsid</td><td>String</td><td>Yes</td><td>Previous ssid for WifiProfile (required for updating existing WirelessProfile)</td><td>ssid1</td></tr>
    </table>
    
  version: 1.0.0
  title: Native Supplicant Profile

tags:
- name: nspprofile

paths:

  /ers/config/nspprofile/{id}:
    get:
      tags: 
      - nspprofile
      summary: Get native supplicant profile by ID
      description:
        <p>This API allows the client to get a native supplicant profile by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- provisioning.nspprofile.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
              Example:- fetch
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/native'
            
    patch:
      tags: 
      - nspprofile
      summary: Update part of the native supplicant profile configuration by ID
      description:
        <p>This API allows the user to update part of the native supplicant profile configuration by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- provisioning.nspprofile.1.0
          required: false
        - in: body
          name: request
          schema:
            $ref: '#/definitions/patchRequest'
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/native'          

    put:
      tags:
      - nspprofile
      summary: Update native supplicant profile
      description:  <p>This API allows the client to update a native supplicant profile</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- provisioning.nspprofile.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: body
          name: request
          schema:
            $ref: '#/definitions/native'
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/Update'  

    delete:
      tags:
      - nspprofile
      summary: Delete native supplicant profile
      description:
        <p>This API deletes a native supplicant profile.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- provisioning.nspprofile.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
      responses: 
        204:
          description: No Content  
          
  /ers/config/nspprofile:
    get:
      tags: 
      - nspprofile
      summary: Get all native supplicant profiles
      description:
        <p>This API allows the client to get all the native supplicant profiles.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- provisioning.nspprofile.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
             Example:- fetch
         
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/search'  

  /ers/config/nspprofile/versioninfo:
    get:
      tags:
      - nspprofile
      summary: Get native supplicant profile version information
      description:
        <p>This API helps to retrieve the version information related to the native supplicant profile.</p>
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VersionInfo'


definitions:
  native:
    type: object
    properties:
      ERSNSPProfile:
        $ref: '#/definitions/ERSNSPProfile'
        
  ERSNSPProfile:
    type: object
    properties:
      id:
        type: string
        example: b8ce01e6-b150-4d4e-9698-40e48d5e0197
      name:
        type: string
        example: Cisco-ISE-NSP
      description:
        type: string
        example: Pre-configured Native Supplicant Profile. The SSID Will Need To Be Customized For Your Environment
      wirelessProfiles:
        type: array
        example: [
            {
                "ssid": "ISE",
                "allowedProtocol": "TLS",
                "certificateTemplateId": "0ca8f1b6-500d-560b-e053-75189a0ab0d1",
                "actionType" : "UPDATE",
                "previousSsid" : "ssid1"
            }
        ]
        items:
          properties:
            name:
              type: string
      link:
        type: object
        properties:
          rel:
            type: string
            example: self
          href:
            type: string
            example: https://<ise-ip>:9060/ers/config/nspprofile/b8ce01e6-b150-4d4e-9698-40e48d5e0197
          type:
            type: string
            example: application/json      
  
  patchRequest:
    type: object
    properties:
      ERSNSPProfile:
        $ref: '#/definitions/patchRequestBody'	
        
  patchRequestBody:
    type: object
    properties:
      any-resource-attribute:
        type: string
        example: some-updated-value
      another-resource-attribute:
        type: string
        example: some-updated-value  
  Update:
    type: object
    properties:
      UpdatedFieldsList:
        $ref: '#/definitions/UpdatedFieldsList'
        
  UpdatedFieldsList:
    type: object
    properties:
      updatedField:
         $ref: '#/definitions/UpdatedField'
      field:
        type: string
        example: some other field
      oldValue:
        type: string
        example: val_old
      newValue:
        type: string
        example: val_new
        
  UpdatedField:
    type: object
    properties:
      field:
        type: string
        example: field1
      oldValue:
        type: string
        example: val_old
      newValue:
        type: string
        example: val_new   

  search:
    type: object
    properties:
      SearchResult:
        $ref: '#/definitions/SearchResult'
        
  SearchResult:   
    type: object
    properties:
      total:
        type: integer
        example: 2
      resources:
        type: array
        example: [
            {
                "id": "67a6ca50-edc9-4236-ada4-225559ed54d6",
                "name": "Cisco-ISE-Chrome-NSP",
                "description": "Pre-configured Native Supplicant Profile For Chrome OS",
                "link": {
                    "rel": "self",
                    "href": "https://<ise-ip>:9060/ers/config/nspprofile/67a6ca50-edc9-4236-ada4-225559ed54d6",
                    "type": "application/json"
                }
            },
            {
                "id": "b8ce01e6-b150-4d4e-9698-40e48d5e0197",
                "name": "Cisco-ISE-NSP",
                "description": "Pre-configured Native Supplicant Profile. The SSID Will Need To Be Customized For Your Environment",
                "link": {
                    "rel": "self",
                    "href": "https://<ise-ip>/ers/config/nspprofile/b8ce01e6-b150-4d4e-9698-40e48d5e0197",
                    "type": "application/json"
                }
            }
            ]
        items:
          properties:
            name:
              type: string
              
  VersionInfo:
    type: object
    properties:
      VersionInfo:
        $ref: '#/definitions/version'
        
  version:
    type: object
    properties:
      currentServerVersion:
        type: string
        example: "1.0"
      supportedVersions:
        type: string
        example: "1.0"
      link:
        $ref: '#/definitions/link1'
        
  link1:
    type: object
    properties:
      rel:
        type: string
        example: self
      href:
        type: string
        example: <ise-ip>/ers/config/nspprofile/versioninfo
      type:
        type: string
        example: application/json
