tags:
- name: guestlocation
paths:
  /ers/config/guestlocation/{id}:
    get:
      tags:
      - guestlocation
      summary: Get guest location by ID
      description: <p>This API allows the client to get a guest location by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: id
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- identity.guestlocation.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: Required Only if Enabled from GUI Example:- fetch
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/guestlocation'
  /ers/config/guestlocation:
    get:
      tags:
      - guestlocation
      summary: Get all guest locations
      description: <p>This API allows the client to get all the guest locations.</p> <p><h1>Filter:</h1> <h3>[name]</h3></p>
        <p>To search guest users by using <b>toDate</b> column,follow the format:</p> <p>DD-MON-YY (Example:13-SEP-18)</p>
        <ul> <li><p>Day or Year:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13</p></li> <li><p>Month:GET /ers/config/guestuser/?filter=toDate.CONTAINS.SEP</p></li>
        <li><p>Date:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13-SEP-18</p></li> </ul> <p><h1>Sorting:</h1> <h3>[name,
        description]</h3></p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- identity.guestlocation.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: Required Only if Enabled from GUI Example:- fetch
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/search'
  /ers/config/guestlocation/versioninfo:
    get:
      tags:
      - guestlocation
      summary: Get guest location version information
      description: <p>This API helps to retrieve the version information related to the guest location.</p>
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VersionInfo'
definitions:
  guestlocation:
    type: object
    properties:
      LocationIdentification:
