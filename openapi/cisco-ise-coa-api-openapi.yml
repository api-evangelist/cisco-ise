paths:
  /CoA/Reauth/{node}/{mac}/{type}:
    get:
      operationId: getCoAReauthStatus
      summary: Get CoA reauthentication status
      parameters:
      - name: node
        in: path
        required: true
        description: The node to retrieve CoA reauthentication status for
        schema:
          type: string
      - name: mac
        in: path
        description: The MAC address to retrieve CoA reauthentication status for
        required: true
        schema:
          type: string
      - name: type
        in: path
        description: The type parameter for the CoA reauthentication status
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/CoAResult'
        '401':
          description: Unauthorized access
        '404':
          description: Resource not found
        '500':
          description: Internal Server Error
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/mnt-rest-result'
      tags:
      - CoA
  /CoA/Disconnect/{node}/{mac}/{option}:
    get:
      operationId: getCoADisconnectStatus
      summary: Get CoA disconnect status
      parameters:
      - name: node
        in: path
        required: true
        description: The node to retrieve CoA disconnect status for
        schema:
          type: string
      - name: mac
        in: path
        required: true
        description: The MAC address to retrieve CoA disconnect status for
        schema:
          type: string
      - name: option
        in: path
        description: The option parameter for the CoA disconnect status
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/CoAResult'
        '401':
          description: Unauthorized access
        '404':
          description: Resource not found
        '500':
          description: Internal Server Error
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/mnt-rest-result'
      tags:
      - CoA
