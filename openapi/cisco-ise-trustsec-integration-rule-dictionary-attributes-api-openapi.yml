          example: '[{"allowedValues":[{"key":"key1","value":"value1","isDefault":true}],"dataType":"IPV6","description":"a dictionary attribute description","dictionaryName":"my dictionary","directionType":"BOTH","id":"12345678-f0e7-456b-a2d1-876543320b11","internalName":"my dictionary attribute internal name","name":"my dictionary attribute"}]'
