          - COA_ERROR
          - COA_NACK
          - COA_SENT
          - COA_TIMED_OUT
          - ENV_REQUEST
          - ENV_REQUEST_FAILED
          - ENV_REQUEST_SUCCESS
          - REPORT_VALIDATION_ERROR
          - REPORT_VALIDATION_SUCCESS
          - REPORT_VALIDATION_WARNING
          - TIMED_OUT
          - UPDATE
          - UPDATE_ERROR
          - UPDATE_SUCCESS
          - UPDATE_TIMED_OUT
        statusUpdatedTime:
