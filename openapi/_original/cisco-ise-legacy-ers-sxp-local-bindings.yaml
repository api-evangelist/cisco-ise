info:
  description: "SXP Local Bindings API allows clients to add, get, update and delete SGT static mappings.\n\n<h2>Revision\
    \ History</h2>\n<table font-family:monospace> \n<tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid\
    \ #CCCCCC .75pt;background:#DEEDF7'><td><b>Revision #</b></td><td><b>Resource Version</b></td><td><b>Cisco ISE Version</b></td><td><b>Description</b></td><td\
    \ colspan =\"2\"><b>Revision Modification</b></td></tr>\n<tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid\
    \ #CCCCCC .75pt;background:#DEEDF7'><td></td><td></td><td></td><td></b></td><td><b>Attribute</b></td><td><b>Description</b></td></tr>\n\
    <tr><td>0</td><td>1.0</td><td>2.0</td><td>Initial Cisco ISE Version</td><td></td><td></td></tr>\n<tr valign=top style='border-bottom:solid\
    \ #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#f8f8f8'><td>1</td><td>1.1</td><td >3.0</td><td>Cisco ISE\
    \ 3.0 model changes</td><td>vns</td><td>Added new property for the Virtual Networks</td></tr>\n</table>\n<br><br>\n\n\
    <h2>Resource Definition</h2>\n<table>\n<tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Example\
    \ Values</b></td></tr>\n<tr><td style='font-family:monospace'>name</td><td>String</td><td>Yes</td><td>Resource Name</td><td></td></tr>\n\
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>id</td><td>String</td><td>No</td><td>Resource\
    \ UUID value</td><td>f9269682-dcaf-11e3-ad0a-5bdcd2d9fd69</td></tr>\n<tr><td style='font-family:monospace'>description</td><td>String</td><td>No</td><td>Resource\
    \ Description</td><td></td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>bindingName</td><td>String</td><td>No</td><td>This\
    \ field is depricated from Cisco ISE 3.0</td><td></td></tr>\n<tr><td style='font-family:monospace'>ipAddressOrHost</td><td>String</td><td>Yes</td><td>IP\
    \ address for static mapping (hostname is not supported)</td><td>ipAddressOrHost</td></tr>\n<tr valign=top style='background:#f8f8f8'><td\
    \ style='font-family:monospace'>sgt</td><td>String</td><td>Yes</td><td>SGT name or ID</td><td>sgt_id</td></tr>\n<tr><td\
    \ style='font-family:monospace'>sxpVpn</td><td>String</td><td>Yes</td><td>List of SXP Domains, separated with comma. At\
    \ least one of: sxpVpn or vns should be defined</td><td>Sxp Vpn Name</td></tr>\n<tr valign=top style='border-bottom:solid\
    \ #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#f8f8f8'><td style='font-family:monospace'>vns</td><td>String</td><td>Yes</td><td>List\
    \ of Virtual Networks, separated with comma. At least one of: sxpVpn or vns should be defined</td><td>virtualNetwork</td></tr>\n\
    </table>\n"
