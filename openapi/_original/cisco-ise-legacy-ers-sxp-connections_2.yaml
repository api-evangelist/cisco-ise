      tags:
      - sxpconnections
      summary: Get SXP connection by ID
      description: <p>This API allows the client to get a SXP connection by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: id
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- sxp.sxpconnections.1.1
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: Required Only if Enabled from GUI Example:- fetch
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/sxpconnections'
