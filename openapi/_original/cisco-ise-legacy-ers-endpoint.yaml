    <tr valign=top style='border-bottom:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#f8f8f8'><td style='font-family:monospace'>staticProfileAssignmentDefined</td><td>Boolean</td><td>No</td><td></td><td>true</td></tr>
    <tr valign=top style='border-bottom:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#f8f8f8'><td style='font-family:monospace'>mdmAttributes</td><td>EPMDMAttributes</td><td>No</td><td>MDM Attributes</td><td></td></tr>
    </table>
    
    
  version: 1.0.0
  title: Endpoint

tags:
- name: endpoint

paths:
  /ers/config/endpoint/{id}/releaserejectedendpoint:
    put:
      tags: 
      - endpoint
      summary: Release rejected endpoint
      description:
        <p>This API allows the client to release a rejected endpoint.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true         
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpoint.1.2
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
              Example:- fetch
      responses: 
        204:
          description: No Content

  /ers/config/endpoint/{id}/deregister:
    put:
      tags: 
      - endpoint
      summary: De-register endpoint
      description:
        <p>This API allows the client to de-register an endpoint.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true      
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpoint.1.2
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
              Example:- fetch
        - in: header
          name: Bulk Support
          type: string
          description: 
             Operation 'DeRegister' can be used within Bulk Request
      responses: 
        204:
          description: No Content

  /ers/config/endpoint/getrejectedendpoints:
    get:
      tags: 
      - endpoint
      summary: Get rejected enpoints 
      description:
        <p>This API allows the client to get the rejected endpoints.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpoint.1.2
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
              Example:- fetch
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/OperationResult'

  /ers/config/endpoint/name/{name}:
    get:
      tags: 
      - endpoint
      summary: Get endpoint by name
      description:
        <p>This API allows the client to get an endpoint by name.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: name
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpoint.1.2
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
              Example:- fetch
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/endpoint_name'
            
  /ers/config/endpoint/{id}:
    get:
      tags: 
      - endpoint
      summary: Get endpoint by ID
      description:
        <p>This API allows the client to get an endpoint by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpoint.1.2
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
              Example:- fetch
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/endpoint'
    patch:
      tags: 
      - endpoint
      summary: Update part of the endpoint configuration by ID
      description:
        <p>This API allows the client to update part of the endpoint configuration by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpoint.1.2
          required: false
        - in: body
          name: request
          schema:
            $ref: '#/definitions/patchRequest'
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/endpoint'  
            
    put:
      tags:
      - endpoint
      summary: Update endpoint
      description:  <p>This API allows the client to update an endpoint.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpoint.1.2
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
          required: false
        - in: header
          name: Bulk Support
          type: string
          description: 
               Operation 'Update' can be used within Bulk Request               
        - in: body
          name: request
          schema:
            $ref: '#/definitions/endpoint'
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/Update'  
            
    delete:
      tags:
      - endpoint
      summary: Delete endpoint
      description:
        <p>This API deletes an endpoint.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpoint.1.2
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: header
          name: Bulk Support
          type: string
          description: 
               Operation 'Delete' can be used within Bulk Request 
      responses: 
        204:
          description: No Content  

  /ers/config/endpoint/register:
    put:
      tags: 
      - endpoint
      summary: Register endpoint
      description:
        <p>This API allows the client to register an endpoint.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpoint.1.2
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
              Example:- fetch
        - in: header
          name: Bulk Support
          type: string
          description: 
             Operation 'Register' can be used within Bulk Request
        - in: body
          name: request
          schema:
            $ref: '#/definitions/endpoint'
      responses: 
        204:
          description: No Content

          
  /ers/config/endpoint:
    get:
      tags: 
      - endpoint
      summary: Get all endpoints
      description:
        <p>This API allows the client to get all the endpoints.</p>
        <p><h1>Filter:</h1>Filters can be used to filter out Endpoints based on a set of attributes. This API currently provides the following filters:</p>
        <p><h3>[logicalProfileName, portalUser, staticProfileAssignment, profileId, profile, groupId, staticGroupAssignment, mac]</h3></p>
        <br><p>Example 1:</p> 
        <p>The <b>logicalProfileName</b> filter can be used to get Enpoints that belong  to a specific Logical Profile. The supported operator for logicalProfileNamefilter is EQ (equal to). The syntax to invoke the API with this filter:</p>
        <p>/ers/config/endpoint?filter={filter name}.{operator}.{logical profile name}</p>
        <p>Example:</p>
        <p>https://{ise-ip}:9060/ers/config/endpoint?filter=logicalProfileName.EQ.LP_Apple</p>
        <br><p>Example 2:</p> 
        <p>To search guest users by using <b>toDate</b> column,follow the format:</p> 
        <p>DD-MON-YY (Example:13-SEP-18)</p>
        <ul>
        <li><p>Day or Year:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13</p></li>
        <li><p>Month:GET /ers/config/guestuser/?filter=toDate.CONTAINS.SEP</p></li>
        <li><p>Date:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13-SEP-18</p></li>
        </ul>
        <p><h1>Sorting:</h1><h3>[name, description]</h3></p>      
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpoint.1.2
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
             Example:- fetch
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/search'  

    post:
      tags:
      - endpoint
      summary: Create endpoint
      description:
        <p>This API creates an endpoint.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpoint.1.2
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: header
          name: Bulk Support
          type: string
          description: 
               Operation 'Create' can be used within Bulk Request 
        - in: body
          name: request
          schema:
            $ref: '#/definitions/endpoint'
      responses:
        201:
          description: Created
             
  /ers/config/endpoint/versioninfo:
    get:
      tags:
      - endpoint
      summary: Get endpoint version information
      description:
        <p>This API helps to retrieve the version information related to the endpoint.</p>
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VersionInfo'
            
  /ers/config/endpoint/bulk/submit:
    put:
      tags:
      - endpoint
      summary: Submit bulk request 
      description:
        <p>This API allows the client to submit the bulk request.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: body
          name: request
          schema:
            $ref: '#/definitions/bulkrequest'  
      responses:
        202:
          description: Accepted

  /ers/config/endpoint/bulk/{bulkid}:
    get:
      tags:
      - endpoint
      summary: Monitor bulk request 
      description:
        <p>This API allows the client to monitor the bulk request.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: bulkid
          in: path
          type: string 
          required: true
          description: |
                The bulk ID is a dynamically generated value.<br>Example:- ‘1615360357673’
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/bulkstatus'
            
definitions:
  OperationResult:
    type: object
    properties:
      OperationResult:
        type: object
        properties:
          resultValue:
            type: array
            example: [{"value": "DdsAASDs%$##@ssds12", "name": "password"}]
            items:
              properties:
                name:
                  type: string  

  endpoint_name:
    type: object
    properties:
      ERSEndPoint:
        $ref: '#/definitions/ERSEndPoint_name'

  ERSEndPoint_name:
    properties:
      id:
        type: string
        example: 172f8270-8f4f-11eb-b4a8-9eb04987ed29
      name:
        type: string
        example: 11:22:33:44:55:66
      description:
        type: string
        example: MyEndpoint
      mac:
        type: string
        example: 11:22:33:44:55:66
      profileId:
        type: string
        example: profileId
      staticProfileAssignment:
        type: boolean
        example: false
      groupId:
        type: string
        example: aa13bb40-8bff-11e6-996c-525400b48521
      staticGroupAssignment:
        type: boolean
        example: true
      portalUser:
        type: string
        example: portalUser
      identityStore:
        type: string
        example: identityStore
      identityStoreId:
        type: string
        example: identityStoreId
      customAttributes:
        type: object
        properties:
          customAttributes:
            type: object
            properties:
              key1:
                type: string
                example: value1
              key2:
                type: string
                example: value2
      mfcAttributes:
        type: object
        properties:
          mfcDeviceType:
            type: boolean
            example: Workstation
          mfcHardwareManufacturer:
            type: boolean
            example: VMWare, Inc.
          mfcHardwareModel:
            type: boolean
            example: VMWare-Device
          mfcOperatingSystem:
            type: boolean

      link:
        type: object
        properties:
          rel:
            type: string
            example: self
          href:
            type: string
            example: https://<ise-ip>:9060/ers/config/ers/config/endpoint/name/11:22:33:44:55:66
          type:
            type: string
            example: application/json                    
                
  endpoint:
    type: object
    properties:
      ERSEndPoint:
        $ref: '#/definitions/ERSEndPoint'

  ERSEndPoint:
    properties:
      id:
        type: string
        example: 172f8270-8f4f-11eb-b4a8-9eb04987ed29
      name:
        type: string
        example: 11:22:33:44:55:66
      description:
        type: string
        example: MyEndpoint
      mac:
        type: string
        example: 11:22:33:44:55:66
      profileId:
        type: string
        example: profileId
      staticProfileAssignment:
        type: boolean
        example: false
      groupId:
        type: string
        example: aa13bb40-8bff-11e6-996c-525400b48521
      staticGroupAssignment:
        type: boolean
        example: true
      portalUser:
        type: string
        example: portalUser
      identityStore:
        type: string
        example: identityStore
      identityStoreId:
        type: string
        example: identityStoreId
      customAttributes:
        type: object
        properties:
          customAttributes:
            type: object
            properties:
              key1:
                type: string
                example: value1
              key2:
                type: string
                example: value2
      mfcAttributes:
        type: object
        properties:
          mfcDeviceType:
            type: boolean
            example: Workstation
          mfcHardwareManufacturer:
            type: boolean
            example: VMWare, Inc.
          mfcHardwareModel:
            type: boolean
            example: VMWare-Device
          mfcOperatingSystem:
            type: boolean 
      link:
        type: object
        properties:
          rel:
            type: string
            example: self
          href:
            type: string
            example: https://<ise-ip>:9060/ers/config/ers/config/endpoint/172f8270-8f4f-11eb-b4a8-9eb04987ed29
          type:
            type: string
            example: application/json 
            
  patchRequest:
    type: object
    properties:
      ERSEndPoint:
        $ref: '#/definitions/patchRequestBody'	
        
  patchRequestBody:
    type: object
    properties:
      any-resource-attribute:
        type: string
        example: some-updated-value
      another-resource-attribute:
        type: string
        example: some-updated-value            
  Update:
    type: object
    properties:
      UpdatedFieldsList:
        $ref: '#/definitions/UpdatedFieldsList'
        
  UpdatedFieldsList:
    type: object
    properties:
      updatedField:
         $ref: '#/definitions/UpdatedField'
      field:
        type: string
        example: some other field
      oldValue:
        type: string
        example: val_old
      newValue:
        type: string
        example: val_new
        
  UpdatedField:
    type: object
    properties:
      field:
        type: string
        example: field1
      oldValue:
        type: string
        example: val_old
      newValue:
        type: string
        example: val_new   

  search:
    type: object
    properties:
      SearchResult:
        $ref: '#/definitions/SearchResult'
        
  SearchResult:   
    type: object
    properties:
      total:
        type: integer
        example: 1
      resources:
        type: array
        example: [
            {
                "id": "172f8270-8f4f-11eb-b4a8-9eb04987ed29",
                "name": "11:22:33:44:55:66",
                "link": {
                    "rel": "self",
                    "href": "https://<ise-ip>:9060/ers/config/endpoint/172f8270-8f4f-11eb-b4a8-9eb04987ed29",
                    "type": "application/json"
                }
            }
        ]
        items:
          properties:
            name:
              type: string
              
  VersionInfo:
    type: object
    properties:
      VersionInfo:
        $ref: '#/definitions/version'
        
  version:
    type: object
    properties:
      currentServerVersion:
        type: string
        example: "1.2"
      supportedVersions:
        type: string
        example: "1.0,1.1,1.2"  
      link:
        $ref: '#/definitions/link1'
        
  link1:
    type: object
    properties:
      rel:
        type: string
        example: self
      href:
        type: string
        example: https://<ise-ip>:9060/ers/config/endpoint/versioninfo
      type:
        type: string
        example: application/json
        


  bulkrequest:
    type: object
    properties:
      EndpointBulkRequest:
        $ref: '#/definitions/EndpointBulkRequest'
        
  EndpointBulkRequest:
    type: object
    properties:
      operationType:
        type: string
        example: create
      resourceMediaType:
        type: string
        example: vnd.com.cisco.ise.identity.endpoint.1.0+xml

  bulkstatus:
    type: object
    properties:
      BulkStatus:
        $ref: '#/definitions/BulkStatus'
        
  BulkStatus:
    type: object
    properties:
      bulkId:
        type: string
        example: 1615360357673
      mediaType:
        type: string
        example: ""
      executionStatus:
        type: string
        example: COMPLETED
      operationType:
        type: string
        example: create
