      - name: Example
        in: header
        description: <b>Version 1:</b><br> <ul><li>https://mdm-server/ise/mdm/api/devices/0/macaddress/000000000000/all</li>
          <li>https://mdm-server/ise/mdm/api/devices/0/username/abcd1234/register_status+compliance_status </li> <li>https://mdm-server/ise/mdm/api/devices/0/compliance/false/all</li>
          <li>https://mdm-server/ise/mdm/api/devicess/0/all</li></ul> <br><b>Version 2:</b><br><br> <ul><li>https://mdm-server/ise/mdm/api/devices/?paging=0&querycriteria=macaddress&value=000000000000&filter=all</li>
          <li>https://mdm-server/ise/mdm/api/devices/?paging=0&querycriteria=<macaddress/udid/meid/imei>&value=000000000000&filter=all</li>
          <li>https://mdm-server/ise/mdm/api/devices/?paging=0&querycriteria=username&value=abcd1234&filter=register_status+compliance_status</li>
          <li>https://mdm-server/ise/mdm/api/devices/?paging=0&querycriteria=compliance&value=false&filter=all</li> <li>https://mdm-server/ise/mdm/api/devices/?paging=0&filter=all</li></ul>
        schema:
          type: string
      responses:
