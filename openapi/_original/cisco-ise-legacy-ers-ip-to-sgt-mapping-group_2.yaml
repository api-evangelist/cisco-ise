    <tr style= 'border-bottom:solid #CCCCCC 1.0pt'><td>0</td><td>1.0</td><td>2.0</td><td>Initial Cisco ISE Version</td></tr>\n\
    <tr style= 'border-bottom:solid #CCCCCC 1.0pt'><td>1</td><td>1.1</td><td>3.5</td><td>Added sgtDomain attribute</td></tr>\n\
    </table>\n<br><br>\n\n<h2>Resource Definition</h2>\n<table>\n<tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid\
    \ #CCCCCC .75pt;background:#DEEDF7'><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Default\
    \ Values</b></td><td><b>Example Values</b></td></tr>\n<tr><td style='font-family:monospace'>name</td><td>String</td><td>Yes</td><td>Resource\
    \ Name</td><td></td><td>groupA</td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>id</td><td>String</td><td>No</td><td>Resource\
    \ UUID, mandatory for update</td><td><td></td></tr>\n<tr><td style='font-family:monospace'>description</td><td>String</td><td>No</td><td>Resource\
    \ Description</td><td></td><td></td></tr>\n<tr style= 'background:#f8f8f8'><td style='font-family:monospace'>deployTo</td><td>String</td><td>Mandatory\
    \ unless mappingGroup is set or unless deployType=ALL</td><td></td><td></td><td>network_device_id</td></tr>\n<tr><td style='font-family:monospace'>deployType</td><td>Enum</td><td>Yes</td><td>Allowed\
    \ values:<br>- ALL,<br>- ND,<br>- NDG</td><td>ALL</td><td></td></tr>\n<tr style= 'background:#f8f8f8; border-bottom:solid\
