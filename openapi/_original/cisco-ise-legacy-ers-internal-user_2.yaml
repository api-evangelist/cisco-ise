info:
  description: "Internal User API allows the client to add, delete, update and search internal users.\n\n<h2>Revision History</h2>\n\
    <table font-family:monospace> \n<tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Revision\
    \ #</b></td><td><b>Resource Version</b></td><td><b>Cisco ISE Version</b></td><td><b>Description</b></td><td colspan =\"\
    2\"><b>Revision Modification</b></td></tr>\n<tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC\
    \ .75pt;background:#DEEDF7'><td></td><td></td><td></td><td></b></td><td><b>Attribute</b></td><td><b>Description</b></td></tr>\n\
    <tr><td>0</td><td>1.0</td><td>1.2</td><td>Initial Cisco ISE Version</td><td></td><td></td></tr>\n<tr valign=top style='border-top:solid\
    \ #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#f8f8f8'><td>1</td><td>1.1</td><td>2.0</td><td>Cisco ISE\
    \ 2.0 model changes</td><td>enablePassword</td><td>Added Attribute 'enablePassword' for TACACS</td>   \n<tr><td rowspan\
    \ =\"3\">2</td><td rowspan =\"3\">1.2</td><td rowspan =\"3\">2.1</td><td rowspan =\"3\">Cisco ISE 2.1 model changes</td><td>passwordIDStore</td><td>Added\
    \ Attribute 'passwordIDStore' for choosing where passwords are stored. default value:'Internal Users'</td><tr><td>expiryDateEnabled</td><td>Added\
    \ Attribute 'expiryDateEnabled' for choosing whether ExpiryDate enabled or not . default value:'false'</td></tr><tr style\
    \ = 'border-bottom:solid #CCCCCC 1.0pt'><td>expiryDate</td><td>Added Attribute 'expiryDate' to know the Expiry Date. Format\
    \ is = YYYY-MM-DD</td></tr></tr>\n<tr style='border-bottom:solid #CCCCCC 1.0pt'><td>3</td><td>1.3</td><td>3.2</td><td>Added\
    \ Patch and PatchByName operations</td><td></td><td></td></tr>\n<tr><td rowspan =\"3\">4</td><td rowspan =\"3\">1.4</td><td\
    \ rowspan =\"3\">3.2</td><td rowspan =\"3\">Added new attributes: passwordNeverExpires, accountNameAlias and daysForPasswordExpiration</td><td>passwordNeverExpires</td><td>Added\
    \ attribute 'passwordNeverExpires' and an option to enable or disable this feature</td><tr><td>accountNameAlias</td><td>Added\
    \ attribute 'accountNameAlias' to edit the name in email notifications sent for password expiration</td></tr><tr style\
    \ = 'border-bottom:solid #CCCCCC 1.0pt'><td>daysForPasswordExpiration</td><td>Added this attribute to retrieve the days\
    \ left for password expiry. It is a read-only attribute.</td></tr></tr>\n<tr><td rowspan =\"3\">5</td><td rowspan =\"\
    3\">1.5</td><td rowspan =\"3\">3.2 patch 1</td><td rowspan =\"3\">Added new attributes: dateModified, dateCreated</td><td>dateModified</td><td>The\
    \ date of the last user modification by admin, formatted as 'YYYY-MM-DD'. Read-only.</td><tr><td>dateCreated</td><td>The\
    \ date of the user creation, formatted as 'YYYY-MM-DD'. Read-only.</td></tr><tr style = 'border-bottom:solid #CCCCCC 1.0pt'></td></tr></tr>\n\
    <tr><td rowspan =\"3\">6</td><td rowspan =\"3\">1.6</td><td rowspan =\"3\">3.6</td><td rowspan =\"3\">Added new attributes:\
    \ enablePasswordlessAuth, ssh_keys</td><td>enablePasswordlessAuth</td><td>Added Attribute 'enablePasswordlessAuth' for\
    \ enable/disable the option. Default value: 'false'</td><tr><td>ssh_keys</td><td>Added Attribute 'ssh_keys' for adding\
    \ user ssh keys in the format of list of strings. Example: ['ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC6... user@example.com']</td></tr><tr\
    \ style = 'border-bottom:solid #CCCCCC 1.0pt'></td></tr></tr>\n</table>\n<br><br>\n\n<h2>Resource Definition</h2>\n<table>\n\
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Default\
    \ Values</b></td><td><b>Example Values</b></td></tr>\n<tr><td style='font-family:monospace'>name</td><td>String</td><td>Yes</td><td>Resource\
    \ Name</td><td></td><td>name</td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>id</td><td>String</td><td>No</td><td>Resource\
    \ UUID, mandatory for update</td><td><td>b24b09e2-16f8-4e48-ace1-2c262a9449f1</td></tr>\n<tr><td style='font-family:monospace'>description</td><td>String</td><td>No</td><td>Resource\
    \ Description</td><td></td><td>description</td></tr>\n<tr style= 'background:#f8f8f8'><td style='font-family:monospace'>changePassword</td><td>Boolean</td><td>Yes</td><td></td><td>true</td><td></td></tr>\n\
    <tr><td style='font-family:monospace'>email</td><td>String</td><td>No</td><td></td><td></td><td>email@domain.com</td></tr>\n\
    <tr style= 'background:#f8f8f8'><td style='font-family:monospace'>accountNameAlias</td><td>String</td><td>No</td><td>The\
    \ Account Name Alias is used to send email notifications about password expiration.</td><td></td><td>name</td></tr>\n\
    <tr><td style='font-family:monospace'>passwordNeverExpires</td><td>Boolean</td><td>No</td><td>Set this attribute to 'true'\
    \ to indicate the user password never expires. This does not apply to users who are also ISE admins</td><td>false</td><td>true</td></tr>\n\
    <tr style= 'background:#f8f8f8'><td style='font-family:monospace'>enablePassword</td><td>String</td><td>No</td><td>EnablePassword\
    \ field is added in ISE 2.0 to support T+</td><td></td><td>enablePassword</td></tr>\n<tr><td style='font-family:monospace'>enabled</td><td>Boolean</td><td>Yes</td><td>Whether\
    \ the user is enabled/disabled. To use it as filter, the values should be 'Enabled' or 'Disabled'. The values are case\
    \ sensitive. For example, '[ERSObjectURL]?filter=enabled.EQ.Enabled'</td><td></td><td>true</td></tr>\n<tr valign=top style='background:#f8f8f8'><td\
    \ style='font-family:monospace'>customAttributes</td><td>String</td><td>No</td><td>Key value map</td><td><td>{\"key1\"\
    \ : \"value1\"}</td></tr>\n<tr><td style='font-family:monospace'>firstName</td><td>String</td><td>No</td><td></td><td></td><td>firstName</td></tr>\n\
    <tr style= 'background:#f8f8f8'><td style='font-family:monospace'>identifcusttyGroups</td><td>String</td><td>No</td><td>CSV\
    \ of identity group IDs</td><td></td><td>identityGroups</td></tr>\n<tr><td style='font-family:monospace'>lastName</td><td>String</td><td>No</td><td></td><td></td><td>lastName</td></tr>\n\
    <tr style= 'background:#f8f8f8'><td style='font-family:monospace'>password</td><td>String</td><td>No</td><td></td><td></td><td>password</td></tr>\n\
    <tr><td style='font-family:monospace'>passwordIDStore</td><td>String</td><td>Yes</td><td>The id store where the internal\
    \ user's password is kept</td><td>Internal Users</td><td></td></tr>\n<tr><td style='font-family:monospace'>ssh_keys</td><td>String</td><td>Yes</td><td>Attribute\
    \ 'ssh_keys' for adding user ssh keys in the format of list of strings.</td><td>['ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABAQC6...\
    \ user@example.com']</td><td></td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>expiryDateEnabled</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>\n\
    <tr style =' border-bottom:solid #CCCCCC 1.0pt'><td style='font-family:monospace'>expiryDate</td><td>String</td><td>No</td><td>To\
    \ store the internal user's expiry date information. It's format is = 'YYYY-MM-DD'</td><td></td><td>2021-05-19</td></tr>\n\
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>daysForPasswordExpiration</td><td>Integer</td><td>No</td><td>This\
    \ attribute is read-only</td><td>60</td><td>300</td></tr>\n<tr><td style='font-family:monospace'>dateModified</td><td>String</td><td>No</td><td>The\
    \ date of the last user modification by admin, formatted as 'YYYY-MM-DD'. Read-only.</td><td></td><td></td></tr>\n<tr><td\
    \ style='font-family:monospace'>dateCreated</td><td>String</td><td>No</td><td>The date of the user creation, formatted\
    \ as 'YYYY-MM-DD'. Read-only.</td><td></td><td></td></tr>\n<tr><td style='font-family:monospace'>enablePasswordlessAuth</td><td>String</td><td>No</td><td>Attribute\
    \ 'enablePasswordlessAuth' for enable/disable the option.</td><td>false</td><td></td></tr>\n\n</table>\n"
