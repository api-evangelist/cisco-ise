paths:
  /ers/config/sgacl/{id}:
    get:
      tags:
      - sgacl
      summary: Get security group ACL by ID
      description: <p>This API allows the client to get a security group ACL by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: id
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- trustsec.sgacl.1.1
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: Required Only if Enabled from GUI Example:- fetch
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/sgacl'
    put:
      tags:
      - sgacl
      summary: Update security group ACL
      description: <p>This API allows the client to update a security group ACL.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: id
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- trustsec.sgacl.1.1
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
