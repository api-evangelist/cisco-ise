tags:
- name: endpointcertificate
paths:
  /ers/config/endpointcert/certRequest:
    put:
      tags:
      - endpointcertificate
      summary: Create endpoint certificate
      description: This API allows the client to create an endpoint certificate.
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        description: Example:- ca.endpointcert.1.0
        required: false
        schema:
          type: string
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        description: Required Only if Enabled from GUI Example:- fetch
        schema:
          type: string
      - in: header
        name: Additional Information
        description: <table> <tr><td>CertTemplateName</td><td>(Required)</td><td>Must be the name of an Internal CA template</td></tr> <tr><td>CertificateRequest</td><td>(Required)</td><td>Must have CN and SAN entries</td></tr> <tr><td>CN</td><td>(Required)</td><td>Must match the requester's User Name, unless the Requester is an ERS Admin. ERS Admins are allowed to create requests for any CN</td></tr> <tr><td>SAN</td><td>(Required)</td><td>Must be a valid MAC Address, delimited by '-'</td></tr> <tr><td>Format</td><td>(Required)</td><td>Must be one of either PKCS12, PKCS12_CHAIN, PKCS8, or PKCS8_CHAIN</td></tr> <tr><td>Password</td><td>(Required)</td><td>Protects the private key. Must have more than 8 characters, less than 15 characters, at least one upper case letter, at least one lower case letter, at least one digit, and can only contain [A-Z][a-z][0-9]_#</td></tr> </table>
        schema:
          type: string
      responses:
        200:
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/endpointcert'
          application/xml:
            schema:
              $ref: '#/components/schemas/endpointcert'
      operationId: putErsConfigEndpointcertCertRequest
      x-operation-id-source: derived
  /ers/config/endpointcert/versioninfo:
    get:
      tags:
      - endpointcertificate
      summary: Get endpoint certificate version information
      description: This API helps to retrieve the version information related to the endpoint certificate.
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
      operationId: getErsConfigEndpointcertVersioninfo
      x-operation-id-source: derived
components:
  schemas:
    VersionInfo:
      type: object
      properties:
        VersionInfo:
          $ref: '#/components/schemas/version'
    endpointcert:
      type: object
      properties:
        ERSEndPoint:
          $ref: '#/components/schemas/ERSEndPointCert'
    version:
      type: object
      properties:
        currentServerVersion:
          type: string
          example: '1.0'
        supportedVersions:
          type: string
          example: '1.0'
        link:
          $ref: '#/components/schemas/link1'
    ERSEndPointCert:
      properties:
        certTemplateName:
          type: string
          example: Certificate_Template_Name
        format:
          type: string
          example: PKCS8
        password:
          type: string
          example: Password_123
        certificateRequest:
          type: object
          properties:
            customAttributes:
              type: object
              properties:
                san:
                  type: string
                  example: 11-22-33-44-55-66
                cn:
                  type: string
                  example: userName [or] machineName
    link1:
      type: object
      properties:
        rel:
          type: string
          example: self
        href:
          type: string
          example: https://<ise-ip>:9060/ers/config/endpointcert/versioninfo
        type:
          type: string
          example: application/json
