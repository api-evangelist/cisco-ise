paths:
  /ers/config/pxgridsettings/autoapprove:
    put:
      tags:
      - pxgridsettings
      summary: Auto approve pxGrid settings
      description: <p>This API allows the client to auto approve the pxGrid settings.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- pxgrid.pxgridsettings.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: Required Only if Enabled from GUI Example:- fetch
      - in: body
        name: request
        schema:
          $ref: '#/definitions/settings'
      responses:
        204:
          description: No Content
  /ers/config/pxgridsettings/versioninfo:
    get:
      tags:
      - pxgridsettings
      summary: Get pxGrid settings version information
      description: <p>This API helps to retrieve the version information related to the pxGrid settings.</p>
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VersionInfo'
