info:
  description: "IP To SGT Mapping Group API allows the client to add, delete, update, search and deploy IP to SGT mapping\
    \ groups.\n\n<h2>Revision History</h2>\n<table font-family:monospace> \n<tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid\
