        description: 'Required Only if Enabled from GUI

          Example:- fetch'
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/settings'
  /ers/config/acisettings/testACIConnectivity:
    put:
      tags:
      - acisettings
      summary: Test ACI Domain Manager connection
      description: <p>This API allows the client to test ACI Domain Manager connection.</p>
      consumes:
