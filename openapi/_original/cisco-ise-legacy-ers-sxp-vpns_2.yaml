- name: sxpvpns
paths:
  /ers/config/sxpvpns/{id}:
    get:
      tags:
      - sxpvpns
      summary: Get SXP VPN by ID
      description: <p>This API allows the client to get a SXP VPN by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: id
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- sxp.sxpvpns.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: Required Only if Enabled from GUI Example:- fetch
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/sxpvpns'
    delete:
      tags:
      - sxpvpns
      summary: Delete SXP VPN
      description: <p>This API deletes a SXP VPN.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: id
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- sxp.sxpvpns.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: The Token value from the GET X-CSRF-TOKEN fetch request
      responses:
        204:
          description: No Content
  /ers/config/sxpvpns:
    get:
      tags:
      - sxpvpns
      summary: Get all SXP VPNs
      description: <p>This API allows the client to get all the SXP VPNs.</p> <p><h1>Filter:</h1> <h3>[name, description]</h3></p>
        <p>To search guest users by using <b>toDate</b> column,follow the format:</p> <p>DD-MON-YY (Example:13-SEP-18)</p>
        <ul> <li><p>Day or Year:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13</p></li> <li><p>Month:GET /ers/config/guestuser/?filter=toDate.CONTAINS.SEP</p></li>
        <li><p>Date:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13-SEP-18</p></li> </ul> <p><h1>Sorting:</h1> <h3>[name,
        description]</h3></p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- sxp.sxpvpns.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: Required Only if Enabled from GUI Example:- fetch
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/search'
    post:
      tags:
      - sxpvpns
      summary: Create SXP VPN
      description: <p>This API creates a SXP VPN.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- sxp.sxpvpns.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: The Token value from the GET X-CSRF-TOKEN fetch request
      - in: header
        name: Bulk Support
        type: string
        description: Operation 'Create' can be used within Bulk Request
      - in: body
        name: request
        schema:
          $ref: '#/definitions/sxpvpns'
      responses:
        201:
          description: Created
  /ers/config/sxpvpns/versioninfo:
    get:
      tags:
      - sxpvpns
      summary: Get SXP VPNs version information
      description: <p>This API helps to retrieve the version information related to the SXP VPNs.</p>
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VersionInfo'
  /ers/config/sxpvpns/submit:
