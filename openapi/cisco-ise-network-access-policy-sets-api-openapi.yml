    post:
      tags:
      - Network Access - Policy Sets
      summary: Network Access - Create a new policy set.
      description: 'Network Access - Create a new policy set: <ul> <li> Policy must include name , service identifier (either server sequence or allowed protocol) and a condition. </li> <li> Condition has hierarchical structure which define a set of condition for which policy could be match. </li> <li> Condition can be either reference to a stored Library condition, using model <b>ConditionReference</b>, or, dynamically built conditions which are not stored in the conditions Library, using models <b>ConditionAttributes, ConditionAndBlock, ConditionOrBlock</b>.</li> </ul> '
      operationId: createNetworkAccessPolicySet
      parameters:
      - name: X-Request-ID
        in: header
        description: request Id, will return in the response headers, and appear in logs
        required: false
        schema:
          type: string
