aid: cisco-ise
name: Cisco Identity Services Engine
description: 'Cisco Identity Services Engine (ISE) is Cisco''s network access control and zero-trust policy platform: 802.1X
  and RADIUS authentication, TACACS+ device administration, guest and BYOD onboarding, endpoint profiling, posture assessment,
  and TrustSec security-group segmentation, all driven from a central policy service. It is deployed on-premises or in AWS,
  Azure and OCI, so its APIs are served by each customer''s own appliance behind the Cisco ISE API Gateway rather than a shared
  public host. The contracts themselves are public: Cisco publishes 103 machine-readable API descriptions covering 1,490 operations
  on its DevNet documentation CDN — a consolidated 395-operation ERS Open API, 30 OpenAPI 3.0.x documents for the newer Open
  API surface (Policy, TrustSec, Certificates, Deployment, Webhooks, Licensing, pxGrid Direct and more), a Monitoring (MnT)
  OpenAPI, 69 legacy per-resource Swagger 2.0 references, and an outbound Mobile Device Management contract that ISE calls
  on third-party MDM vendors. Authentication is HTTP Basic with ERS Admin and ERS Operator roles; API services are disabled
  by default and enabled per node.'
url: https://raw.githubusercontent.com/api-evangelist/cisco-ise/refs/heads/main/apis.yml
type: Index
access: 3rd-Party
position: Consumer
image: https://www.cisco.com/web/fw/i/logo-open-graph.gif
x-type: company
x-source: cisco-family-buildout:2026-08-19
x-parent: cisco
x-relationship: product
x-contract-status: published-on-vendor-docs-cdn
x-contract-note: Corrected 2026-08-19. The previous profile recorded 'no central anonymously fetchable specification' because
  only the JS-rendered docs shell at developer.cisco.com was checked. Cisco in fact publishes all 103 ISE API descriptions
  anonymously at pubhub.devnetcloud.com — its own DevNet documentation CDN — enumerable from that project's own config.json
  manifest. What is customer-specific is the RUNTIME (each deployment's appliance), not the CONTRACT. All 103 documents are
  harvested verbatim in openapi/_original/ with per-file SHA-256 and source URL.
