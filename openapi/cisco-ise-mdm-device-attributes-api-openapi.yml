tags:
- name: mdm-device-attributes
paths:
  /<mdm-server>/{api_path}/devices/:
    get:
      tags:
      - mdm-device-attributes
      summary: Get the device attributes from the MDM server
      description: 'This API is used for query device attributes. We can give a query category such as  GUID, Hostname, MAC
        address, compliance status,  User, and the Attribute filter.<br><br>The maximum number of devices returned is the
        value of “query_max_size” returned from “mdm server info API” (API #1), default is 5000. The Cisco ISE initial call
        of this API will pass paging info “0”. If MDM have more than ''query_max_size'' number of devices to return, it can
        design its own paging scheme, just return the paging_info in its response, which will be part of the URL in next call
        from Cisco ISE. If paging info is “0” in response, or it doesn’t return paging info in its response, means all record
        has been returned, then Cisco ISE will not make further calls for the query.<br><br>Similar to earlier version API
        is used to get device attributes particularly compliance data based on GUID (MDM ID), it is the key identity of the
        device managed by vendor .  Vendor is expected to have unique id for each device it is managing, GUID is expected
        to be less than 128 bytes in size.  Previously in v1/v2 MAC Address, UDID, IMEI, MEID were available as unique identifiers.  With
        v3, GUID & hostname are additional identifiers added to the list. MDM.DaysSinceLastCheckin - Number of days since
        a user last checked in or synched a device with MDM server, from 1 to 365 days.<br><br> Example: https://mdm-server/ciscoise/mdmapi/v3/devices/?paging=<paging>&querycriteria=<Query
        Criteria category>value=<Query Criteria value>&filter=<Attribute filter>'
      parameters:
      - name: api_path
        in: path
        description: api_path obtained from GET operation of mdm-server-info
        required: true
        schema:
          type: string
      - name: paging
        in: query
        description: 0 means first call.
        required: true
        schema:
          type: integer
      - name: querycriteria
        in: query
        description: '<ul><li>guid: Recommended to follow standard based on RFC 4122, expected to be unique identifier for
          the device with maximum length of 128 bytes.</li><li>guidhn (hostname): Standard or traditional hostname assigned
          to device, expected to be unique identifier for the device</li><li>MAC address</li><li>compliance </li><li>macaddress:
          standardize as 12 HEX without separator</li><li>MEID (Mobile Equipment Identifier): 14 character HEX code or 10
          digit decimal code)</li><li>UDID (Unique Device Identifier)</li><li>IMEI (International Mobile Station Equipment
          Identity)</li><li>compliance: true/false</li><li>username: free form string</li></ul>'
        required: true
        schema:
          type: string
      - name: value
        in: query
        description: Value corresponding to the Query criteria category.
        required: true
        schema:
          type: string
      - name: filter
        in: query
        description: '<table><tr><b><td><b>Attribute Name</b></td><td><b>Type</b></td><td><b>Description</b></td></b></tr><tr><td>register_status</td><td>boolean</td><td>true
          or false</td></tr><tr><td>Compliance Status</td><td>boolean</td><td>true or false</td></tr><tr><td>disk_encryption_on</td><td>boolean</td><td>true
          or false</td></tr><tr><td>pin_lock_on</td><td>boolean</td><td>true or false</td></tr><tr><td>jail_broken</td><td>boolean</td><td>true
          or false</td></tr><tr><td>manufacturer</td><td>String</td><td>For example: Samsung</td></tr><tr><td>Model</td><td>String</td><td></td></tr><tr><td>IMEI</td><td>String</td><td></td></tr><tr><td>MEID</td><td>String</td><td></td></tr><tr><td>UDID</td><td>String</td><td></td></tr><tr><td>Serial
          Number</td><td>String</td><td></td></tr><tr><td>OS_version</td><td>String</td><td></td></tr><tr><td>Phone Number</td><td>String</td><td></td></tr><tr><td>lastCheckinTimeStamp</td><td>String</td><td>last
          logon (check-in) time in milliseconds since Epoch</td></tr><tr><td>GUID</td><td>String</td><td>required if query
          is based on legacy Macddress/UDID/IMEI</td></tr><tr><td>MAC addresses</td><td>String</td><td>comma separated max
          5 MAC addresses</td></tr><tr><td>period</td><td>String</td><td>Time period in days</td></tr></table>'
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: '{username}:{password}'
        required: true
        schema:
          type: string
      - name: Example
        in: header
        description: <b>API to get device attributes using guid as device identifier :</b> <br>https://mdm-server/ise/mdm/api/devices/?paging=0&querycriteria=guid&value=000000000000&filter=all
          <br><b>API to get multiple non-compliant devices attributes using guid as device identifier :</b> <br>https://mdm-server/ise/mdm/api/devices/?paging=0&querycriteria=compliance&value=false&deviceidentifier=guid&filter=all   ->
          guid for all devices <br>If the device is not enrolled (an unregistered device) to the any mdm server then the expected
          response from the mdm server should be empty deviceList in v2 and v3. <br><b>API to get device attributes using
          previously supported macaddress/udid/imei/meid as device identifier will be supported with version 3 attributes
          as well.</b> <br>URL for macaddress/udid/imei/meid based compliance check will remain the same as in version 2,
          below is example for macaddress <br>https://mdm-server/ise/mdm/api/devices/?paging=0&querycriteria=macaddress&value=000000000000&filter=all
          <br>Response for this will include additional parameters(guid, lastCheckinTimeStamp) in version 3 <br><b>API to
          get multiple non-compliant devices attributes using macaddress as device identifier</b> <br>https://mdm-server/ise/mdm/api/devices/?paging=0&querycriteria=compliance&value=false&deviceidentifier=macaddress&filter=all
          <br>If the device is not enrolled (an unregistered device) to the any mdm server then the expected response from
          the mdm server should be empty deviceList in v2 and v3.
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/mdm-device-attributes-response'
