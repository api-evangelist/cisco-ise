        Example 1:


        The logicalProfileName filter can be used to get Enpoints that belong to a specific Logical Profile. The supported operator for logicalProfileNamefilter is EQ (equal to). The syntax to invoke the API with this filter:


        /ers/config/endpoint?filter={filter name}.{operator}.{logical profile name}


        Example:


        https://{ise-ip}:9060/ers/config/endpoint?filter=logicalProfileName.EQ.LP_Apple


        Example 2:


        To search guest users by using toDate column,follow the format:


        DD-MON-YY (Example:13-SEP-18)


