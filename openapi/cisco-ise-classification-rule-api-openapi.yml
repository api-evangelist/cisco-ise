      tags:
      - Classification rule
      summary: Classification rule  - Create Classification rule .
      description: 'Classification rule  - Create Classification rule : <ul> <li> Filter configuration must include name and condition. </li> <li> Condition has hierarchical structure which define a set of conditions for which authoriztion policy rule could be match. </li> <li> Condition can be either reference to a stored Library condition, using model <b>ConditionReference</b> </li> or dynamically built conditions which are not stored in the conditions Library, using models <b>ConditionAttributes, ConditionAndBlock, ConditionOrBlock</b>. </li> </ul> '
      operationId: createClassificationRuleConfiguration
      parameters:
