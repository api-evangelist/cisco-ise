swagger: '2.0'
info:
  description: |
    Endpoint Identity Groups API allows the client to add, delete, update, and search endpoint groups. 

    
    <h2>Revision History</h2>
    <table font-family:monospace> 
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Revision #</b></td><td><b>Resource Version</b></td><td><b>Cisco ISE Version</b></td><td><b>Description</b></td></tr>
    <tr><td>0</td><td>1.0</td><td>1.3</td><td>Initial Cisco ISE Version</td></tr>
    <tr valign=top style='border-bottom:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#f8f8f8'><td>1</td><td>1.1</td><td>2.4</td><td>Added GetByName operation</td></tr>
    <tr style='border-bottom:solid #CCCCCC'><td>2</td><td>1.2</td><td>3.2</td><td>Added patch operation</td></tr>
    </table>
    <br><br>
    
    <h2>Resource Definition</h2>
    <table>
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Default Values</b></td><td><b>Example Values</b></td></tr>
    <tr><td style='font-family:monospace'>name</td><td>String</td><td>Yes</td><td>Resource Name</td><td></td><td>Cisco-Meraki-Devicee</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>id</td><td>String</td><td>No</td><td>Resource UUID, mandatory for update</td><td></td><td>1e2700a0-8c00-11e6-996c-525400b48521</td></tr>
    <tr><td style='font-family:monospace'>description</td><td>String</td><td>No</td><td>Resource Description</td><td></td><td>Identity Group for Profile: Cisco-Meraki-Device</td></tr>
    <tr style ='background:#f8f8f8;border-bottom:solid #CCCCCC 1.0pt'><td style='font-family:monospace'>systemDefined</td><td>Boolean</td><td>Yes</td><td></td><td>false</td><td></td></tr>
    <tr style ='background:#f8f8f8;border-bottom:solid #CCCCCC 1.0pt'><td style='font-family:monospace'>parentId</td><td>String</td><td>No</td><td></td><td></td><td></td></tr>
    </table>
    
    
  version: 1.0.0
  title: Endpoint Groups

tags:
- name: endpointgroup

paths:
  /ers/config/endpointgroup/name/{name}:
    get:
      tags: 
      - endpointgroup
      summary: Get endpoint identity group by name
      description:
        <p>This API allows the client to get an endpoint identity group by name.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: name
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpointgroup.1.1
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
              Example:- fetch
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/endpointidentitygroup_name'
            
  /ers/config/endpointgroup/{id}:
    get:
      tags: 
      - endpointgroup
      summary: Get endpoint identity group by ID
      description:
        <p>This API allows the client to get an endpoint identity group by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpointgroup.1.1
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
              Example:- fetch
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/endpoint'
    patch:
      tags: 
      - endpointgroup
      summary: Update part of the endpoint identity group by ID
      description:
        <p>This API allows the user to update part of the endpoint identity group by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpointgroup.1.1
          required: false
        - in: body
          name: request
          schema:
            $ref: '#/definitions/patchRequest'
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/endpoint'  
            
    put:
      tags:
      - endpointgroup
      summary: Update endpoint identity group
      description:  <p>This API allows the client to update an endpoint identity group.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpointgroup.1.1
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
          required: false
        - in: body
          name: request
          schema:
            $ref: '#/definitions/endpoint'
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/Update'  
            
    delete:
      tags:
      - endpointgroup
      summary: Delete endpoint identity group
      description:
        <p>This API deletes an endpoint identity group.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpointgroup.1.1
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
      responses: 
        204:
          description: No Content  

  /ers/config/endpointgroup:
    get:
      tags: 
      - endpointgroup
      summary: Get all endpoint identity groups
      description:
        <p>This API allows the client to get all the endpoint identity groups.</p>
        <p><h1>Filter:</h1> <h3>[name]</h3></p>
        <p>To search guest users by using <b>toDate</b> column,follow the format:</p> 
        <p>DD-MON-YY (Example:13-SEP-18)</p>
        <ul>
        <li><p>Day or Year:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13</p></li>
        <li><p>Month:GET /ers/config/guestuser/?filter=toDate.CONTAINS.SEP</p></li>
        <li><p>Date:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13-SEP-18</p></li>
        </ul>
        <p><h1>Sorting:</h1> <h3>[name, description]</h3></p>     
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpointgroup.1.1
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
             Example:- fetch
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/search'  

    post:
      tags:
      - endpointgroup
      summary: Create endpoint identity group
      description:
        <p>This API creates an endpoint identity group.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.endpointgroup.1.1
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: body
          name: request
          schema:
            $ref: '#/definitions/endpoint'
      responses:
        201:
          description: Created
             
  /ers/config/endpointgroup/versioninfo:
    get:
      tags:
      - endpointgroup
      summary: Get endpoint identity group version information
      description:
        <p>This API helps to retrieve the version information related to the endpoint identity group.</p>
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VersionInfo'
            
