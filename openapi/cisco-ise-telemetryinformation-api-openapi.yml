tags:
- name: telemetryinformation
paths:
  /ers/config/telemetryinfo/{id}:
    get:
      tags:
      - telemetryinformation
      summary: Get telemetry information by ID
      description: <p>This API allows the client to get telemetry information by ID.</p>
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - in: header
        name: HTTP ERS-Media-Type Header
        description: Example:- telemetry.telemetryinfo.1.0
        required: false
        schema:
          type: string
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        description: Required Only if Enabled from GUI Example:- fetch
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/telemetryinfo'
            application/xml:
              schema:
                $ref: '#/components/schemas/telemetryinfo'
  /ers/config/telemetryinfo:
    get:
      tags:
      - telemetryinformation
      summary: Get all telemtry information
      description: <p>This API allows the client to get all the telemetry information.</p> <p><h1>Filter:</h1> <h3>[deploymentId]</h3></p> <p>To search guest users by using <b>toDate</b> column,follow the format:</p> <p>DD-MON-YY (Example:13-SEP-18)</p> <ul> <li><p>Day or Year:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13</p></li> <li><p>Month:GET /ers/config/guestuser/?filter=toDate.CONTAINS.SEP</p></li> <li><p>Date:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13-SEP-18</p></li> </ul>
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        description: Example:- telemetry.telemetryinfo.1.0
        required: false
        schema:
          type: string
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        description: Required Only if Enabled from GUI Example:- fetch
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/search'
            application/xml:
              schema:
                $ref: '#/components/schemas/search'
  /ers/config/telemetryinfo/versioninfo:
    get:
      tags:
      - telemetryinformation
      summary: Get telemtry information version information
      description: <p>This API helps to retrieve the version information related to the telemetry information.</p>
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
components:
  schemas:
    telemetryinfo:
