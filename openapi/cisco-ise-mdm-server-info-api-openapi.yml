tags:
- name: mdm-server-info
paths:
  /<mdm-server>/ciscoise/mdminfo/:
    get:
      tags:
      - mdm-server-info
      summary: Get the MDM server information
      description: 'This API (available since version 2) is used for initially adding an MDM vendor in the Cisco ISE server.
        This is similar to the version 1 and version 2 APIs, except that in addition it provides information about the API
        version used by Cisco ISE as a URL query parameter.<br><br><b>NOTE</b>: The URL required for sending the MDM Server
        Info api request is fixed because the API path (obtained from the REST webservice response for the MDM Server Info
        API) is not yet known to Cisco ISE.<br><br>Base API for version 3 remains similar. In the response it is mandatory
        for the partner MDM server to share the vendor, product_name & product_version for version 3 and above.<br><br> Example:
        https://mdm-server/ciscoise/mdminfo/?ise_api_version={max_ise_supported_api_version}'
      parameters:
      - name: ise_api_version
        in: query
        required: true
        schema:
          type: integer
      - name: Resources
        in: header
        description: <table> <tr><td><b>Attribute Name</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td></tr>
          <tr><td>name</td><td>String</td><td>Yes</td><td>mdminfo</td></tr> <tr><td>api_version</td><td>Integer</td><td>Yes</td><td>Response
          from MDM server with supported version, should be equal to or less than ISE supported version shared in API call/request
          URL</td></tr> <tr><td>api_path</td><td>String</td><td>Yes</td><td>API path to get device compliance or non-compliance
          information</td></tr> <tr><td>redirect_url</td><td>String</td><td>Yes</td><td>URL for end users to register or enroll
          to MDM server</td></tr> <tr><td>query_max_size</td><td>Integer</td><td>Yes</td><td>Maximum number of records that
          can be retrieved at a time during bulk retrievals (Eg. Non compliance API response)</td></tr> <tr><td>messaging_support</td><td>Boolean</td><td>Yes</td><td>Indicates
          if messaging is supported through MDM server</td></tr> <tr><td>vendor</td><td>String</td><td>Yes</td><td>Name of
          the MDM partner (Mandatory from version 3)</td></tr> <tr><td>product_name</td><td>String</td><td>Yes</td><td>Name
          of the MDM server (Mandatory from version 3)</td></tr> <tr><td>product_version</td><td>String</td><td>Yes</td><td>Version
          of the MDM server  (Mandatory from version 3)</td></tr> </table>
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/mdm-server-info'
  /<mdm-server-ip>/ciscoise/mdminfo/:
    get:
      tags:
      - mdm-server-info
      summary: Get the MDM server information
      description: 'This API (available since version 2) is used for initially adding an MDM vendor in the Cisco ISE server.
        This is similar to the version 1 API, except that in addition it provides information about the API version used by
        Cisco ISE as a URL query parameter.<br><br><b>NOTE</b>: The URL required for sending the MDM Server Info api request
        is fixed because the API path (obtained from the REST webservice response for the MDM Server Info API) is not yet
        known to Cisco ISE.<br><br> <table> <tr><td><b>Version</b></td><td><b>URL</b></td><tr> <tr><td>1</td><td>https://mdm-server/ciscoise/mdminfo</td></tr>
        <tr><td>2</td><td>https://mdm-server/ciscoise/mdminfo/?ise_api_version={max_ise_supported_api_version}</td></tr> </table>'
      parameters:
      - name: ise_api_version
        in: query
        required: true
        schema:
          type: integer
      - name: Resources
        in: header
        description: <table> <tr><td><b>Attribute Name</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td></tr>
          <tr><td>name</td><td>String</td><td>Yes</td><td>mdminfo</td></tr> <tr><td>api_version</td><td>Integer</td><td>Yes</td><td>Maximum
          version MDM server supports</td></tr> <tr><td>api_path</td><td>String</td><td>Yes</td><td>API path to get device
          compliance or non-compliance information</td></tr> <tr><td>redirect_url</td><td>String</td><td>Yes</td><td>URL for
          end users to register or enroll to MDM server</td></tr> <tr><td>query_max_size</td><td>Integer</td><td>Yes</td><td>Maximum
          number of records that can be retrieved at a time during bulk retrievals (Eg. Non compliance API response)</td></tr>
          <tr><td>messaging_support</td><td>Boolean</td><td>Yes</td><td>Indicates if messaging is supported through MDM server</td></tr>
          <tr><td>vendor</td><td>String</td><td>No</td><td>Name of the MDM partner</td></tr> <tr><td>product_name</td><td>String</td><td>No</td><td>Name
          of the MDM server</td></tr> <tr><td>product_version</td><td>String</td><td>No</td><td>Version of the MDM server</td></tr>
          </table>
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/mdm-server-info_2'
