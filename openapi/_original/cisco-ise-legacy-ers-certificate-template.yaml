            rel: self
            href: https://<ise-ip>:9060/ers/config/certificatetemplate/3e38b378-ccf4-5a56-e053-59e447ab5775
            type: application/json
        - id: 0ca8f1b6-500d-560b-e053-75189a0ab0d1
          name: EAP_Authentication_Certificate_Template
