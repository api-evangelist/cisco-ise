            application/xml:
              schema:
                $ref: '#/components/schemas/getall'
  /ers/config/ancendpoint/apply:
    put:
      tags:
      - ancendpoint
      summary: Apply required configuration
      description: <p>This API allows the client to apply the required configuration.</p>
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        description: Example:- anc.ancendpoint.1.0
        required: false
        schema:
          type: string
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        description: The Token value from the GET X-CSRF-TOKEN fetch request
        schema:
          type: string
      - in: header
        name: Additional Attributes
        description: MAC address, IP address, Policy Name
        schema:
          type: string
      responses:
        200:
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ancendpointapply'
          application/xml:
            schema:
              $ref: '#/components/schemas/ancendpointapply'
  /ers/config/ancendpoint/versioninfo:
    get:
