      id:
        type: string
        example: fe8c7cc0-8bff-11e6-996c-525400b48521
      name:
        type: string
        example: 2Wire-Device
      description:
        type: string
        example: Policy for 2Wire-Device
      link:
        type: object
        properties:
          rel:
            type: string
            example: self
          href:
            type: string
            example: https://<ise-ip>:9060/ers/config/ers/config/profilerprofile/fe8c7cc0-8bff-11e6-996c-525400b48521
          type:
            type: string
            example: application/json
  search:
    type: object
    properties:
      SearchResult:
        $ref: '#/definitions/SearchResult'
  SearchResult:
    type: object
    properties:
      total:
