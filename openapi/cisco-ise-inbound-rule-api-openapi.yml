        '404':
          description: The specified resource was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
                exampleSetFlag: false
    post:
      tags:
      - Inbound Rule
      summary: Inbound Rule - Create Inbound Rule.
      description: 'Inbound Rule - Create Inbound Rule: <ul> <li> Filter configuration must include name and condition. </li> <li> Condition has hierarchical structure which define a set of conditions for which authoriztion policy rule could be match. </li> <li> Condition can be either reference to a stored Library condition, using model <b>ConditionReference</b> </li> or dynamically built conditions which are not stored in the conditions Library, using models <b>ConditionAttributes, ConditionAndBlock, ConditionOrBlock</b>. </li> </ul> '
      operationId: createIngressFilterConfiguration
      parameters:
      - name: X-Request-ID
        in: header
        description: The request ID header consists of the request ID which is returned in the response headers and also appears in the API service logs.
        required: false
        schema:
          type: string
          exampleSetFlag: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CdpIngressFilter'
              exampleSetFlag: false
      responses:
        '200':
          description: list of CdpIngressFilterResponseEntity objects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CdpIngressFilterResponseEntity'
                exampleSetFlag: false
        '201':
