swagger: '2.0'
info:
  description: |
    SGT API allows the client to search SGTs.
    
    <h2>Revision History</h2>
    <table font-family:monospace> 
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Revision #</b></td><td><b>Resource Version</b></td><td><b>Cisco ISE Version</b></td><td><b>Description</b></td><td colspan ="2"><b>Revision Modification</b></td></tr>
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td></td><td></td><td></td><td></b></td><td><b>Attribute</b></td><td><b>Description</b></td></tr>
    <tr><td>0</td><td>1.0</td><td>1.2</td><td>Initial Cisco ISE Version</td><td></td><td></td></tr>
    <tr valign=top style='background:#f8f8f8'><td>1</td><td>1.1</td><td>1.4</td><td>Cisco ISE 1.4 model changes</td><td>isTagFromRange</td><td>Removed Attribute isTagFromRange - depricated - set to FALSE value by default</td></tr>
    <tr><td>2</td><td>1.2</td><td>2.3</td><td>Cisco ISE 2.3 model changes</td><td>propogateToApic</td><td>Added Boolean Attribute propogateToApic - By default value is false</td></tr>
    <tr valign=top style='border-bottom:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#f8f8f8'><td rowspan='2'>3</td><td rowspan='2'>1.3</td><td rowspan='2'>2.7</td><td rowspan='2'>Cisco ISE 2.7 model changes</td><td>isReadOnly</td><td>Added Boolean Attribute isReadOnly - By default value is false</td></tr><tr style='border-bottom:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#f8f8f8'><td>defaultSGACLs</td><td>Added List Attribute defaultSGACLs</td></tr>
    </table>
    <br><br>
    
    <h2>Resource Definition</h2>
    <table>
    <tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Default Values</b></td><td><b>Example Values</b></td></tr>
    <tr><td style='font-family:monospace'>name</td><td>String</td><td>Yes</td><td>Resource Name</td><td></td><td>Employees</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>id</td><td>String</td><td>No</td><td>Resource UUID, mandatory for update</td><td><td>93ad6890-8c01-11e6-996c-525400b48521</td></tr>
    <tr><td style='font-family:monospace'>description</td><td>String</td><td>No</td><td>Resource Description</td><td></td><td>Employee Security Group</td></tr>
    <tr style= 'background:#f8f8f8'><td style='font-family:monospace'>value</td><td>Integer</td><td>Yes</td><td>Value range: 2 ot 65519 or -1 to auto-generate</td><td></td><td>4</td></tr>
    <tr><td style='font-family:monospace'>propogateToApic</td><td>Boolean</td><td>No</td><td></td><td></td><td>true</td></tr>
    <tr style= 'background:#f8f8f8'><td style='font-family:monospace'>isReadOnly</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>
    <tr><td style='font-family:monospace'>defaultSGACLs</td><td>List</td><td>No</td><td></td><td></td><td>[ ]</td></tr>
    <tr style= 'background:#f8f8f8'><td style='font-family:monospace'>propogateToApic</td><td>Boolean</td><td>No</td><td></td><td></td><td>true</td></tr>
    <tr style= 'border-bottom:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt'><td style='font-family:monospace'>generationId</td><td>Integer</td><td>No</td><td></td><td></td><td>0</td></tr>
    </table>
  
  version: 1.0.0
  title: sgt

tags:
- name: sgt


paths:
  /ers/config/sgt/{id}:
    get:
      tags: 
      - sgt
      summary: Get security group by ID
      description:
        <p>This API allows the client to get a security group by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- trustsec.sgt.1.2
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
              Example:- fetch
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/securitygroups'

    put:
      tags:
      - sgt
      summary: Update security group
      description:  <p>This API allows the client to update a security group.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- trustsec.sgt.1.2
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: header
          name: Bulk Support
          type: string
          description: 
               Operation 'Update' can be used within Bulk Request
        - in: header
          name: Additional Information
          type: string
          description: 
               Generation Id is a read Only attribute hence any values that would be sent in the request would be ignored.
        - in: body
          name: request
          schema:
            $ref: '#/definitions/securitygroups'
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/Update'  
            
    delete:
      tags:
      - sgt
      summary: Delete security group
      description:
        <p>This API deletes a security group.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- trustsec.sgt.1.2
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: header
          name: Bulk Support
          type: string
          description: 
               Operation 'Delete' can be used within Bulk Request
      responses: 
        204:
          description: No Content  
          
  /ers/config/sgt:
    get:
      tags: 
      - sgt
      summary: Get all security groups
      description:
        <p>This API allows the client to get all the security groups.</p>
        <p><h1>Filter:</h1> <h3>[propogateToApic, name, description, value]</h3></p>
        <p>To search guest users by using <b>toDate</b> column,follow the format:</p> 
        <p>DD-MON-YY (Example:13-SEP-18)</p>
        <ul>
        <li><p>Day or Year:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13</p></li>
        <li><p>Month:GET /ers/config/guestuser/?filter=toDate.CONTAINS.SEP</p></li>
        <li><p>Date:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13-SEP-18</p></li>
        </ul>
        <p><h1>Sorting:</h1> <h3>[name, description, value]</h3></p>    
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- trustsec.sgt.1.2
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
             Example:- fetch
         
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/search'  

    post:
      tags:
      - sgt
      summary: Create security group
      description:
        <p>This API creates a security group.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- trustsec.sgt.1.2
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: header
          name: Bulk Support
          type: string
          description: 
               Operation 'Create' can be used within Bulk Request
        - in: header
          name: Additional Information
          type: string
          description: 
               Generation Id is a read Only attribute hence any values that would be sent in the request would be ignored.value '-1' , value will be auto generated according trustsec settings ranges only for , it can be Create opration.
        - in: body
          name: request
          schema:
            $ref: '#/definitions/securitygroups'
      responses:
        201:
          description: Created
             
  /ers/config/sgt/versioninfo:
    get:
      tags:
      - sgt
      summary: Get security groups version information
      description:
        <p>This API helps to retrieve the version information related to the security groups.</p>
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VersionInfo'

  /ers/config/sgt/submit:
    put:
      tags:
      - sgt
      summary: Submit bulk request 
      description:
        <p>This API allows the client to submit the bulk request.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: body
          name: request
          schema:
            $ref: '#/definitions/bulkrequest'  
      responses:
        202:
          description: Accepted

  /ers/config/sgt/bulk/{bulkid}:
    get:
      tags:
      - sgt
      summary: Monitor bulk request 
      description:
        <p>This API allows the client to monitor the bulk request.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: bulkid
          in: path
          type: string 
          required: true
          description: |
            The bulk ID is a dynamically generated value.<br>For example :- ‘615360357673’
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/bulkstatus'
          
