swagger: '2.0'
info:
  description: "pxGrid Settings API allows the client to change auto-approve settings for pxGrid nodes.\n    \n**Note:**\n\
    From Cisco ISE Release 3.1, all pxGrid connections must be based on pxGrid 2.0. pxGrid 1.0-based (XMPP-based) integrations\
    \ will cease to work on Cisco ISE from Release 3.1 onwards. \n\n  pxGrid Version 2.0, which is based on WebSockets, was\
    \ introduced in Cisco ISE Release 2.4. We recommend that you plan and upgrade your other systems to pxGrid 2.0-compliant\
    \ versions in order to prevent potential disruptions, if any, to integrations.    \n    \n\n<h2>Revision History</h2>\n\
