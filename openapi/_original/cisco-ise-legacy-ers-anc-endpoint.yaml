- name: ancendpoint
paths:
  /ers/config/ancendpoint/{id}:
    get:
      tags:
      - ancendpoint
      summary: Get ANC endpoint by ID
      description: <p>This API allows the client to get an ANC endpoint by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - name: id
        in: path
        type: string
        required: true
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- anc.ancendpoint.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: 'Required Only if Enabled from GUI

          Example:- fetch'
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/ancendpointid'
  /ers/config/ancendpoint/clear:
    put:
      tags:
      - ancendpoint
      summary: Clear required configuration
      description: <p>This API allows the client to clear the required configuration.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- anc.ancendpoint.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: The Token value from the GET X-CSRF-TOKEN fetch request
      - in: header
        name: Additional Attributes
        type: string
        description: MAC address, IP address
      - in: body
        name: request
        schema:
          $ref: '#/definitions/ancendpointapply'
      responses:
        200:
          description: OK
  /ers/config/ancendpoint:
    get:
      tags:
      - ancendpoint
      summary: Get all ANC endpoints
      description: <p>This API allows the client to get all the ANC endpoints.</p> <p><h1>Filter:</h1><h3>[MAC address]</h3></p>
        <p>You can use MAC address as a filter for the endpoints. For example:</p> <p font-family:monospace>https://<ISE node>/ers/config/ancendpoint/?filter=name.CONTAINS.00:00:01:00:00:0B</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- identity.adminuser.1.2
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: 'Required Only if Enabled from GUI

          Example:- fetch'
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/getall'
  /ers/config/ancendpoint/apply:
    put:
      tags:
      - ancendpoint
      summary: Apply required configuration
      description: <p>This API allows the client to apply the required configuration.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- anc.ancendpoint.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: The Token value from the GET X-CSRF-TOKEN fetch request
      - in: header
        name: Additional Attributes
        type: string
        description: MAC address, IP address, Policy Name
      - in: body
        name: request
        schema:
          $ref: '#/definitions/ancendpointapply'
      responses:
        200:
          description: OK
  /ers/config/ancendpoint/versioninfo:
    get:
      tags:
      - ancendpoint
      summary: Get ANC endpoint version information
      description: <p>This API helps to retrieve the version information related to the ANC Endpoint.</p>
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VersionInfo'
  /ers/config/ancendpoint/bulk/submit:
    put:
      tags:
      - ancendpoint
      summary: Submit bulk request
      description: <p>This API allows the client to submit the bulk request.</p>
      consumes:
      - application/json
      - application/xml
      parameters:
      - in: body
        name: request
        schema:
          $ref: '#/definitions/bulkrequest'
      responses:
        202:
          description: Accepted
  /ers/config/ancendpoint/bulk/{bulkid}:
    get:
      tags:
      - ancendpoint
      summary: Monitor bulk request
      description: <p>This API allows the client to monitor the bulk request.</p>
      produces:
      - application/json
      - application/xml
      parameters:
      - name: bulkid
        in: path
        type: string
        required: true
        description: 'The bulk ID is a dynamically generated value.<br>For example :- ‘615360357673’

          '
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/monitorbulkrequest'
