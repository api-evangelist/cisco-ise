tags:
- name: mdm-messaging
paths:
  /<mdm-server>/{api_path}/sendmessage:
    put:
      tags:
      - mdm-messaging
      summary: Send the message through MDM server to end user
      description: 'This API allows Cisco ISE to send messages through MDM to end user mobile devices (assuming MDM has messaging system to communicate with mobile devices).   Supports guid & guidhn as device identifiers while sending action requests.<br><br> **Note**: : Implementation of this API is optional at this point, vendor implementation of this  API will also need to add flag “messaging_support” in response of API#1 to signify that the messaging API  is implemented.'
      parameters:
      - name: api_path
        in: path
        description: api_path obtained from GET operation of mdm-server-info
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: '{username}:{password}'
        required: true
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/mdm-messaging-response'
      requestBody:
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/mdm-messaging-request'
  /<mdm-server-ip>/{api_path}/sendmessage:
    put:
      tags:
      - mdm-messaging
      summary: Send the message through MDM server to end user
      description: 'This API allows Cisco ISE to send messages through MDM to end user mobile devices (assuming MDM has messaging system to communicate with mobile devices).   Supports guid & guidhn as device identifiers while sending action requests.<br><br> **Note**: : Implementation of this API is optional at this point, vendor implementation of this  API will also need to add flag “messaging_support” in response of API#1 to signify that the messaging API  is implemented.'
      parameters:
      - name: api_path
        in: path
        description: api_path obtained from GET operation of mdm-server-info
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        description: '{username}:{password}'
        required: true
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/xml:
              schema:
                $ref: '#/components/schemas/mdm-messaging'
components:
  schemas:
    mdm-messaging-response:
      type: object
      properties:
        name:
          type: string
          example: sendmessage
        api_version:
          type: integer
          example: 3
        deviceList:
          type: object
          properties:
            device:
              type: object
              properties:
                guid:
                  type: string
                  example: '000000000000'
                result:
                  type: object
                  properties:
                    message_status:
                      type: boolean
                      example: false
                    failure_reason:
                      type: string
                      example: something happened, message is not sent
    mdm-messaging-request:
      type: object
      properties:
        identifier:
          type: object
          properties:
            guid:
              type: string
              example: '000000000000'
        message:
          type: object
          properties:
            message_type:
              type: string
              example: Alert
            message_header:
              type: string
              example: Need your action in the next 10 minutes
            message_body:
              type: string
              example: Your device is not compliant for the following reason, please take action in the next 10 minutes, otherwise you network access will be revoked
    mdm-messaging:
      type: object
      properties:
        name:
          type: string
          example: sendmessage
        api_version:
          type: integer
          example: 2
        deviceList:
          type: object
          properties:
            device:
              type: object
              properties:
                result:
                  type: object
                  properties:
                    message_status:
                      type: boolean
                      example: false
                    failure_reason:
                      type: string
                      example: something happened, message is not sent
