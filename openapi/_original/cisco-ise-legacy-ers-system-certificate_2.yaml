tags:
- name: systemcertificate
paths:
  /ers/config/systemcertificate:
    post:
      tags:
      - systemcertificate
      summary: Create system certificate
      description: <p>This API allows the client to create a system certificate.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        type: string
        description: Example:- ca.systemcertificate.1.0
        required: false
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        type: string
        description: Required Only if Enabled from GUI Example:- fetch
      - in: body
        name: request
        schema:
          $ref: '#/definitions/systemcertificate'
      responses:
        201:
          description: Created
  /ers/config/systemcertificate/versioninfo:
    get:
      tags:
      - systemcertificate
      summary: Get system certificate version information
      description: <p>This API helps to retrieve the version information related to the system certificate.</p>
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VersionInfo'
definitions:
  systemcertificate:
    type: object
    properties:
      ERSSystemCertificate:
        $ref: '#/definitions/ERSSystemCertificate'
  ERSSystemCertificate:
    type: object
    properties:
      nodeId:
        type: string
        example: ISE-01
      ersLocalCertStub:
        type: object
        properties:
          friendlyName:
            type: string
            example: Cisco
          ersSubjectStub:
            type: object
            properties:
              commonName:
                type: string
                example: $FQDN$
              organizationalUnitName:
                type: string
                example: Cisco-SAMLCert
              organizationName:
                type: string
                example: Cisco
              localityName:
                type: string
                example: City
              stateOrProvinceName:
                type: string
                example: State
              countryName:
                type: string
                example: Country
          keyLength:
            type: string
            example: 512 OR 1024 OR 2048 OR 4096
          xgridCertificate:
            type: string
            example: on OR off
          groupTagDD:
            type: string
            example: add-group-tag
          samlCertificate:
            type: string
            example: on OR off
          keyType:
            type: string
            example: RSA OR ECDSA
          digest:
            type: string
            example: SHA-256 OR SHA-384 OR SHA-512
          certificatePolicies:
            type: string
            example: certificate policies
          expirationTTL:
            type: integer
            example: 2
          selectedExpirationTTLUnit:
            type: string
            example: days OR weeks OR months OR years
          allowWildcardCerts:
            type: string
            example: on OR off
          certificateSanDns:
            type: string
            example: cisco.com
          certificateSanIp:
            type: string
            example: IP-ADDRESS
          certificateSanUri:
            type: string
            example: URI
  VersionInfo:
    type: object
    properties:
      VersionInfo:
        $ref: '#/definitions/version'
  version:
    type: object
    properties:
      currentServerVersion:
        type: string
        example: '1.0'
      supportedVersions:
        type: string
        example: '1.0'
      link:
        $ref: '#/definitions/link1'
  link1:
    type: object
    properties:
      rel:
        type: string
        example: self
      href:
        type: string
        example: https://<ise-ip>:9060/ers/config/systemcertificate/versioninfo
      type:
        type: string
        example: application/json
