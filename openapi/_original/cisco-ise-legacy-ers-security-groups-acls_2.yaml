  /ers/config/sgacl:
    get:
      tags:
      - sgacl
      summary: Get all security group ACLs
      description: <p>This API allows the client to get all the security group ACLs.</p> <p><h1>Filter:</h1> <h3>[ipVersion,
        name, description]</h3></p> <p>To search guest users by using <b>toDate</b> column,follow the format:</p> <p>DD-MON-YY
        (Example:13-SEP-18)</p> <ul> <li><p>Day or Year:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13</p></li> <li><p>Month:GET
        /ers/config/guestuser/?filter=toDate.CONTAINS.SEP</p></li> <li><p>Date:GET /ers/config/guestuser/?filter=toDate.CONTAINS.13-SEP-18</p></li>
        </ul> <p><h1>Sorting:</h1> <h3>[ipVersion, name, description]</h3></p>
