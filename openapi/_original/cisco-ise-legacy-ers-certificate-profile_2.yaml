    <h2>Resource Definition</h2>

    <table>

    <tr valign=top style=''border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7''><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Default
    Values</b></td><td><b>Example Values</b></td></tr>

    <tr><td style=''font-family:monospace''>name</td><td>String</td><td>Yes</td><td>Resource Name</td><td></td><td>Certificate_Profile</td></tr>

    <tr valign=top style=''background:#f8f8f8''><td style=''font-family:monospace''>id</td><td>String</td><td>No</td><td>Resource
    UUID</td><td></td><td>f9269682-dcaf-11e3-ad0a-5bdcd2d9fd69</td></tr>

    <tr><td style=''font-family:monospace''>description</td><td>String</td><td>No</td><td>Resource Description</td><td></td><td></td></tr>

    <tr valign=top style=''background:#f8f8f8''><td style=''font-family:monospace''>allowedAsUserName</td><td>Boolean</td><td>No</td><td>To
    be set true or false</td><td>false</td><td></td></tr>

    <tr><td style=''font-family:monospace''>externalIdentityStoreName</td><td>String</td><td>No</td><td>Referred IDStore name
    for the Certificate Profile or [not applicable] in case no identity store is chosen</td><td>[not applicable]</td><td>[not
    applicable]</td></tr>

    <tr valign=top style=''background:#f8f8f8''><td style=''font-family:monospace''>certificateAttributeName</td><td>ENUM</td><td>No</td><td>Attribute
    name of the Certificate Profile - used only when CERTIFICATE is chosen in usernameFrom. Allowed values:<br>- SUBJECT_COMMON_NAME<br>-
    SUBJECT_ALTERNATIVE_NAME<br>- SUBJECT_SERIAL_NUMBER<br>- SUBJECT<br>- SUBJECT_ALTERNATIVE_NAME_OTHER_NAME<br>- SUBJECT_ALTERNATIVE_NAME_EMAIL<br>-
    SUBJECT_ALTERNATIVE_NAME_DNS.<br>- Additional internal value ALL_SUBJECT_AND_ALTERNATIVE_NAMES is used automatically when
    usernameFrom=UPN</td><td>SUBJECT_COMMON_NAME</td><td></td></tr>

    <tr><td style=''font-family:monospace''>matchMode</td><td>ENUM</td><td>No</td><td>Match mode of the Certificate Profile.
    Allowed values: <br>- NEVER<br>- RESOLVE_IDENTITY_AMBIGUITY<br>- BINARY_COMPARISON</td><td>NEVER</td><td></td></tr>

    <tr valign=top style=''background:#f8f8f8; border-bottom:solid #CCCCCC 1.0pt''><td style=''font-family:monospace''>usernameFrom</td><td>ENUM</td><td>No</td><td>The
    attribute in the certificate where the user name should be taken from. Allowed values:<br>- CERTIFICATE (for a specific
    attribute as defined in certificateAttributeName)<br>- UPN (for using any Subject or Alternative Name Attributes in the
    Certificate - an option only in AD)</td><td>CERTIFICATE</td><td></td></tr>

    </table>

