paths:
  /ers/config/threat/clearThreatsAndVulneribilities:
    put:
      tags:
      - clearthreatsandvulneribilities
      summary: Delete ThreatContext and Threat events that are associated with given MacAddress
      description: <p>This API allows the client to delete the ThreatContext and Threat events that are associated with the given MAC Address.</p>
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        description: Example:- irf.threat.1.0
        required: false
        schema:
          type: string
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        description: The Token value from the GET X-CSRF-TOKEN fetch request
        schema:
          type: string
      responses:
        200:
          description: OK
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/threat'
          application/xml:
            schema:
              $ref: '#/components/schemas/threat'
  /ers/config/threat/versioninfo:
    get:
      tags:
      - clearthreatsandvulneribilities
      summary: Get clear threats and vulneribilities version information
      description: <p>This API helps to retrieve the version information related to the clear threats and vulneribilities.</p>
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
