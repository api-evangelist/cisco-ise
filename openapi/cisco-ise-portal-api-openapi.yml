          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/search'
            application/xml:
              schema:
                $ref: '#/components/schemas/search'
  /ers/config/portal/versioninfo:
    get:
      tags:
      - portal
      summary: Get portal version information
      description: <p>This API helps to retrieve the version information realted to the portal.</p>
      responses:
