        example: self
      href:
        type: string
        example: https://<ise-ip>:9060/ers/config/acibindings/versioninfo
      type:
        type: string
        example: application/xml
  bindings:
    type: object
    properties:
      ACIBindings:
        $ref: '#/definitions/acibindings'
  acibindings:
    type: object
    properties:
      ip:
        type: string
        example: 10.0.0.1
      sgtvalue:
        type: string
        example: '1234'
      vn:
