    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - assignedGuestTypeForEmployee</td><td>String</td><td>Yes</td><td>Unique Id of a guest type. Employees using this portal as a guest inherit login options from the guest type</td><td></td><td>Contractor (default)</td></tr>
    <tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>&nbsp - displayLang</td><td>Enum</td><td>No</td><td>Allowed values:<br>- USEBROWSERLOCALE, <br>- ALWAYSUSE</td><td></td><td>USEBROWSERLOCALE</td></tr>
