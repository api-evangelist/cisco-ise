        example: 2
      resources:
        type: array
        example:
        - id: fe8c7cc0-8bff-11e6-996c-525400b48521
          name: 2Wire-Device
          description: Policy for 2Wire-Device
          link:
            rel: self
            href: https://<ise-ip>:9060/ers/config/profilerprofile/fe8c7cc0-8bff-11e6-996c-525400b48521
            type: application/json
        - id: fed21140-8bff-11e6-996c-525400b48521
          name: 3Com-Device
          description: Policy for 3Com-Device
          link:
            rel: self
            href: https://<ise-ip>:9060/ers/config/profilerprofile/fed21140-8bff-11e6-996c-525400b48521
