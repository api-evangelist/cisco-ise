  version: 1.0.0
  title: Sponsored Guest Portal

tags:
- name: sponsoredguestportal

paths:
  /ers/config/sponsoredguestportal/{portal-id}:
    get:
      tags: 
      - sponsoredguestportal
      summary: Get sponsored guest portal by ID
      description:
        <p>This API allows the client to get a sponsored guest portal by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: portal-id
          in: path
          type: string
          required: true
          description: |
            The portal ID is a dynamically generated value.<br>For example :- ‘b7e7d773-7bb3-442b-a50b-42837c12248a’
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- portal.sponsoredguestportal.1.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
              Example:- fetch
      responses: 
        200:
          description: OK
          schema:
            $ref: '#/definitions/sponsoredguestportal'  
    put:
      tags:
      - sponsoredguestportal
      summary: Update sponsored guest portal by ID
      description:  <p>This API allows the client to update a sponsored guest portal by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: portal-id
          in: path
          type: string
          required: true
          description: |
