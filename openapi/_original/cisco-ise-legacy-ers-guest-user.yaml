          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.guestuser.2.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
               The Token value from the GET X-CSRF-TOKEN fetch request
        - in: header
          name: Bulk support
          type: string
          description: Operation 'Create' can be used within Bulk Request
        - in: body
          name: request
          schema:
            $ref: '#/definitions/guestuser'
      responses:
        201:
          description: Created

  /ers/config/guestuser/suspend/{id}:
    put:
      tags: 
      - guestuser
      summary: Suspend guest user by ID
      description:
        <p>This API allows the client to suspend a guest user by ID.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: id
          in: path
          type: string
          required: true
        - in: header
          name: HTTP ERS-Media-Type Header
          type: string
          description: 
              Example:- identity.guestuser.2.0
          required: false
        - in: header
          name: HTTP X-CSRF-TOKEN Header
          type: string
          description: 
             Required Only if Enabled from GUI
              Example:- fetch
        - in: header
          name: Additional Attributes
          type: string
          description: 
              reason
        - in: header
          name: Bulk Support
          type: string
          description: 
              Operation 'suspendById' can be used within Bulk Request
        - in: body
          name: request
          schema:
            $ref: '#/definitions/OperationAdditionalData'            
      responses: 
        204:
          description: No Content
          
  /ers/config/guestuser/versioninfo:
    get:
      tags:
      - guestuser
      summary: Get guest user version information
      description:
        <p>This API helps to retrieve the version information related to the guest user.</p>
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/VersionInfo'

  /ers/config/guestuser/bulk/submit:
    put:
      tags:
      - guestuser
      summary: Submit bulk request 
      description:
        <p>This API allows the client to submit the bulk request.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - in: body
          name: request
          schema:
            $ref: '#/definitions/bulkrequest'  
      responses:
        202:
          description: Accepted

  /ers/config/guestuser/bulk/{bulkid}:
    get:
      tags:
      - guestuser
      summary: Monitor bulk request 
      description:
        <p>This API allows the client to monitor the bulk request.</p>
      consumes:
      - application/json
      - application/xml
      produces:
      - application/json
      - application/xml
      parameters:
        - name: bulkid
          in: path
          type: string 
          required: true
          description: |
            The bulk ID is a dynamically generated value.<br>For example :- ‘615360357673’
      responses:
        200:
          description: OK
          schema:
            $ref: '#/definitions/bulkstatus'
          
