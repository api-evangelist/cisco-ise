  /ers/config/acibindings/getall:
    get:
      tags:
      - acibindings
      summary: Get all binding information
      description: <p>This API allows clients to retrieve all the bindings that were sent to Cisco ISE by ACI or received
        on ACI from Cisco ISE.The binding information will be identical to the information on ACI bindings page in the Cisco
        ISE UI. Filtering will be based on one attribute only, such as ip/sgt/vn/psn/learnedFrom/learnedBy with CONTAINS mode
        of search.</p>
      parameters:
      - in: header
        name: HTTP ERS-Media-Type Header
        description: Example:- trustsec.acibindings.1.0
        required: false
        schema:
          type: string
      - in: header
        name: HTTP X-CSRF-TOKEN Header
        description: 'Required Only if Enabled from GUI

          Example:- fetch'
        schema:
          type: string
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/bindings'
            application/xml:
              schema:
                $ref: '#/components/schemas/bindings'
  /ers/config/acibindings/versioninfo:
    get:
      tags:
      - acibindings
      summary: Get ACI bindings version information
      description: <p>This API helps to retrieve the version information related to the Cisco ACI bindings.</p>
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
