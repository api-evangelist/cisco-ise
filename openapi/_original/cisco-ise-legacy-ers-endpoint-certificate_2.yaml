    <tr valign=top style=''border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7''><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Example
    Values</b></td></tr>

    <tr><td style=''font-family:monospace''>name</td><td>String</td><td>Yes</td><td>Resource Name</td><td></td></tr>

    <tr valign=top style=''background:#f8f8f8''><td style=''font-family:monospace''>id</td><td>String</td><td>No</td><td>Resource
    UUID, mandatory for update</td><td></td></tr>

    <tr><td style=''font-family:monospace''>description</td><td>String</td><td>No</td><td>Resource Description</td><td></td></tr>

    <tr valign=top style=''background:#f8f8f8''><td style=''font-family:monospace''>certTemplateName</td><td>String</td><td>Yes</td><td>Name
    of an Internal CA template</td><td>Certificate_Template_Name</td></tr>

    <tr><td style=''font-family:monospace''>format</td><td>Enum</td><td>Yes</td><td>Allowed values: <br>- PKCS12,<br>- PKCS12_CHAIN,<br>-
    PKCS8,<br>- PKCS8_CHAIN</td><td>PKCS8</td></tr>

    <tr valign=top style=''background:#f8f8f8''><td style=''font-family:monospace''>password</td><td>String</td><td>Yes</td><td>Protects
