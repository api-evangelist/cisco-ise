    VersionInfo:
      type: object
      properties:
        VersionInfo:
          $ref: '#/components/schemas/version'
    SearchResult:
      type: object
      properties:
        total:
          type: integer
          example: 1
        resources:
          type: array
          example:
          - id: ed7176fb-3faf-4060-845e-d5fa5236bd6e
            link:
              rel: self
              href: https://<ise-ip>:9060/ers/config/telemetryinfo/ed7176fb-3faf-4060-845e-d5fa5236bd6e
              type: application/json
          items:
            properties:
              name:
                type: string
    search:
      type: object
      properties:
        SearchResult:
          $ref: '#/components/schemas/SearchResult'
    version:
      type: object
      properties:
        currentServerVersion:
          type: string
          example: '1.0'
        supportedVersions:
          type: string
          example: '1.0'
        link:
          $ref: '#/components/schemas/link1'
    TelemetryInfo:
      type: object
      properties:
        id:
          type: string
          example: ed7176fb-3faf-4060-845e-d5fa5236bd6e
        status:
          type: string
          example: SCHEnable
        deploymentId:
          type: string
          example: Sed7176fb-3faf-4060-845e-d5fa5236bd6e
        udiSN:
          type: string
          example: CH2MKIEGBGO
        link:
          type: object
          properties:
            rel:
              type: string
              example: self
            href:
              type: string
              example: https://<ise-ip>:9060/ers/config/ers/config/telemetryinfo/ed7176fb-3faf-4060-845e-d5fa5236bd6e
            type:
              type: string
              example: application/json
    link1:
      type: object
