          exampleSetFlag: true
      exampleSetFlag: false
    BindCSRRequest:
      title: BindCSRRequest
      required:
      - allowExtendedValidity
      - allowOutOfDateCert
      - allowReplacementOfCertificates
      - allowReplacementOfPortalGroupTag
      - data
      - hostName
      - id
      type: object
      properties:
        admin:
          type: boolean
          description: ' Use certificate to authenticate the Cisco ISE Admin Portal'
          example: false
          exampleSetFlag: true
        allowExtendedValidity:
          type: boolean
          description: 'Allow import of certificates with validity greater than 398 days '
          example: true
          exampleSetFlag: true
        allowOutOfDateCert:
          type: boolean
          description: 'Allow out of date certificates '
          example: true
          exampleSetFlag: true
        allowReplacementOfCertificates:
          type: boolean
          description: 'Allow Replacement of certificates '
          example: true
          exampleSetFlag: true
        allowReplacementOfPortalGroupTag:
          type: boolean
          description: 'Allow Replacement of Portal Group Tag '
          example: true
          exampleSetFlag: true
        data:
          type: string
          description: 'Signed certificate data '
          example: Plain-text contents of the signed certificate file.
          exampleSetFlag: true
        eap:
          type: boolean
          description: Use certificate for EAP protocols that use SSL/TLS tunneling
          example: false
          exampleSetFlag: true
        hostName:
          type: string
          description: 'Name of Host whose CSR ID has been provided '
          example: Host Name
          exampleSetFlag: true
        id:
          type: string
          description: 'ID of the generated CSR '
          example: CSR ID
          exampleSetFlag: true
        ims:
          type: boolean
          description: Use certificate for the Cisco ISE Messaging Service
          example: false
          exampleSetFlag: true
        name:
          type: string
          description: Friendly Name of the certificate
          example: CA Signed Certificate
          exampleSetFlag: true
        portal:
          type: boolean
          description: Use for portal
          example: false
          exampleSetFlag: true
        portalGroupTag:
          type: string
          description: Set Group tag
          example: Default Portal Certificate Group
          exampleSetFlag: true
        pxgrid:
          type: boolean
          description: Use certificate for the pxGrid Controller
          example: false
          exampleSetFlag: true
        radius:
          type: boolean
          description: Use certificate for the RADSec server
          example: false
          exampleSetFlag: true
        saml:
          type: boolean
          description: Use certificate for SAML Signing
          example: false
          exampleSetFlag: true
        validateCertificateExtensions:
          type: boolean
          description: Validate Certificate Extensions
          example: false
          exampleSetFlag: true
      exampleSetFlag: false
    SystemCertGetByIdRsp:
      title: SystemCertGetByIdRsp
      type: object
      properties:
        response:
          $ref: '#/components/schemas/SystemCertificateResponse'
          exampleSetFlag: true
        version:
          type: string
          exampleSetFlag: true
      exampleSetFlag: false
    CSRRequest:
      title: CSRRequest
      required:
      - digestType
      - keyLength
      - keyType
      - usedFor
      type: object
      properties:
        allowWildCardCert:
          type: boolean
          example: false
          exampleSetFlag: true
        certificatePolicies:
          type: string
          exampleSetFlag: true
        digestType:
          type: string
          exampleSetFlag: true
          enum:
          - SHA-256
          - SHA-384
          - SHA-512
        hostnames:
          type: array
          exampleSetFlag: true
          items:
