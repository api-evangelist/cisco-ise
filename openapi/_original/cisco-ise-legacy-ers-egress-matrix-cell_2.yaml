swagger: '2.0'
info:
  description: "Egress Policy Matrix Cell API allows the client to add, update, delete and search egress matrix cells among\
    \ other operations. \n\n<h2>Revision History</h2>\n<table font-family:monospace>\n<tr valign=top style='border:solid #CCCCCC\
    \ 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Revision #</b></td><td><b>Resource Version</b></td><td><b>Cisco\
    \ ISE Version</b></td><td><b>Description</b></td></tr>\n<tr><td>0</td><td>1.0</td><td>2.0</td><td>Initial Cisco ISE Version</td><td></td></tr>\n\
    <tr style='border-bottom:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#f8f8f8'><td>1</td><td>1.1</td><td>2.3</td><td>Introducing\
    \ bulk operations</td><td></td></tr>\n<tr style='border-bottom:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#f8f8f8'><td>2</td><td>1.2</td><td>3.5</td><td>The\
    \ id attribute is now mandatory. matrixId attribute is optional, by default matrixId will be populated with production\
    \ matrix. Filter the Get call using query param via 'ERSObjectURL'/ers/config/egressmatrixcell?filter=matrixId.eq.ccf9a6ea-153b-4056-b8f4-0dc17eca4d30.\
    \ </td><td></td></tr>\n</table>\n<br><br>\n\n<h2>Resource Definition</h2>\n<table>\n<tr valign=top style='border:solid\
    \ #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7'><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Default\
    \ Values</b></td><td><b>Example Values</b></td></tr>\n<tr><td style='font-family:monospace'>name</td><td>String</td><td>Yes</td><td>Resource\
    \ Name</td><td></td><td>ANY-ANY</td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>id</td><td>String</td><td>No</td><td>Resource\
    \ UUID, mandatory for update</td><td></td><td>f92c1a900-8c01-11e6-996c-525400b48521</td></tr>\n<tr><td style='font-family:monospace'>description</td><td>String</td><td>No</td><td>Resource\
    \ Description</td><td></td><td>Default egress rule</td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>defaultRule</td><td>Enum</td><td>Yes</td><td>Allowed\
    \ values: <br>- NONE, <br>- DENY_IP, <br>- PERMIT_IP</td><td>NONE</td><td>PERMIT_IP</td></tr>\n<tr valign=top style='background:#f8f8f8'><td\
    \ style='font-family:monospace'>matrixCellStatus</td><td>Enum</td><td>Yes</td><td>Allowed values: <br>- DISABLED,<br>-\
    \ ENABLED, <br>- MONITOR</td><td>DISABLED</td><td>ENABLED</td></tr>\n<tr><td style='font-family:monospace'>sgACLs</td><td>List</td><td>Yes</td><td>List\
    \ of IDs of the Security Group ACLs</td><td></td><td>[\"92951ac0-8c01-11e6-996c-525400b48521\"]</td></tr>\n<tr><td style='font-family:monospace'>sourceSgtId</td><td>String</td><td>Yes</td><td></td><td></td><td></td></tr>\n\
    <tr><td style='font-family:monospace'>matrixId</td><td>String</td><td>No</td><td>Default value is Production Matrix Id,\
    \ when no value is provided during creation. To use it as filter, the values should be an UUID of a Matrix. The values\
    \ are case sensitive. For example, '[ERSObjectURL]?filter=matrixId.eq.ccf9a6ea-153b-4056-b8f4-0dc17eca4d30'</td><td></td><td></td></tr>\n\
    </table>\n"
