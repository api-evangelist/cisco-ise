  LocationIdentification:
    type: object
    properties:
      id:
        type: string
        example: 9f083530-8c01-11e6-996c-525400b48521
      name:
        type: string
        example: name
      link:
        type: object
        properties:
          rel:
            type: string
            example: self
          href:
            type: string
            example: https://<ise-ip>:9060/ers/config/ers/config/guestlocation/9ecb5340-8c01-11e6-996c-525400b48521
          type:
            type: string
            example: application/json
  search:
    type: object
    properties:
      SearchResult:
        $ref: '#/definitions/SearchResult'
  SearchResult:
    type: object
    properties:
      total:
        type: integer
        example: 1
      resources:
        type: array
        example:
        - id: 9f083530-8c01-11e6-996c-525400b48521
          name: San Jose
          link:
            rel: self
            href: https://<ise-ip>:9060/ers/config/ers/config/guestlocation/9f083530-8c01-11e6-996c-525400b48521
            type: application/json
        items:
          properties:
            name:
              type: string
  VersionInfo:
    type: object
    properties:
      VersionInfo:
