    address of the endpoint</td><td>00:11:22:33:44:55</td></tr>

    <tr style=''border-bottom:solid #CCCCCC 1.0pt''><td style=''font-family:monospace''>policyName</td><td>String</td><td>Yes</td><td>Policy
    name to be applied to the endpoint</td><td>policy1</td></tr>

    </table>


    <h2>Supported ANC API transactions per second</h2>

    On a 5 node Cisco ISE deployment with 60k sessions or on a 9 node Cisco ISE deployment with 200k/500k sessions, 250 transactions
    per second (TPS) is supported for any ANC API.<br>

    <br><b>Supported ANC APIs</b><br>

    * applyEndpointByMacAddress

    * clearEndpointByMacaddress

    * applyEndpointByIpAddress

    * applyEndpointPolicy

    * clearEndpointPolicy


