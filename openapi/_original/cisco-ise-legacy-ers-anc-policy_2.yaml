swagger: '2.0'
info:
  description: 'Adaptive Network Control (ANC) provides the ability to create network endpoint authorization controls based
    on ANC policies.


    <h2>Revision History</h2>

    <table font-family:monospace>

    <tr valign=top style=''border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7''><td><b>Revision
    #</b></td><td><b>Resource Version</b></td><td><b>Cisco ISE Version</b></td><td><b>Description</b></td></tr>

    <tr style=''border-bottom:solid #CCCCCC 1.0pt''><td>0</td><td>1.0</td><td>2.1</td><td>Initial Cisco ISE Version</td><td></td></tr>

    </table>

    <br><br>


    <h2>Resource Definition</h2>

    <table>

    <tr valign=top style=''border:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt;background:#DEEDF7''><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Example
    Values</b></td></tr>

    <tr><td style=''font-family:monospace''>name</td><td>String</td><td>Yes</td><td>Resource Name</td><td></td></tr>

    <tr valign=top style=''background:#f8f8f8''><td style=''font-family:monospace''>id</td><td>String</td><td>No</td><td>Resource
    ID</td><td>test</td></tr>

    <tr><td style=''font-family:monospace''>description</td><td>String</td><td>No</td><td>Resource Description</td><td></td></tr>

    <tr valign=top style=''background:#f8f8f8;mso-border-alt:solid #CCCCCC .75pt;border-bottom:solid #CCCCCC 1.0pt'';><td
    style=''font-family:monospace''>action</td><td>Enum</td><td>Yes</td><td>- QUARANTINE: Allows you to use Exception policies
    (authorization policies) to limit or deny an endpoint access to the network. <br>- PORTBOUNCE: Resets the port on the
    network device to which the endpoint is connected<br>- SHUTDOWN : Shuts down the port on the network device to which the
    endpoint is connected<br>- REAUTHENTICATE: Forces the target client to re-authenticate and optionally implement an updated
    policy</td><td>SHUTDOWN</td></tr>

