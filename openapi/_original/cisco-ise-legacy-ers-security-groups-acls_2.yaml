info:
  description: "Security Groups ACLs API allows the client to search security groups access control lists.\n\n<h2>Revision\
    \ History</h2>\n<table font-family:monospace> \n<tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid\
    \ #CCCCCC .75pt;background:#DEEDF7'><td><b>Revision #</b></td><td><b>Resource Version</b></td><td><b>Cisco ISE Version</b></td><td><b>Description</b></td><td\
    \ colspan =\"2\"><b>Revision Modification</b></td></tr>\n<tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid\
    \ #CCCCCC .75pt;background:#DEEDF7'><td></td><td></td><td></td><td></b></td><td><b>Attribute</b></td><td><b>Description</b></td></tr>\n\
    <tr><td>0</td><td>1.0</td><td>2.0</td><td>Initial Cisco ISE Version</td><td></td><td></td></tr>\n<tr valign=top style='background:#f8f8f8'><td>1</td><td>1.1</td><td>2.3</td><td>Introducing\
    \ bulk operations</td><td></td><td></td></tr>\n<tr style='border-bottom:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC\
    \ .75pt'><td>2</td><td>1.4</td><td>3.1</td><td>Cisco ISE 3.1 model changes</td><td>modelledContent</td><td>Adding modelled\
    \ content from Cisco ISE 3.1</td></tr>\n<tr style='border-bottom:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt'><td>3</td><td>1.5</td><td>3.5</td><td>Type\
    \ of SGACL, TRUSTSEC or TRAFFIC_STEERING</td><td>sgAclType</td><td>Filter SGACL based on its Type using query param 'ERSObjectURL'/ers/config/sgacl?filter=sgAclType.eq.traffic_steering.</td></tr>\n\
    <tr style='border-bottom:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt'><td>4</td><td>1.6</td><td>3.5 Patch 2</td><td>Enforce\
    \ ACL content validation</td><td>validateAclContent</td><td>Added optiponal SGACL validation flag from ISE 3.5 patch2.</td></tr>\n\
    </table>\n<br><br>\n\n<h2>Resource Definition</h2>\n<table>\n<tr valign=top style='border:solid #CCCCCC 1.0pt;mso-border-alt:solid\
    \ #CCCCCC .75pt;background:#DEEDF7'><td><b>Attribute</b></td><td><b>Type</b></td><td><b>Required</b></td><td><b>Description</b></td><td><b>Default\
    \ Values</b></td><td><b>Example Values</b></td></tr>\n<tr><td style='font-family:monospace'>name</td><td>String</td><td>Yes</td><td>Resource\
    \ Name</td><td></td><td>Permit IP</td></tr>\n<tr valign=top style='background:#f8f8f8'><td style='font-family:monospace'>id</td><td>String</td><td>No</td><td>Resource\
    \ UUID, mandatory for update</td><td><td>92951ac0-8c01-11e6-996c-525400b48521</td></tr>\n<tr><td style='font-family:monospace'>description</td><td>String</td><td>No</td><td></td><td></td><td>Permit\
    \ IP SGACL</td></tr>\n<tr style= 'background:#f8f8f8'><td style='font-family:monospace'>ACLContent</td><td>String</td><td>No</td><td></td><td></td><td>permit\
    \ ip</td></tr>\n<tr><td style='font-family:monospace'>ipVersion</td><td>Enum</td><td>Yes</td><td>Allowed values:<br>-\
    \ IPV4,<br>- IPV6,<br>- IP_AGNOSTIC</td><td>IPV4</td><td></td></tr>\n<tr style= 'background:#f8f8f8'><td style='font-family:monospace'>isReadOnly</td><td>Boolean</td><td>No</td><td></td><td>false</td><td></td></tr>\n\
    <tr><td style='font-family:monospace'>generationId</td><td>String</td><td>No</td><td>GenerationId is a read only attribute\
    \ and is being generated by the server</td><td></td><td>0</td></tr>\n<tr><td style='font-family:monospace'>sgAclType</td><td>Enum</td><td>No</td><td>SGACL\
    \ type - Trustsec or Traffic Steering. To use it as filter, the values should be 'TRAFFIC_STEERING' or 'TRUSTSEC'. The\
    \ values are case sensitive. For example, '[ERSObjectURL]?filter=sgAclType.eq.TRUSTSEC' or '[ERSObjectURL]?filter=sgAclType.eq.TRAFFIC_STEERING'</td><td></td><td>TRUSTSEC</td></tr>\n\
    <tr><td style='font-family:monospace'>validateAclContent</td><td>Boolean</td><td>No</td><td>Enforce SGACL syntax validation</td><td>false</td><td></td></tr>\n\
    <tr style= 'background:#f8f8f8;border-bottom:solid #CCCCCC 1.0pt;mso-border-alt:solid #CCCCCC .75pt'><td style='font-family:monospace'>modelledContent</td><td>List</td><td>No</td><td>Modelled\
    \ content of contract</td><td></td><td></td></tr>\n\n</table>\n"
